      takie z rzędu. Słupek kreskowany oznacza, że rekordem miesiąca była
      sesja na Zwifcie; 41 km na trenażerze to nie to samo co 41 km na szosie.
      Zielona linia to cel ${CEL_KM} km z planu, szara — Twój obecny rekord.
    </p>
    ${wykresDlugich()}
    <div class="legenda">
      <span><i style="background:var(--akcent);opacity:.75"></i>na dworze</span>
      <span>${ikonaDyscypliny("VirtualRide",15)} Zwift — słupek kreskowany</span>
      <span style="color:var(--plan)"><i class="kreska"></i><span
        style="color:var(--slaby)">cel ${CEL_KM} km</span></span>
      <span style="color:var(--slaby)"><i class="kreska"></i>rekord ${liczba(rekordKm,1)} km</span>
    </div>
    <div class="info" id="info-miesiac">Dotknij słupka, żeby zobaczyć szczegóły jazdy.</div>
  </section>

  <section>
    <div class="kafelki">
      <div class="kafel">
        <div class="etykieta">Rekord</div>
        <div class="liczba">${liczba(rekordKm,1)}</div>
        <div class="stopka">${ikonaDyscypliny(rekordMies.naj.typ,13)}
          km · ${pl(rekordMies.naj.data)}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Cel</div>
        <div class="liczba" style="color:var(--plan)">${CEL_KM}</div>
        <div class="stopka">km · niedzielna długa</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Brakuje do celu</div>
        <div class="liczba">${liczba(brakuje,1)}</div>
        <div class="stopka">km · ${liczba(100*rekordKm/CEL_KM,0)}% celu</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Miesiące z jazdą</div>
        <div class="liczba">${zJazda}</div>
        <div class="stopka">z ${miesiace.length} w zakresie</div>
      </div>
    </div>
  </section>`;
};

/* ==========================================================================
   SEGMENTY — tabela z sortowaniem

   Dane: dwie tablice w dane.js. "segmenty" to metadane (nazwa, długość,
   nachylenie ze Stravy), "proby" to pojedyncze przejazdy (czas). Wszystko
   pozostałe — najlepszy czas, liczba prób, moc — liczy się tutaj, przy
   wyświetlaniu, zgodnie z wariantem B.
   ========================================================================== */

// Nazwy segmentów pisali inni ludzie i bywa w nich wszystko: strzałki "->",
// ampersandy, emoji. Wstawienie takiego tekstu prosto do HTML-a potrafi
// rozsypać stronę, więc każdy znak specjalny zamieniamy na jego zapis.
function bezpieczny(t){
  return String(t).replace(/[&<>"]/g, z =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[z]);
}

function czasNaTekst(sek){
  const h = Math.floor(sek/3600), m = Math.floor(sek%3600/60), s2 = sek%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s2).padStart(2,"0")}`
           : `${m}:${String(s2).padStart(2,"0")}`;
}
function dlugoscNaTekst(m){
  return m < 1000 ? `${Math.round(m)} m` : `${liczba(m/1000,2)} km`;
}
function procentNaTekst(x){
  return (x < 0 ? "\u2212" : "") + liczba(Math.abs(x),1) + "%";
}

/* Moc pokazujemy WYŁĄCZNIE zmierzoną — nigdy policzoną z modelu.

   Do 20.08.2026 stała tu estymata [E] z fizyki: P = ½ρ·CdA·v³ + Crr·m·g·v +
   m·g·(Δh/t). Liczba wyglądała solidnie i była nieweryfikowalna: siedzi w niej
   CdA 0,38 z tagiem [?], a liczona ze średniej prędkości zaniża na zrywach
   (kontrola na Bump 2: 471 W wobec 493 W z pełnego wyliczenia). Decyzja
   Fryderyka: dopóki nie ma czym tego sprawdzić, kolumna ma być pusta.

   Zostaje więc tylko moc, która naprawdę została zmierzona. Dziś jest to
   wyłącznie Zwift — trenażer podaje waty do pliku, więc segmenty z X-XI 2025
   mają je naprawdę. Na szosie Strava nie oddaje mocy segmentu przez API
   (sprawdzone: 0 z 1385 przejazdów), bo na rowerze nie ma miernika.

   Ta zasada zadziała sama, gdy miernik się pojawi: liczba wjedzie do kolumny
   w dniu, w którym Strava zacznie ją przysyłać. Nic tu nie trzeba zmieniać. */

const SEGMENTY = (() => {
  const meta = new Map((D.segmenty || []).map(x => [x.id, x]));
  const jazdaPo = new Map(D.aktywnosci.map(a => [a.id, a]));
  const grupy = new Map();
  for (const p of (D.proby || [])){
    if (!grupy.has(p.s)) grupy.set(p.s, []);
    grupy.get(p.s).push(p);
  }
  const wynik = [];
  for (const [id, proby] of grupy){
    const m = meta.get(id);
    if (!m) continue;                       // metadane bez prób i odwrotnie — pomijamy
    const naj = proby.reduce((a,b) => b.czas_s < a.czas_s ? b : a);
    const jazda = jazdaPo.get(naj.a);
    wynik.push({
      id, nazwa: m.nazwa,
      dystans: m.dystans_m,
      nachylenie: m.nachylenie_proc,
      czas: naj.czas_s,
      // Prędkość liczy się tutaj, a nie w danych — wariant B. Dwie liczby,
      // które już są (długość i czas), nie potrzebują trzeciej w pliku.
      predkosc: naj.czas_s ? (m.dystans_m / naj.czas_s) * 3.6 : null,
      // Tylko pomiar. Brak liczby to uczciwa odpowiedź, nie brak funkcji.
      moc: naj.moc_S,
      mocZMiernika: naj.z_miernika === 1,
      // Zwift czy szosa — bierzemy z jazdy, w której padł najlepszy czas,
      // bo to jej dotyczą wszystkie liczby w wierszu.
      zwift: jazda ? jazda.typ === "VirtualRide" : false,
      // Jazda, z której pochodzą wszystkie liczby w wierszu — potrzebna,
      // żeby powiedzieć, czy ten najlepszy czas padł przy sterowanej mocy.
      jazdaNaj: jazda || null,
      prob: proby.length,
      data: jazda ? jazda.data.slice(0,10) : null
    });
  }
  return wynik;
})();

const IKONY_KOLUMN = {
  az:    `<span style="font-size:10.5px;letter-spacing:.02em">A→Z</span>`,
  czas:  `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><circle cx="8" cy="9" r="5.6"/><path d="M8 5.8V9l2.2 1.6M6 1.6h4"/></svg>`,
  dlugosc: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M1.5 6.5h13v3h-13zM4.5 6.5v1.6M7.5 6.5v2.4M10.5 6.5v1.6"/></svg>`,
  nachylenie: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M1.5 13.5h13L1.5 4.2z"/></svg>`,
  moc:   `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path
            d="M9.2 1.2 3.4 9h3.4l-.9 5.8L12.6 7H9.1z"/></svg>`,
  predkosc: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"><path d="M2.2 12.4a6.4 6.4 0 1 1 11.6 0"/>
            <path d="M8 11 11 6.4"/></svg>`,
  proby: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M2 12.5c0-2 1.4-3.4 3-3.4s3 1.4 3 3.4M8 12.5c0-2 1.4-3.4 3-3.4
            s3 1.4 3 3.4"/><circle cx="5" cy="4.6" r="2.1"/><circle cx="11" cy="4.6" r="2.1"/></svg>`
};

// Kierunek PIERWSZEGO kliknięcia. Nazwa od A, czas od najkrótszego, reszta od
// największej wartości — bo tak zwykle chce się patrzeć. Drugie kliknięcie
// odwraca, trzecie znowu i tak w kółko.
const KOLUMNY = [
  { k:"nazwa",      etykieta:"Segment",   ikona:IKONY_KOLUMN.az,    tekst:true, malejaco:false },
  { k:"czas",       etykieta:"Najlepszy", ikona:IKONY_KOLUMN.czas,               malejaco:false },
  { k:"predkosc",   etykieta:"Prędkość",  ikona:IKONY_KOLUMN.predkosc,           malejaco:true  },
  { k:"dystans",    etykieta:"Długość",   ikona:IKONY_KOLUMN.dlugosc,            malejaco:true  },
  { k:"nachylenie", etykieta:"Nachylenie",ikona:IKONY_KOLUMN.nachylenie,         malejaco:true  },
  { k:"moc",        etykieta:"Moc",       ikona:IKONY_KOLUMN.moc,                malejaco:true  },
  { k:"prob",       etykieta:"Próby",     ikona:IKONY_KOLUMN.proby,              malejaco:true  }
];

// Wartości domyślne trzymane osobno, bo krzyżyk musi umieć do nich wrócić.
// Gdyby siedziały tylko w tych zmiennych, reset kopiowałby je po raz drugi
// i któraś kopia kiedyś by się rozjechała.
const DOMYSLNIE = { klucz:"prob", malejaco:true, filtr:"wszystkie", szukaj:"" };

// Filtry wykluczają się wzajemnie — dlatego jedna wartość, a nie cztery
// niezależne przełączniki. "Z pomiarem mocy" i "bez pomiaru" to dziś podział
// na Zwift i szosę, ale reguła jest napisana na pomiarze, nie na dyscyplinie:
// w dniu, w którym na rowerze pojawi się miernik, filtr sam zacznie znaczyć
// to, co powinien, bez ruszania kodu.
const FILTRY = [
  { id:"wszystkie",   etykieta:"Wszystkie",             pasuje: () => true },
  { id:"wielokrotne", etykieta:"Przejechane więcej niż raz", pasuje: x => x.prob > 1 },
  { id:"zmoca",       etykieta:"Z pomiarem mocy",       pasuje: x => x.moc != null },
  { id:"bezmocy",     etykieta:"Bez pomiaru mocy",      pasuje: x => x.moc == null }
];

let sortKlucz = DOMYSLNIE.klucz, sortMalejaco = DOMYSLNIE.malejaco,
    filtr = DOMYSLNIE.filtr, szukaj = DOMYSLNIE.szukaj;

// Szukanie ma nie zależeć od wielkości liter ani od ogonków: wpisane "petla"
// musi znaleźć "Pętla". NFD rozkłada literę na znak i ogonek, który potem
// wycinamy; ł nie ma takiego rozkładu, więc idzie osobno.
function bezOgonkow(t){
  const x = String(t).toLowerCase().replace(/ł/g, "l");
  try { return x.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  catch(e){ return x; }
}

function posortowane(){
  const kol = KOLUMNY.find(x => x.k === sortKlucz);
  const fraza = bezOgonkow(szukaj.trim());
  const przepuszcza = (FILTRY.find(f => f.id === filtr) || FILTRY[0]).pasuje;
  const lista = SEGMENTY.filter(x =>
    przepuszcza(x) && (!fraza || bezOgonkow(x.nazwa).includes(fraza)));
  return lista.sort((a,b) => {
    const x = a[sortKlucz], y = b[sortKlucz];
    if (x == null && y == null) return 0;
    if (x == null) return 1;                 // puste zawsze na końcu, w obie strony
    if (y == null) return -1;
    const r = kol.tekst ? String(x).localeCompare(String(y), "pl") : x - y;
    return sortMalejaco ? -r : r;
  });
}

function wierszeSegmentow(){
  const lista = posortowane();
  if (!lista.length) return `
    <tr><td colspan="7" class="pusty-wynik">Żaden segment nie ma
      „${bezpieczny(szukaj.trim())}" w nazwie.</td></tr>`;
  return lista.map(x => `
    <tr>
      <td class="${sortKlucz==="nazwa"?"akt":""}">
        <a class="seg-nazwa" href="#postepy/porownania/${x.id}"
           title="Pokaż wszystkie próby na tym segmencie">${x.zwift
          ? `<span class="seg-zwift" title="Zwift — trenażer, nie szosa">${
              ikonaDyscypliny("VirtualRide",14)}</span>` : ""}${bezpieczny(x.nazwa)}${
          znacznikErg(x.jazdaNaj, "Najlepszy czas padł na treningu ze sterowaną mocą")}<span
          class="strzalka-wew" aria-hidden="true">›</span></a>
        <span class="seg-data">${x.zwift ? "Zwift · " : ""}${
          x.data ? "najlepsza próba " + pl(x.data) : ""}</span>
      </td>
      <td class="${sortKlucz==="czas"?"akt":""}">${czasNaTekst(x.czas)}</td>
      <td class="${sortKlucz==="predkosc"?"akt":""}">${
        x.predkosc == null ? "—" : liczba(x.predkosc,1) + " km/h"}</td>
      <td class="${sortKlucz==="dystans"?"akt":""}">${dlugoscNaTekst(x.dystans)}</td>
      <td class="${sortKlucz==="nachylenie"?"akt":""}">${
        x.nachylenie == null ? "—" : procentNaTekst(x.nachylenie)}</td>
      <td class="${sortKlucz==="moc"?"akt":""}"${
        x.moc == null ? ' title="Brak pomiaru mocy — nie zgadujemy"' : ""
      }>${x.moc == null ? "—" : Math.round(x.moc) + " W"}</td>
      <td class="${sortKlucz==="prob"?"akt":""}">${x.prob}</td>
    </tr>`).join("");
}

// Ile z ilu — bez tego przy włączonym szukaniu nie widać, czy lista jest
// krótka, bo taka jest, czy dlatego, że coś zostało odfiltrowane.
function podsumowanieSegmentow(){
  const widac = posortowane().length;
  const czynne = szukaj.trim() || filtr !== DOMYSLNIE.filtr;
  return czynne
    ? `Widać <b>${widac}</b> z ${SEGMENTY.length} segmentów.`
      + (szukaj.trim() ? ` Szukane: „${bezpieczny(szukaj.trim())}".` : "")
      + ` Krzyżyk czyści szukanie, filtr i sortowanie.`
    : `Wszystkie ${SEGMENTY.length} segmentów. Sortowanie: `
      + `${KOLUMNY.find(k => k.k === sortKlucz).etykieta.toLowerCase()}, `
      + `${sortMalejaco ? "malejąco" : "rosnąco"}.`;
}

function naglowkiSegmentow(){
  return KOLUMNY.map(kol => `
    <th class="${sortKlucz===kol.k?"akt":""}">
      <button type="button" data-k="${kol.k}"
        title="Sortuj po: ${kol.etykieta}">${kol.ikona}<span>${kol.etykieta}</span>${
        sortKlucz===kol.k ? `<span class="strzalka-sort">${sortMalejaco?"▼":"▲"}</span>` : ""
      }</button>
    </th>`).join("");
}

const tabelaSegmentow = () => {
  const wielokrotne = SEGMENTY.filter(x => x.prob > 1).length;
  const ZWIFTOWYCH = SEGMENTY.filter(x => x.moc != null).length;
  const najwiecej = SEGMENTY.reduce((a,b) => b.prob > a.prob ? b : a, {prob:0});
  return `
  <section>
    <h2>Segmenty</h2>
    <p class="opis">
      Każdy segment, który przejechałeś od ${pl(D.meta.segmenty_od)} —
      ${SEGMENTY.length} sztuk, ${(D.proby||[]).length} przejazdów.
      Wszystkie liczby pochodzą z <b>najlepszej próby</b>. Dotknij nagłówka,
      żeby posortować; dotknij drugi raz, żeby odwrócić kolejność.
      Sylwetka ekranu oznacza segment ze Zwiftu — tak samo jak słupek
      kreskowany na wykresie długich jazd.
    </p>
    <p class="opis">
      <b>Moc pokazujemy tylko tam, gdzie została zmierzona.</b> Dziś to
      wyłącznie Zwift (${ZWIFTOWYCH} ${ZWIFTOWYCH === 1 ? "segment" :
      ZWIFTOWYCH < 5 ? "segmenty" : "segmentów"}): trenażer zapisuje waty do
      pliku. Na szosie Strava nie oddaje mocy segmentu przez API, bo na rowerze
      nie ma miernika — dlatego stoi tam kreska, a nie liczba. Wcześniej była
      w tym miejscu estymata z modelu fizycznego; wyleciała, bo nie ma dziś
      czym jej sprawdzić, a liczba, której nie da się zweryfikować, wygląda
      dokładnie jak pomiar. Kolumna wypełni się sama w dniu, w którym pojawi
      się miernik mocy.
      <br>Najlepszy czas nie odróżnia jazdy solo od jazdy w grupie ani wiatru
      — rekord z koła kolegi wygląda tu tak samo jak samotny.
    </p>
    <div class="przelaczniki">
      <div class="grupa-filtry">
        ${FILTRY.map(f => `<button type="button" data-filtr="${f.id}"
          class="${filtr === f.id ? "akt" : ""}">${f.etykieta} (${
          SEGMENTY.filter(f.pasuje).length})</button>`).join("")}
      </div>
      <div class="grupa-szukaj">
        <label class="szukajka">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>
          <input id="szukaj-segmentu" type="search" enterkeyhint="search"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Szukaj w nazwie" aria-label="Szukaj w nazwie segmentu"
            value="${bezpieczny(szukaj)}">
        </label>
        <button type="button" id="reset-segmentow"
          title="Wyczyść szukanie, filtr i sortowanie"
          aria-label="Wyczyść szukanie, filtr i sortowanie">&times;</button>
      </div>
    </div>
    <div class="tabelka">
      <table class="segmenty">
        <thead><tr id="naglowki-segmentow">${naglowkiSegmentow()}</tr></thead>
        <tbody id="wiersze-segmentow">${wierszeSegmentow()}</tbody>
      </table>
    </div>
    <div class="info" id="info-segmentow">${podsumowanieSegmentow()}</div>
  </section>

  <section>
    <div class="kafelki">
      <div class="kafel">
        <div class="etykieta">Segmentów</div>
        <div class="liczba">${SEGMENTY.length}</div>
        <div class="stopka">${wielokrotne} więcej niż raz</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Przejazdów</div>
        <div class="liczba">${(D.proby||[]).length}</div>
        <div class="stopka">z ${(D.segmenty_pobrane||[]).length} jazd</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Najczęstszy segment</div>
        <div class="liczba">${najwiecej.prob}</div>
        <div class="stopka">${najwiecej.nazwa ? bezpieczny(najwiecej.nazwa) : "—"}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Najdłuższy</div>
        <div class="liczba">${liczba(Math.max(...SEGMENTY.map(x=>x.dystans))/1000,1)}</div>
        <div class="stopka">km</div>
      </div>
    </div>
  </section>`;
};

function podepnijTabele(){
  const naglowki = document.getElementById("naglowki-segmentow");
  if (!naglowki) return;
  // Przerysowujemy WYŁĄCZNIE nagłówki, wiersze i podsumowanie. Gdyby odświeżać
  // cały blok, pole szukania powstawałoby od nowa przy każdym wciśniętym
  // klawiszu i za każdym razem gubiłoby kursor razem z klawiaturą iPada.
  const odswiez = () => {
    naglowki.innerHTML = naglowkiSegmentow();
    document.getElementById("wiersze-segmentow").innerHTML = wierszeSegmentow();
    const info = document.getElementById("info-segmentow");
    if (info) info.innerHTML = podsumowanieSegmentow();
  };
  naglowki.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const k = b.dataset.k;
    if (k === sortKlucz) sortMalejaco = !sortMalejaco;
    else { sortKlucz = k; sortMalejaco = KOLUMNY.find(x => x.k === k).malejaco; }
    odswiez();
  });
  const zaznaczFiltr = () => document.querySelectorAll(".grupa-filtry button")
    .forEach(x => x.classList.toggle("akt", x.dataset.filtr === filtr));

  document.querySelectorAll(".grupa-filtry button").forEach(b => {
    b.addEventListener("click", () => {
      filtr = b.dataset.filtr;
      zaznaczFiltr();
      odswiez();
    });
  });

  const pole = document.getElementById("szukaj-segmentu");
  if (pole){
    // Lista przesiewa się przy każdej literze — przy 365 wierszach jest to
    // niezauważalne, a nie trzeba nic zatwierdzać. Enter niczego nie zmienia
    // w wyniku, tylko chowa klawiaturę, żeby było widać całą tabelę.
    pole.addEventListener("input", () => { szukaj = pole.value; odswiez(); });
    pole.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); pole.blur(); }
    });
  }

  const krzyzyk = document.getElementById("reset-segmentow");
  if (krzyzyk) krzyzyk.addEventListener("click", () => {
    sortKlucz = DOMYSLNIE.klucz;
    sortMalejaco = DOMYSLNIE.malejaco;
    filtr = DOMYSLNIE.filtr;
    szukaj = DOMYSLNIE.szukaj;
    if (pole) pole.value = "";
    zaznaczFiltr();
    odswiez();
    // Tabela bywa przewinięta w bok — reset ma oddać widok, jaki był na wejściu.
    const ramka = document.querySelector(".tabelka");
    if (ramka) ramka.scrollLeft = 0;
  });
}

/* ==========================================================================
   PORÓWNANIA S — wszystkie próby jednego segmentu

   Wybrany segment żyje w adresie (#postepy/porownania/<id>), a nie w zmiennej.
   Dzięki temu dotknięcie nazwy w tabeli, przycisk wstecz i odświeżenie strony
   robią to samo, bez trzeciego stanu do pilnowania.

   Oś czasu zaczyna się od ZERA, choć przy próbach różniących się o sekundy
   słupki wyglądają wtedy niemal identycznie. Ucięta oś pokazywałaby poprawę
   z 1527 na 1503 s jako przepaść — a to 1,6%. Skoro słupek ma znaczyć czas,
   jego wysokość musi być czasowi proporcjonalna. Dokładne liczby i różnicę
   do rekordu podaje panel pod wykresem.
   ========================================================================== */

const JAZDA_PO_ID = new Map(D.aktywnosci.map(a => [a.id, a]));

function probySegmentu(id){
  return (D.proby || [])
    .map((x, i) => ({ ...x, i }))
    .filter(x => x.s === id)
    .map(x => ({ ...x, jazda: JAZDA_PO_ID.get(x.a) }))
    .filter(x => x.jazda)
    .sort((a,b) => a.jazda.data === b.jazda.data ? a.i - b.i
                 : (a.jazda.data < b.jazda.data ? -1 : 1));
}

function roznicaCzasu(sek){
  const znak = sek > 0 ? "+" : "−";
  const a = Math.abs(sek);
  return znak + (a < 60 ? `${a} s` : czasNaTekst(a));
}


// Geometria wspólna dla wszystkich wykresów w tej zakładce. Ta sama szerokość
// słupka, ten sam odstęp i ta sama szerokość osi — dzięki temu punkt na każdej
// linii stoi DOKŁADNIE nad słupkiem tej samej próby, a wszystkie ramki
// przewijają się jak jedna.
const G = { szerSlupka:34, odstep:8, szerOsi:46, marGora:26 };
const xProby = i => 12 + i*(G.szerSlupka+G.odstep);
const szerProb = n => n*(G.szerSlupka+G.odstep) + 26;

// Krok podziałki dobierany z listy wartości, które człowiek czyta bez liczenia:
// 15 s, pół minuty, minuta, pięć minut. 7-sekundowa działka byłaby bezużyteczna.
const DZIALKI_CZASU = [5,10,15,20,30,60,120,300,600,900,1800,3600];

/* Wybór próby NIE przerysowuje wykresów. Wszystkie etykiety są narysowane od
   razu i schowane przezroczystością, a zaznaczenie to wyłącznie przełożenie
   klasy. Przerysowywanie kasowało węzły SVG, więc animacja wyrastania grała
   od nowa przy każdym dotknięciu słupka i wykres "ładował się od zera". */
function wykresProb(lista, wybrany, najlepszyCzas){
  // Miejsce pod datą na podpis ERG — bez tego napis wchodziłby na oś.
  const maErg = lista.some(x => jestErg(x.jazda));
  // Przy remisie rekordem jest próba, w której czas padł PIERWSZY raz.
  // Bez tego cztery jednakowe przejazdy dostawały cztery napisy „PB",
  // a na pasach niżej zieleń stała tylko przy jednym — dwie różne odpowiedzi
  // na to samo pytanie.
  const iPB = lista.findIndex(x => x.czas_s === najlepszyCzas);
  const wys = 230, marDol = maErg ? 56 : 42;
  const szer = szerProb(lista.length);
  const gora = Math.max(...lista.map(x => x.czas_s)) * 1.1;
  const krok = DZIALKI_CZASU.find(k => gora/k <= 6) || 3600;
  const podzialka = []; for (let v = 0; v <= gora; v += krok) podzialka.push(v);
  const skala = t => (t/gora) * wys;
  const wysCalk = wys + G.marGora + marDol;

  let os = `<svg class="os" width="${G.szerOsi}" height="${wysCalk}" aria-hidden="true">`;
  for (const v of podzialka)
    os += `<text x="${G.szerOsi-6}" y="${G.marGora+wys-skala(v)+4}" text-anchor="end"
            font-size="10" fill="var(--slaby)">${czasNaTekst(v)}</text>`;
  os += `</svg>`;

  let g = `<svg width="${szer}" height="${wysCalk}" role="img"
    aria-label="Czasy wszystkich prób na segmencie">
    <defs>
      <pattern id="krata-proby" width="7" height="7" patternUnits="userSpaceOnUse"
               patternTransform="rotate(45)">
        <rect width="7" height="7" fill="var(--seria-czas)" opacity=".22"/>
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--seria-czas)" stroke-width="3.4"/>
      </pattern>
    </defs>`;
  for (const v of podzialka){
    const y = G.marGora + wys - skala(v);
    g += `<line x1="0" y1="${y}" x2="${szer}" y2="${y}"
           stroke="var(--linia)" stroke-width="1"/>`;
  }
  const yRek = G.marGora + wys - skala(najlepszyCzas);
  g += `<line x1="0" y1="${yRek}" x2="${szer}" y2="${yRek}"
         stroke="var(--plan)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>`;

  lista.forEach((pr, i) => {
    const h = Math.max(skala(pr.czas_s), 2);
    const y = G.marGora + wys - h;
    const zwift = pr.jazda.typ === "VirtualRide";
    const pb = i === iPB;
    g += `<rect x="${xProby(i)}" y="${y}" width="${G.szerSlupka}" height="${h}"
           fill="${zwift ? "url(#krata-proby)" : pb ? "var(--plan)" : "var(--seria-czas)"}"
           rx="2" data-i="${i}"
           class="proba${pb ? " pb" : ""}${i === wybrany ? " wybrany" : ""}"
           style="animation-delay:${Math.min(i*30,500)}ms"/>`;
    // Rekord niesie kolor ORAZ podpis — sam kolor znika na wydruku i przy
    // daltonizmie, a tu chodzi o wskazanie jednej konkretnej próby.
    if (pb)
      g += `<text x="${xProby(i)+G.szerSlupka/2}" y="${y-7}" text-anchor="middle"
             font-size="9.5" font-weight="700" fill="var(--plan)">PB</text>`;
    g += `<text x="${xProby(i)+G.szerSlupka/2}" y="${y-22}" text-anchor="middle"
           font-size="11" font-weight="600" data-i="${i}"
           fill="${pb ? "var(--plan)" : "var(--tekst)"}"
           class="etykieta-proby${i === wybrany ? " wybrany" : ""}"
           >${czasNaTekst(pr.czas_s)}</text>`;
  });

  let rokPop = null;
  lista.forEach((pr, i) => {
    const d = pr.jazda.data;
    g += `<text x="${xProby(i)+G.szerSlupka/2}" y="${G.marGora+wys+16}" text-anchor="middle"
           font-size="9.5" fill="var(--slaby)">${d.slice(8,10)}.${d.slice(5,7)}</text>`;
    if (d.slice(0,4) !== rokPop){
      g += `<text x="${xProby(i)+G.szerSlupka/2}" y="${G.marGora+wys+31}" text-anchor="middle"
             font-size="9.5" font-weight="600" fill="var(--slaby)">${d.slice(0,4)}</text>`;
      rokPop = d.slice(0,4);
    }
    // Podpis przy każdej próbie ze sterowaną mocą — na wykresie ma być widać,
    // które słupki mówią o zawodniku, a które o tym, co kazał program.
    if (jestErg(pr.jazda))
      g += `<text x="${xProby(i)+G.szerSlupka/2}" y="${G.marGora+wys+45}" text-anchor="middle"
             font-size="9" font-weight="700" letter-spacing=".04em"
             fill="var(--seria-moc)">ERG</text>`;
  });
  g += `<line x1="0" y1="${G.marGora+wys}" x2="${szer}" y2="${G.marGora+wys}"
         stroke="var(--slaby)" stroke-width="1"/></svg>`;
  return `<div class="wykres">${os}<div class="ramka">${g}</div></div>`;
}

/* SERIE LINIOWE — prędkość, moc, tętno.

   Każda miara dostaje WŁASNY pas z własną osią, jeden pod drugim, zamiast
   trzech skal wciśniętych w jeden rysunek. Powód jest ten sam, dla którego
   czas i prędkość są dwoma wykresami: przy dwóch osiach na jednym obrazku
   wystarczy przesunąć zakres jednej z nich, żeby linie się przecięły albo
   rozjechały — i dowieść dowolnej tezy o tym, że moc "idzie za" prędkością.
   Wspólna oś pozioma i wspólne zaznaczenie sprawiają, że czyta się to jak
   jeden wykres, tylko bez tej pułapki.

   Pas pojawia się TYLKO wtedy, gdy dane istnieją. Moc mają dziś wyłącznie
   próby ze Zwiftu; tętno nie ma jeszcze żadna, więc pas tętna zjawi się sam
   pierwszego dnia, w którym Garmin zacznie je zapisywać. Nic nie trzeba
   będzie zmieniać w kodzie. */

const SERIE = [
  { klucz:"predkosc", nazwa:"Prędkość", jednostka:"km/h", miejsc:1,
    kolor:"var(--seria-predkosc)", dzialki:[0.5,1,2,2.5,5,10],
    wartosc:(pr,seg) => pr.czas_s ? (seg.dystans_m / pr.czas_s) * 3.6 : null },
  { klucz:"moc", nazwa:"Moc", jednostka:"W", miejsc:0,
    kolor:"var(--seria-moc)", dzialki:[5,10,20,25,50,100],
    wartosc:(pr) => pr.moc_S == null ? null : pr.moc_S },
  { klucz:"tetno", nazwa:"Tętno", jednostka:"bpm", miejsc:0,
    kolor:"var(--seria-tetno)", dzialki:[2,5,10,20],
    wartosc:(pr) => pr.tetno == null ? null : pr.tetno }
];

// iPB — numer próby, która jest rekordem CZASU. Zieleń na wszystkich pasach
// wskazuje TĘ SAMĄ próbę, a nie maksimum danej miary. Inaczej na pasie tętna
// zielona kropka oznaczałaby najniższe tętno, czyli często po prostu jazdę
// wolniejszą — pochwałę za nic.
function wykresSerii(lista, wybrany, seg, seria, iPB){
  const wys = 118, marDol = 12, marG = 22;
  const szer = szerProb(lista.length);
  const v = lista.map(pr => seria.wartosc(pr, seg));
  const sens = v.filter(x => x != null);
  if (!sens.length) return "";

  const min = Math.min(...sens), max = Math.max(...sens);
  const zapas = Math.max((max - min) * 0.25, max * 0.02, 0.5);
  const dol = Math.max(0, min - zapas), gora = max + zapas;
  const krok = seria.dzialki.find(k => (gora-dol)/k <= 4) || seria.dzialki[seria.dzialki.length-1];
  const podzialka = [];
  for (let t = Math.ceil(dol/krok)*krok; t <= gora; t += krok) podzialka.push(t);
  const skala = x => wys - ((x - dol)/(gora - dol || 1)) * wys;
  const wysCalk = wys + marG + marDol;

  let os = `<svg class="os" width="${G.szerOsi}" height="${wysCalk}" aria-hidden="true">`;
  for (const t of podzialka)
    os += `<text x="${G.szerOsi-6}" y="${marG+skala(t)+4}" text-anchor="end"
            font-size="10" fill="var(--slaby)">${liczba(t,seria.miejsc)}</text>`;
  os += `</svg>`;

  let g = `<svg width="${szer}" height="${wysCalk}" role="img"
    aria-label="${seria.nazwa} na kolejnych próbach">`;
  for (const t of podzialka)
    g += `<line x1="0" y1="${marG+skala(t)}" x2="${szer}" y2="${marG+skala(t)}"
           stroke="var(--linia)" stroke-width="1"/>`;

  const px = i => xProby(i) + G.szerSlupka/2;
  const py = i => marG + skala(v[i]);

  // Przerwa w danych (próba bez pomiaru) rozcina linię, zamiast ją zmyślać.
  let d = "", trzeba = true;
  lista.forEach((_, i) => {
    if (v[i] == null){ trzeba = true; return; }
    d += `${trzeba ? "M" : "L"}${px(i)} ${py(i)} `;
    trzeba = false;
  });
  g += `<path d="${d.trim()}" fill="none" stroke="${seria.kolor}" stroke-width="2"
         stroke-linejoin="round" stroke-linecap="round"/>`;

  lista.forEach((pr, i) => {
    if (v[i] != null){
      const rekord = i === iPB;
      g += `<circle cx="${px(i)}" cy="${py(i)}" r="${i === wybrany ? 6.5 : 4.5}"
             fill="${rekord ? "var(--plan)" : seria.kolor}"
             stroke="var(--powierzchnia)" stroke-width="2"
             class="punkt-proby${i === wybrany ? " wybrany" : ""}" data-i="${i}"/>`;
      g += `<text x="${px(i)}" y="${py(i)-13}" text-anchor="middle" font-size="11"
             font-weight="600" data-i="${i}"
             fill="${rekord ? "var(--plan)" : "var(--tekst)"}"
             class="etykieta-proby${i === wybrany ? " wybrany" : ""}"
             >${liczba(v[i],seria.miejsc)} ${seria.jednostka}</text>`;
    }
    g += `<rect x="${xProby(i)-G.odstep/2}" y="0" width="${G.szerSlupka+G.odstep}"
           height="${wysCalk}" fill="transparent" class="proba-punkt" data-i="${i}"/>`;
  });
  g += `</svg>`;

  return `<div class="seria">
      <p class="podpis-serii"><i style="background:${seria.kolor}"></i>${
        seria.nazwa} <span>${seria.jednostka}</span></p>
      <div class="wykres">${os}<div class="ramka">${g}</div></div>
    </div>`;
}

function wykresySerii(lista, wybrany, seg){
  const naj = Math.min(...lista.map(x => x.czas_s));
  const iPB = lista.findIndex(x => x.czas_s === naj);
  return SERIE.map(x => wykresSerii(lista, wybrany, seg, x, iPB)).join("");
}


/* ==========================================================================
   WNIOSKI — analiza segmentu liczona przy wyświetlaniu

   To NIE jest tekst pisany przez model językowy: strona jest statyczna i nie
   ma jak nikogo zapytać. To reguły policzone z Twoich prób, więc przeliczają
   się same przy każdej nowej jeździe i działają bez sieci.

   Osobny blok "analizy" w dane.js jest miejscem na komentarz pisany ręcznie
   przez Claude'a — jeśli istnieje dla tego segmentu, dopisuje się pod
   wnioskami i jest wyraźnie podpisany datą.
   ========================================================================== */

// Opis jazdy ma format ze STRONA.md §6: Ok/trio/w?1/hr160-195, separator "/".
// Parser jest sztywny — luźny kiedyś zgadnie źle i nikt się nie dowie.
// Jedyny wyjątek: zapis "?1" bez litery w, który wyszedł w jeździe z 13.08.
function zOpisu(opis){
  const w = { ok:false, grupa:null, wiatr:null };
  if (!opis) return w;
  for (const czesc of String(opis).split("/").map(x => x.trim().toLowerCase())){
    if (czesc === "ok") w.ok = true;
    else if (/^(solo|duo|trio|tata)/.test(czesc)) w.grupa = czesc;
    else if (/^w[?a-z]*\d/.test(czesc) || /^\?\d/.test(czesc)) w.wiatr = czesc;
  }
  return w;
}

function mediana(t){
  const x = [...t].sort((a,b) => a-b);
  const p = Math.floor(x.length/2);
  return x.length % 2 ? x[p] : (x[p-1]+x[p])/2;
}

function wnioskiSegmentu(lista, seg){
  const w = [];
  const czasy = lista.map(x => x.czas_s);
  const naj = Math.min(...czasy);
  const iPB = lista.findIndex(x => x.czas_s === naj);
  const pb = lista[iPB], ostatnia = lista[lista.length-1];
  const dzisiaj = naDzien(DZIS);
  const cechy = lista.map(x => zOpisu(x.jazda.opis));

  const odKiedy = roznicaDni(naDzien(pb.jazda.data), dzisiaj);
  w.push({ etykieta:"Rekord", tekst:
    `${czasNaTekst(naj)} — ${pl(pb.jazda.data)}, ${odKiedy} dni temu.` +
    (iPB === lista.length-1 ? " To Twoja ostatnia próba." : "") });

  // Trend liczymy z median połówek, nie ze skrajnych prób: jedna jazda
  // z wiatrem w plecy przestawiłaby wynik o kilkanaście procent.
  if (lista.length >= 4){
    const pol = Math.floor(lista.length/2);
    const wcz = mediana(czasy.slice(0, pol)), poz = mediana(czasy.slice(-pol));
    const zmiana = (poz - wcz) / wcz * 100;
    w.push({ etykieta:"Trend", tekst: Math.abs(zmiana) < 1.5
      ? `Bez zmian — mediana pierwszej połowy prób ${czasNaTekst(Math.round(wcz))}, drugiej ${czasNaTekst(Math.round(poz))}.`
      : `${zmiana < 0 ? "Szybciej" : "Wolniej"} o ${liczba(Math.abs(zmiana),1)}% — `
        + `mediana z ${czasNaTekst(Math.round(wcz))} na ${czasNaTekst(Math.round(poz))}.` });
  } else {
    w.push({ etykieta:"Trend", tekst:
      `Za mało prób, żeby cokolwiek twierdzić — ${lista.length} ${
        lista.length === 1 ? "przejazd" : "przejazdy"}. Trend liczę od czterech.` });
  }

  const med = mediana(czasy);
  const rozrzut = Math.max(...czasy) - naj;
  w.push({ etykieta:"Powtarzalność", tekst:
    `Typowy przejazd ${czasNaTekst(Math.round(med))}, rozrzut ${roznicaCzasu(rozrzut).replace("+","")} `
    + `między najszybszym a najwolniejszym.` });

  const doPB = ostatnia.czas_s - naj;
  w.push({ etykieta:"Ostatnia próba", tekst:
    `${pl(ostatnia.jazda.data)}, ${czasNaTekst(ostatnia.czas_s)}` +
    (doPB === 0 ? " — rekord." : ` — ${roznicaCzasu(doPB)} do rekordu, `
      + `${ostatnia.czas_s <= med ? "poniżej" : "powyżej"} typowego czasu.`) });

  // Porównywalność: draft i wiatr psują porównania czasów bardziej niż forma.
  const grupowe = cechy.filter(x => x.grupa && x.grupa !== "solo").length;
  const zWiatrem = cechy.filter(x => x.wiatr).length;
  const opisane = cechy.filter(x => x.ok).length;
  const zwifty = lista.filter(x => x.jazda.typ === "VirtualRide").length;
  const uwagi = [];
  if (cechy[iPB].grupa && cechy[iPB].grupa !== "solo")
    uwagi.push(`rekord padł w grupie (${cechy[iPB].grupa}) — draft daje na płaskim do 30%`);
  if (cechy[iPB].wiatr) uwagi.push("przy rekordzie zapisany wiatr");
  if (grupowe) uwagi.push(`${grupowe} z ${lista.length} prób w grupie`);
  if (zWiatrem) uwagi.push(`${zWiatrem} z zapisanym wiatrem`);
  if (zwifty && zwifty < lista.length) uwagi.push(`${zwifty} na Zwifcie`);
  // "Ok" w opisie znaczy: opis sprawdzony i świadomie wypełniony (STRONA.md §6).
  // Jazda z opisem, ale bez tego znacznika, ma nieznane warunki tak samo jak
  // jazda bez opisu — dlatego liczymy znacznik, a nie obecność tekstu.
  if (opisane < lista.length)
    uwagi.push(`${lista.length - opisane} bez znacznika „Ok" — warunków nie znamy`);
  if (uwagi.length)
    w.push({ etykieta:"Ostrożnie", ostrzezenie:true, tekst: uwagi.join(" · ") + "." });

  const rpe = lista.map(x => x.jazda.rpe).filter(x => x != null);
  if (rpe.length)
    w.push({ etykieta:"Wysiłek", tekst:
      `RPE znane dla ${rpe.length} z ${lista.length} prób, średnio `
      + `${liczba(rpe.reduce((a,b)=>a+b,0)/rpe.length,1)}`
      + (pb.jazda.rpe != null ? `; rekord przy RPE ${pb.jazda.rpe}.` : ".") });

  const ergowe = lista.filter(x => jestErg(x.jazda)).length;
  if (ergowe)
    w.push({ etykieta:"Moc sterowana", ostrzezenie: ergowe === lista.length, tekst:
      `${ergowe} z ${lista.length} prób pochodzi z treningu w trybie ERG, `
      + `gdzie trenażer trzymał zadaną moc. ${ergowe === lista.length
          ? "Wszystkie — czas na tym segmencie mówi więc o planie treningu, nie o formie."
          : "Przy tych próbach liczba opisuje plan, nie możliwości."}` });

  const zMoca = lista.filter(x => x.moc_S != null);
  if (zMoca.length)
    w.push({ etykieta:"Moc", tekst:
      `Zmierzona na ${zMoca.length} z ${lista.length} prób: `
      + `${Math.round(Math.min(...zMoca.map(x=>x.moc_S)))}–${
         Math.round(Math.max(...zMoca.map(x=>x.moc_S)))} W.` });

  return w;
}

function panelAnalizy(lista, seg){
  const w = wnioskiSegmentu(lista, seg);
  const recznie = (D.analizy || {})[seg.id];
  return `
    <aside class="analiza">
      <div class="analiza-gora">
        <span class="analiza-tytul">Wnioski</span>
        <span class="analiza-zrodlo">liczone z ${lista.length} prób</span>
      </div>
      <ul class="analiza-lista">
        ${w.map(x => `<li${x.ostrzezenie ? ' class="uwaga"' : ""}>
          <b>${x.etykieta}</b><span>${x.tekst}</span></li>`).join("")}
      </ul>
      ${recznie ? `<div class="analiza-recznie">
        <b>Komentarz Claude'a${recznie.data ? " · " + pl(recznie.data) : ""}</b>
        <p>${bezpieczny(recznie.tekst || "")}</p></div>` : ""}
      <p class="analiza-stopka">Przeliczane przy każdym otwarciu strony, więc
        nowa próba zmienia je same. To reguły policzone z Twoich danych,
        nie tekst pisany przez model — strona jest statyczna i nie ma kogo
        zapytać.</p>
    </aside>`;
}

function panelProby(seg, pr, najlepszyCzas, numer, ile){
  const j = pr.jazda;
  const v = pr.czas_s ? (seg.dystans_m / pr.czas_s) * 3.6 : null;
  const roznica = pr.czas_s - najlepszyCzas;
  return `
    <div class="proba-naglowek">
      <a class="odn" href="${adresStravy(j)}" target="_blank" rel="noopener"
         title="Otwórz tę jazdę na Stravie">${ikonaDyscypliny(j.typ,15)}
         <b>${bezpieczny(j.nazwa)}</b> &#8599;</a>${znacznikErg(j)}
      <span class="znacznik-rpe" title="RPE — subiektywna ocena wysiłku, skala 1-10"
        >RPE ${j.rpe == null ? "—" : j.rpe}</span>
    </div>
    <div class="proba-dane">
      ${pl(j.data)} · <b>${czasNaTekst(pr.czas_s)}</b>
      · ${v == null ? "—" : liczba(v,1) + " km/h"}
      · ${dlugoscNaTekst(seg.dystans_m)}
      · ${seg.nachylenie_proc == null ? "—" : procentNaTekst(seg.nachylenie_proc)}
      · ${pr.moc_S == null ? "moc —" : Math.round(pr.moc_S) + " W"}
      · ${roznica === 0
            ? `<b style="color:var(--plan)">rekord</b>`
            : roznicaCzasu(roznica) + " do rekordu"}
      · próba ${numer} z ${ile}
    </div>`;
}

/* ==========================================================================
   NOTATKI DO PRÓB

   Dwie warstwy, bo strona jest statyczna i NIE MOŻE nic zapisać do repozytorium
   (klucz do zapisu w publicznym repo byłby kluczem dla wszystkich):

   1. dane.js -> "notatki"  — źródło prawdy. Tu sięga Claude i tu notatka jest
      w kopii zapasowej, widoczna na każdym urządzeniu.
   2. localStorage          — brudnopis TEGO urządzenia. Trzyma to, co
      napisane, ale jeszcze nie trafiło do repozytorium.

   Reguła scalania jest jednozdaniowa: pokazujemy brudnopis, jeśli istnieje,
   w przeciwnym razie wersję z repozytorium. Gdy brudnopis zrówna się z tym,
   co przyszło w danych, znika sam — czyli po tym, jak notatka zostanie
   dopisana do dane.js, urządzenie przestaje trzymać jej kopię.
   ========================================================================== */

const KLUCZ_NOTATEK = "kolarstwo-notatki";

function notatkiLokalne(){
  try { return JSON.parse(localStorage.getItem(KLUCZ_NOTATEK) || "{}"); }
  catch(e){ return {}; }
}
function zapiszLokalne(obj){
  try { localStorage.setItem(KLUCZ_NOTATEK, JSON.stringify(obj)); return true; }
  catch(e){ return false; }          // prywatne okno albo brak miejsca
}
function notatkaZRepo(id){
  const n = (D.notatki || {})[id];
  if (!n) return "";
  return typeof n === "string" ? n : (n.tekst || "");
}
function notatkaBiezaca(id){
  const l = notatkiLokalne();
  return Object.prototype.hasOwnProperty.call(l, id) ? l[id] : notatkaZRepo(id);
}
// Brudnopis, który zrównał się z repozytorium, nie ma po co żyć.
(function sprzatnijBrudnopisy(){
  const l = notatkiLokalne();
  let zmiana = false;
  for (const id of Object.keys(l))
    if (l[id] === notatkaZRepo(id)){ delete l[id]; zmiana = true; }
  if (zmiana) zapiszLokalne(l);
})();

function notatkaHTML(idProby){
  const l = notatkiLokalne();
  const brudnopis = Object.prototype.hasOwnProperty.call(l, idProby);
  const tekst = notatkaBiezaca(idProby);
  const stan = brudnopis
    ? `<span class="stan-brudnopis">zapisana na tym urządzeniu — nie ma jej jeszcze w danych</span>`
    : tekst ? `<span>z danych</span>` : "";
  return `
    <div class="notatka" data-proba="${idProby}">
      <div class="notatka-gora">
        <span class="notatka-tytul">Notatka do tej próby</span>
        <span class="notatka-stan" id="notatka-stan">${stan}</span>
      </div>
      <textarea id="notatka-pole" rows="3" spellcheck="false"
        placeholder="Co pamiętasz z tego przejazdu? Wiatr, koło, samopoczucie, sprzęt."
        >${bezpieczny(tekst)}</textarea>
      <div class="notatka-dol">
        <div class="notatka-przyciski">
          <button type="button" id="notatka-zapisz" class="kolko-akcja"
            title="Zapisz notatkę" aria-label="Zapisz notatkę">&#10003;</button>
          <button type="button" id="notatka-anuluj" class="kolko-akcja"
            title="Odrzuć zmiany" aria-label="Odrzuć zmiany">&#10007;</button>
        </div>
        <button type="button" id="notatka-eksport" class="link-tekstowy"
          >Notatki dla Claude…</button>
      </div>
      <textarea id="notatka-eksport-pole" readonly rows="4" hidden></textarea>
    </div>`;
}

// Indeks wybranej próby. Null znaczy „jeszcze nie tknięto wykresu" — wtedy
// pokazujemy ostatnią, bo najciekawsze jest to, jak jest TERAZ, a nie jak było.
let wybranaProba = null, segmentWPorownaniu = null;

const porownaniaS = (id) => {
  if (!id){
    wybranaProba = null; segmentWPorownaniu = null;
    return `
      <div class="pusto">
        <span class="znak">Porównania S</span>
        To pole otworzy się po wybraniu segmentu w zakładce
        <a class="odn-zakladka" href="#postepy/segmenty">Segmenty</a>.
      </div>`;
  }

  const seg = (D.segmenty || []).find(x => x.id === id);
  const lista = probySegmentu(id);
  if (!seg || !lista.length){
    return `
      <div class="pusto">
        <span class="znak">Nie znam takiego segmentu</span>
        Wróć do zakładki
        <a class="odn-zakladka" href="#postepy/segmenty">Segmenty</a> i wybierz z listy.
      </div>`;
  }

  if (segmentWPorownaniu !== id){ segmentWPorownaniu = id; wybranaProba = null; }
  const wybrany = wybranaProba == null ? lista.length - 1 : wybranaProba;
  const najlepszy = Math.min(...lista.map(x => x.czas_s));
  const zwift = lista.some(x => x.jazda.typ === "VirtualRide");
  const pierwsza = lista[0].jazda.data, ostatnia = lista[lista.length-1].jazda.data;

  return `
  <section>
    <div class="proba-tytul">
      <h2>${zwift ? ikonaDyscypliny("VirtualRide",16) + " " : ""}${bezpieczny(seg.nazwa)}</h2>
      <a class="kolko-reset" href="#postepy/porownania"
         title="Wróć do wyboru segmentu" aria-label="Wróć do wyboru segmentu">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2v3.2h-3.2"/></svg>
      </a>
    </div>
    <p class="opis">
      ${lista.length} ${lista.length === 1 ? "próba" : lista.length < 5 ? "próby" : "prób"}
      od ${pl(pierwsza)} do ${pl(ostatnia)}. Jeden słupek to jeden przejazd,
      wysokość to czas — <b>im niżej, tym lepiej</b>. Oś zaczyna się od zera,
      więc różnice kilku sekund są celowo małe; dokładne liczby są pod wykresem.
      Zielony słupek i zielona kreska to rekord: ${czasNaTekst(najlepszy)}
      — ten sam przejazd jest zaznaczony na obu wykresach.
      <br>Czas nie odróżnia jazdy solo od jazdy w grupie ani wiatru. RPE obok
      nazwy jazdy mówi, ile Cię ta próba kosztowała — bez tego szybszy czas
      z koła kolegi wygląda jak forma.
    </p>
    <div class="porownanie-uklad">
      <div class="porownanie-wykresy">
        <div id="wykres-prob">${wykresProb(lista, wybrany, najlepszy)}</div>
        <p class="podpis-wykresu">Poniżej te same próby w innych miarach. Każda ma
      własny pas i własną oś, bo prędkość, waty i uderzenia serca nie mieszczą
      się na jednej skali — a dwie skale na jednym rysunku pozwalają udowodnić
      dowolną tezę samym przesunięciem zakresu. Wspólna oś pozioma i wspólne
      zaznaczenie sprawiają, że czyta się to jak jeden wykres.
      Pas pojawia się tylko wtedy, gdy pomiar istnieje: moc mają dziś wyłącznie
      próby ze Zwiftu, a pas tętna zjawi się sam, gdy zacznie się zapisywać.
      Osie tych pasów nie zaczynają się od zera — w linii wartość niesie
      położenie punktu, a nie wysokość, więc wolno ją przybliżyć.</p>
        <div id="wykres-serii">${wykresySerii(lista, wybrany, seg)}</div>
      </div>
      ${panelAnalizy(lista, seg)}
    </div>
    <div class="info" id="info-proby">${
      panelProby(seg, lista[wybrany], najlepszy, wybrany+1, lista.length)}</div>
    <div id="notatka-miejsce">${notatkaHTML(lista[wybrany].id || "")}</div>
  </section>`;

// Zdarzenia podpinamy do POJEMNIKA, nie do słupków: pojemnik zostaje ten sam
// przy każdym przerysowaniu, więc nie trzeba niczego podpinać po raz drugi.
function podepnijProby(){
  const pojemnik = document.getElementById("wykres-prob");
  if (!pojemnik) return;
  const [, , id] = zHasha();
  const seg = (D.segmenty || []).find(x => x.id === id);
  if (!seg) return;
  const lista = probySegmentu(id);
  const najlepszy = Math.min(...lista.map(x => x.czas_s));

  const pojemnikV = document.getElementById("wykres-serii");

  // Zaznaczenie PRZEKŁADA KLASY, nie przerysowuje wykresów. Wcześniej każde
  // dotknięcie budowało SVG od nowa, więc animacja wyrastania grała od zera
  // i wykres migał. Etykiety wszystkich prób są narysowane z góry i schowane
  // przezroczystością — widoczna jest ta z klasą "wybrany".
  const wybierz = (i) => {
    if (i == null || i < 0 || i >= lista.length || i === wybranaProba) return;
    wybranaProba = i;
    for (const el of document.querySelectorAll(
        "#wykres-prob [data-i], #wykres-serii [data-i]")){
      const akt = +el.dataset.i === i;
      el.classList.toggle("wybrany", akt);
      if (el.tagName === "circle") el.setAttribute("r", akt ? 6.5 : 4.5);
    }
    document.getElementById("info-proby").innerHTML =
      panelProby(seg, lista[i], najlepszy, i+1, lista.length);
    document.getElementById("notatka-miejsce").innerHTML =
      notatkaHTML(lista[i].id || "");
  };

  const zZdarzenia = e => {
    const cel = e.target.closest("rect.proba, rect.proba-punkt");
    return cel ? +cel.dataset.i : null;
  };
  for (const el of [pojemnik, pojemnikV]){
    el.addEventListener("click", e => wybierz(zZdarzenia(e)));
    el.addEventListener("mouseover", e => wybierz(zZdarzenia(e)));
  }

  // Dwa wykresy mają tę samą oś poziomą, więc muszą jeździć razem. Strażnik
  // przeciw zapętleniu: ustawienie scrollLeft wywołuje zdarzenie scroll na
  // drugiej ramce, które bez tego odbijałoby się w nieskończoność.
  let wRuchu = false;
  function podepnijPrzewijanie(){
    const ramki = [...document.querySelectorAll(
      "#wykres-prob .ramka, #wykres-serii .ramka")];
    for (const r of ramki){
      r.addEventListener("scroll", () => {
        if (wRuchu) return;
        wRuchu = true;
        for (const inna of ramki) if (inna !== r) inna.scrollLeft = r.scrollLeft;
        wRuchu = false;
      });
    }
  }
  podepnijPrzewijanie();
  for (const r of document.querySelectorAll("#wykres-serii .ramka"))
    r.scrollLeft = (pojemnik.querySelector(".ramka") || {}).scrollLeft || 0;

  // ── notatki ──────────────────────────────────────────────────────────────
  const miejsce = document.getElementById("notatka-miejsce");
  if (!miejsce) return;

  const stanNotatki = (tekst) => {
    const el = document.getElementById("notatka-stan");
    if (el) el.innerHTML = tekst;
  };

  miejsce.addEventListener("input", e => {
    if (e.target.id === "notatka-pole")
      stanNotatki(`<span class="stan-niezapisane">niezapisane — dotknij ✓</span>`);
  });

  miejsce.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const pole = document.getElementById("notatka-pole");
    const idProby = miejsce.querySelector(".notatka").dataset.proba;

    if (b.id === "notatka-zapisz"){
      const l = notatkiLokalne();
      const tekst = pole.value.trim();
      // Notatka zgodna z tą z danych nie musi leżeć w brudnopisie.
      if (tekst === notatkaZRepo(idProby)) delete l[idProby];
      else l[idProby] = tekst;
      const udane = zapiszLokalne(l);
      stanNotatki(udane
        ? (Object.prototype.hasOwnProperty.call(l, idProby)
            ? `<span class="stan-brudnopis">zapisana na tym urządzeniu — nie ma jej jeszcze w danych</span>`
            : `<span>z danych</span>`)
        : `<span class="stan-niezapisane">nie udało się zapisać w przeglądarce</span>`);
    }

    if (b.id === "notatka-anuluj"){
      pole.value = notatkaBiezaca(idProby);
      const l = notatkiLokalne();
      stanNotatki(Object.prototype.hasOwnProperty.call(l, idProby)
        ? `<span class="stan-brudnopis">zapisana na tym urządzeniu — nie ma jej jeszcze w danych</span>`
        : (pole.value ? `<span>z danych</span>` : ""));
    }

    if (b.id === "notatka-eksport"){
      const l = notatkiLokalne();
      const pełne = {};
      for (const [k,v] of Object.entries(l)){
        const pr = (D.proby || []).find(x => x.id === k);
        const sg = pr && (D.segmenty || []).find(x => x.id === pr.s);
        const jz = pr && JAZDA_PO_ID.get(pr.a);
        pełne[k] = { tekst: v,
          segment: sg ? sg.nazwa : "?",
          data: jz ? jz.data.slice(0,10) : "?",
          czas: pr ? czasNaTekst(pr.czas_s) : "?" };
      }
      const eks = document.getElementById("notatka-eksport-pole");
      eks.value = Object.keys(pełne).length
        ? JSON.stringify(pełne, null, 1)
        : "Brak notatek zapisanych na tym urządzeniu.";
      eks.hidden = false;
      eks.select();
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(eks.value).catch(() => {});
    }
  });
}

/* ==========================================================================
   DANE — rekordy mocy

   Strava nie oddaje gotowych rekordów mocy przez API. Automat liczy je ze
   strumienia watów każdej jazdy z miernikiem i zapisuje jako "moc_krzywe":
   jedna liczba na okno czasowe. Tutaj z tych jazd składamy dwie rzeczy:

   1. REKORD na każdy czas — maksimum ze wszystkich jazd.
   2. POSTĘP rekordu — idąc po datach, zapisujemy tylko te jazdy, w których
      rekord został POBITY. Linia z definicji może iść wyłącznie w górę.

   Wszystko liczone przy wyświetlaniu, więc nowa jazda z miernikiem przestawia
   listę i wykresy sama.
   ========================================================================== */

const OKNA_OPISY = { 1:"1 s", 5:"5 s", 10:"10 s", 15:"15 s", 30:"30 s", 40:"40 s",
  60:"1 min", 120:"2 min", 300:"5 min", 480:"8 min", 600:"10 min",
  900:"15 min", 1200:"20 min", 1800:"30 min", 2700:"45 min", 3600:"1 h",
  5400:"1,5 h" };

function oknoNaTekst(sek){ return OKNA_OPISY[sek] || czasNaTekst(sek); }

// Jazdy z krzywą, po dacie rosnąco — kolejność decyduje o tym, co jest
// poprawą, a co tylko powtórzeniem.
const JAZDY_Z_MOCA = (D.moc_krzywe || [])
  .map(k => ({ ...k, jazda: JAZDA_PO_ID.get(k.a) }))
  .filter(k => k.jazda)
  .sort((a,b) => a.jazda.data < b.jazda.data ? -1 : 1);

const OKNA_ZNANE = [...new Set(JAZDY_Z_MOCA.flatMap(k => Object.keys(k.w).map(Number)))]
  .sort((a,b) => a-b);

// Historia jednego okna: tylko przejazdy, które poprawiły dotychczasowy rekord.
function postepOkna(sek){
  const kroki = [];
  let rekord = 0;
  for (const k of JAZDY_Z_MOCA){
    const w = k.w[sek];
    if (w == null || w <= rekord) continue;
    kroki.push({ waty: w, poprzedni: rekord || null, zysk: rekord ? w - rekord : null,
                 jazda: k.jazda });
    rekord = w;
  }
  return kroki;
}

const REKORDY_MOCY = OKNA_ZNANE.map(sek => {
  const kroki = postepOkna(sek);
  const ostatni = kroki[kroki.length-1];
  return { sek, waty: ostatni ? ostatni.waty : null, jazda: ostatni ? ostatni.jazda : null,
           poprawek: kroki.length, kroki };
}).filter(x => x.waty != null);

function watyNaKg(w){
  const m = D.zalozenia && D.zalozenia.masa_zawodnika_kg;
  return m && m.v ? w / m.v : null;
}

/* Krzywa mocy — oś czasu logarytmiczna, bo inaczej cała lewa strona (sekundy)
   zlewa się w jeden punkt przy godzinie. Rysowana w viewBox skalowanym do
   szerokości karty: wykres ma być widoczny w całości, bo jego sens to KSZTAŁT,
   a nie odczyt pojedynczej liczby — te są w tabeli pod spodem. */
function wykresKrzywejMocy(){
  if (REKORDY_MOCY.length < 2) return "";
  const W = 660, H = 300, lewy = 46, prawy = 40, gora = 26, dol = 34;
  const px = W - lewy - prawy, py = H - gora - dol;
  const minS = REKORDY_MOCY[0].sek, maksS = REKORDY_MOCY[REKORDY_MOCY.length-1].sek;
  const maksW = Math.max(...REKORDY_MOCY.map(x => x.waty));
  const goraW = Math.ceil(maksW * 1.1 / 50) * 50;
  const x = s2 => lewy + (Math.log(s2) - Math.log(minS)) / (Math.log(maksS) - Math.log(minS)) * px;
  const y = w => gora + py - (w / goraW) * py;

  const masa = D.zalozenia && D.zalozenia.masa_zawodnika_kg
    ? D.zalozenia.masa_zawodnika_kg.v : null;
  const znaczniki = [1,5,15,60,300,1200,3600,5400].filter(s2 => s2 >= minS && s2 <= maksS);
  const krokW = goraW > 600 ? 200 : goraW > 300 ? 100 : 50;

  // Wysokość zostawiamy CSS-owi: atrybut height w SVG przyjmuje długość,
  // nie słowo "auto" — przeglądarka zgłaszała to jako błąd.
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%"
    preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Krzywa mocy: rekord na każdy czas trwania">`;
  for (let w = 0; w <= goraW; w += krokW){
    g += `<line x1="${lewy}" y1="${y(w)}" x2="${W-prawy}" y2="${y(w)}"
           stroke="var(--linia)" stroke-width="1"/>`;
    g += `<text x="${lewy-8}" y="${y(w)+4}" text-anchor="end" font-size="11"
           fill="var(--slaby)">${w}</text>`;
  }
  // Druga oś, po prawej: te same waty podzielone przez masę zawodnika.
  // To NIE jest druga seria ani drugi zakres — to ta sama linia w innej
  // jednostce, przeliczona jedną stałą i przechodząca przez to samo zero.
  // Dlatego wolno ją tu postawić, w odróżnieniu od dwóch osobnych miar.
  if (masa){
    const krokWkg = goraW/masa > 8 ? 4 : goraW/masa > 4 ? 2 : 1;
    for (let wkg = 0; wkg*masa <= goraW; wkg += krokWkg)
      g += `<text x="${W-prawy+8}" y="${y(wkg*masa)+4}" text-anchor="start"
             font-size="11" fill="var(--slaby)">${wkg}</text>`;
    g += `<text x="${W-prawy+8}" y="${gora-4}" text-anchor="start" font-size="10"
           font-weight="600" fill="var(--slaby)">W/kg</text>`;
    g += `<text x="${lewy-8}" y="${gora-4}" text-anchor="end" font-size="10"
           font-weight="600" fill="var(--slaby)">W</text>`;
  }
  for (const s2 of znaczniki)
    g += `<text x="${x(s2)}" y="${H-12}" text-anchor="middle" font-size="11"
           fill="var(--slaby)">${oknoNaTekst(s2)}</text>`;

  const d = REKORDY_MOCY.map((r,i) => `${i ? "L" : "M"}${x(r.sek)} ${y(r.waty)}`).join(" ");
  // Wypełnienie pod krzywą: sama linia na dużym polu wygląda na zgubioną,
  // a pole pod nią czyta się jako „tyle mocy mam w każdym czasie".
  g += `<path d="${d} L${x(maksS)} ${y(0)} L${x(minS)} ${y(0)} Z"
         fill="var(--seria-moc)" opacity=".10"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--seria-moc)" stroke-width="2.5"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  for (const r of REKORDY_MOCY)
    g += `<circle cx="${x(r.sek)}" cy="${y(r.waty)}" r="4"
           fill="var(--seria-moc)" stroke="var(--powierzchnia)" stroke-width="2"/>`;

  // Podpisane tylko skrajne i najciekawsze punkty — liczba przy każdym
  // zamieniłaby wykres w tabelę.
  for (const s2 of [minS, 60, 1200, maksS]){
    const r = REKORDY_MOCY.find(x2 => x2.sek === s2);
    if (!r) continue;
    g += `<text x="${x(r.sek)}" y="${y(r.waty)-11}" text-anchor="middle"
           font-size="11.5" font-weight="600" fill="var(--tekst)">${r.waty} W</text>`;
  }
  g += `</svg>`;
  return `<div class="krzywa-mocy">${g}</div>`;
}

const daneMocy = (arg) => {
  if (!JAZDY_Z_MOCA.length) return `
    <div class="pusto">
      <span class="znak">Rekordy mocy</span>
      Nie ma jeszcze ani jednej jazdy ze zmierzoną mocą. Ta zakładka wypełni
      się sama, gdy pojawi się miernik mocy albo trenażer.
    </div>`;

  if (arg) return postepMocy(Number(arg));

  const naKg = (w) => { const x = watyNaKg(w); return x == null ? "" : liczba(x,2) + " W/kg"; };
  const wyroznione = [5,60,300,1200].map(s2 => REKORDY_MOCY.find(r => r.sek === s2))
    .filter(Boolean);
  const odKiedy = JAZDY_Z_MOCA[0].jazda.data, doKiedy = JAZDY_Z_MOCA[JAZDY_Z_MOCA.length-1].jazda.data;

  return `

    <h2>Rekordy mocy</h2>
    <p class="opis">

      watów każdej jazdy, w której moc była <b>mierzona</b>, nie szacowana.
      Dziś to ${JAZDY_Z_MOCA.length} ${JAZDY_Z_MOCA.length === 1 ? "jazda" :
      JAZDY_Z_MOCA.length < 5 ? "jazdy" : "jazd"} z trenażera,
      od ${pl(odKiedy)} do ${pl(doKiedy)}. Szosa dołączy do tej listy sama
      w dniu, w którym na rowerze pojawi się miernik — kod nie odróżnia jednego
      od drugiego, patrzy tylko na to, czy moc jest pomiarem.
      <br>Dotknij wiersza w tabeli, żeby zobaczyć, jak ten rekord rósł w czasie.
    </p>
    <div class="kafelki">
      ${wyroznione.map(r => `
        <div class="kafel">
          <div class="etykieta">${oknoNaTekst(r.sek)}</div>
          <div class="liczba">${r.waty}</div>
          <div class="stopka">W · ${naKg(r.waty)}${znacznikErg(r.jazda)}</div>
        </div>`).join("")}
    </div>
  </section>

  <section>
    <h2>Krzywa mocy</h2>
    <p class="opis">
      Ten sam komplet rekordów jako jedna linia. Oś czasu jest logarytmiczna —
      inaczej wszystko od sekundy do minuty zlałoby się w jeden punkt przy
      krawędzi. Kształt tej krzywej mówi więcej niż pojedyncza liczba: strome
      zejście na lewej stronie to zryw, płaski ogon po prawej to wytrzymałość.
      <br>Jeśli zobaczysz, że dłuższe okno bije krótsze o wat czy dwa (np. 12 min
      ponad 10 min) — to nie błąd. Maksimum średniej kroczącej nie musi maleć
      z długością okna: przy serii <code>3 0 3 0 3</code> najlepsza piątka daje
      1,80, a najlepsza dwójka tylko 1,50. Znaczy to tyle, że żadne krótsze okno

    </p>
    ${wykresKrzywejMocy()}
  </section>

  <section>
    <h2>Wszystkie okna</h2>
    <div class="tabelka">
      <table class="segmenty moc">
        <thead><tr>
          <th>Czas</th><th>Moc</th><th>W/kg</th><th>Poprawek</th><th>Kiedy padł</th>
        </tr></thead>
        <tbody>
          ${REKORDY_MOCY.map(r => `
            <tr>
              <td><a class="seg-nazwa" href="#postepy/dane/${r.sek}"

      Wszystkie liczby mają tag <b>[Z]</b> — to pomiar z trenażera, nie estymata.

      <span class="znacznik-erg">ERG</span> stoi przy jazdach, w których trenażer

        const ile = JAZDY_Z_MOCA.filter(k => jestErg(k.jazda)).length;
        return `Dziś dotyczy to ${ile} z ${JAZDY_Z_MOCA.length} jazd`;
      })()}. Taka liczba mówi, co kazał program, a nie ile potrafisz — z jednym

      są Twoje, a rekordy dwudziestominutowe z sesji „Foundation" to plan.

      Między grupami leży pusty pas, więc próg 2,0 stoi w jego środku i ma
      zapas w obie strony. Dzięki temu sprint 702 W z sesji „Strength" NIE
      dostaje znacznika, choć sama sesja szła po planie: liczba widzi to,

};

/* Postęp jednego rekordu. Wykres schodkowy, bo rekord nie rośnie płynnie
   między jazdami — stoi, dopóki ktoś go nie pobije. Linia prosta między
   punktami sugerowałaby poprawę, której nie było. */
function postepMocy(sek){
  const r = REKORDY_MOCY.find(x => x.sek === sek);
  if (!r) return `
    <div class="pusto">
      <span class="znak">Nie znam takiego okna</span>
      Wróć do <a class="odn-zakladka" href="#postepy/dane">listy rekordów</a>.
    </div>`;

  const kroki = r.kroki;
  const naKg = watyNaKg(r.waty);

  // Wykres rozciąga się na szerokość karty, a nie na liczbę punktów: trzy
  // poprawki wciśnięte w lewą ćwiartkę wyglądały jak niedokończony rysunek.
  // Stąd viewBox skalowany do szerokości i punkty rozłożone równomiernie.
  const W = 660, H = 290, lewy = 46, prawy = 22, gora = 34, dol = 42;
  const px = W - lewy - prawy, py = H - gora - dol;
  const goraW = Math.ceil(r.waty * 1.18 / 25) * 25;
  const krokW = goraW > 600 ? 200 : goraW > 300 ? 100 : 50;
  const y = w => gora + py - (w / goraW) * py;
  const x = i2 => kroki.length === 1 ? lewy + px/2
    : lewy + (i2 / (kroki.length - 1)) * (px - 40);

  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%"
    preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Jak rósł rekord na ${oknoNaTekst(sek)}">`;
  for (let w = 0; w <= goraW; w += krokW){
    g += `<line x1="${lewy}" y1="${y(w)}" x2="${W-prawy}" y2="${y(w)}"
           stroke="var(--linia)" stroke-width="1"/>`;
    g += `<text x="${lewy-8}" y="${y(w)+4}" text-anchor="end" font-size="11"
           fill="var(--slaby)">${w}</text>`;
  }

  // Schodek, nie prosta: rekord nie rośnie płynnie między jazdami — stoi,
  // dopóki ktoś go nie pobije. Prosta sugerowałaby poprawę, której nie było.
  let d = `M${x(0)} ${y(kroki[0].waty)}`;
  for (let i2 = 1; i2 < kroki.length; i2++)
    d += ` L${x(i2)} ${y(kroki[i2-1].waty)} L${x(i2)} ${y(kroki[i2].waty)}`;
  d += ` L${W-prawy} ${y(r.waty)}`;
  g += `<path d="${d}" fill="none" stroke="var(--seria-moc)" stroke-width="2.5"
         stroke-linejoin="round" stroke-linecap="round"/>`;

  kroki.forEach((k,i2) => {
    const aktualny = i2 === kroki.length-1;
    g += `<circle cx="${x(i2)}" cy="${y(k.waty)}" r="${aktualny ? 6.5 : 5}"
           fill="${aktualny ? "var(--plan)" : "var(--seria-moc)"}"
           stroke="var(--powierzchnia)" stroke-width="2"/>`;
    g += `<text x="${x(i2)}" y="${y(k.waty)-13}" text-anchor="middle" font-size="12"
           font-weight="600" fill="${aktualny ? "var(--plan)" : "var(--tekst)"}"
           >${k.waty} W</text>`;
    if (k.zysk)
      g += `<text x="${x(i2)}" y="${y(k.waty)-27}" text-anchor="middle" font-size="10"
             fill="var(--seria-moc)" font-weight="600">+${k.zysk} W</text>`;
    g += `<text x="${x(i2)}" y="${gora+py+18}" text-anchor="middle" font-size="10.5"
           fill="var(--slaby)">${pl(k.jazda.data).slice(0,5)}</text>`;
    g += `<text x="${x(i2)}" y="${gora+py+31}" text-anchor="middle" font-size="10"
           fill="var(--slaby)">${k.jazda.data.slice(0,4)}</text>`;
  });
  g += `<line x1="${lewy}" y1="${gora+py}" x2="${W-prawy}" y2="${gora+py}"
         stroke="var(--slaby)" stroke-width="1"/></svg>`;

  const pierwszy = kroki[0], ostatni = kroki[kroki.length-1];
  const wzrost = kroki.length > 1
    ? Math.round((ostatni.waty - pierwszy.waty) / pierwszy.waty * 1000)/10 : null;
  const dni = kroki.length > 1
    ? roznicaDni(naDzien(pierwszy.jazda.data), naDzien(ostatni.jazda.data)) : null;

  return `
  <section>
    <div class="proba-tytul">
      <h2>Rekord na ${oknoNaTekst(sek)} · ${r.waty} W</h2>
      <a class="kolko-reset" href="#postepy/dane"
         title="Wróć do listy rekordów" aria-label="Wróć do listy rekordów">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2v3.2h-3.2"/></svg>
      </a>
    </div>
    <p class="opis">
      Na wykresie stoją <b>wyłącznie jazdy, w których rekord został pobity</b> —
      przejazdy słabsze od ówczesnego rekordu nie zmieniają niczego, więc ich tu
      nie ma. Dlatego ta linia może iść tylko w górę i pokazuje nie formę,
      tylko <b>tempo poprawy</b>. Płaski odcinek znaczy, że przez ten czas
      rekord stał.
      ${kroki.length > 1 ? `<br>Od ${pl(pierwszy.jazda.data)} do ${pl(ostatni.jazda.data)}
        — ${dni} dni, ${kroki.length} poprawek, łącznie
        <b>+${ostatni.waty - pierwszy.waty} W</b> (${liczba(wzrost,1)}%).`
        : `<br>Ten rekord padł raz i nikt go jeszcze nie ruszył.`}
    </p>
    <div class="krzywa-mocy">${g}</div>
    <div class="info">
      <div class="proba-naglowek">
        <a class="odn" href="${adresStravy(ostatni.jazda)}" target="_blank" rel="noopener"
           title="Otwórz tę jazdę na Stravie">${ikonaDyscypliny(ostatni.jazda.typ,15)}
           <b>${bezpieczny(ostatni.jazda.nazwa)}</b> &#8599;</a>${znacznikErg(ostatni.jazda)}
        <span class="znacznik-rpe">RPE ${ostatni.jazda.rpe == null ? "—" : ostatni.jazda.rpe}</span>
      </div>
      <div class="proba-dane">
        Obecny rekord: ${pl(ostatni.jazda.data)} · <b>${r.waty} W</b>
        ${naKg == null ? "" : "· " + liczba(naKg,2) + " W/kg"}
        ${ostatni.zysk ? `· poprawa o ${ostatni.zysk} W wobec ${ostatni.poprzedni} W` : ""}
      </div>
    </div>
    <ul class="kroki-mocy">
      ${[...kroki].reverse().map(k => `
        <li>
          <span class="kroki-data">${pl(k.jazda.data)}</span>
          <span class="kroki-waty">${k.waty} W</span>
          <span class="kroki-zysk">${k.zysk ? "+" + k.zysk + " W" : "pierwszy pomiar"}</span>
          <a class="odn" href="${adresStravy(k.jazda)}" target="_blank" rel="noopener"
             >${bezpieczny(k.jazda.nazwa)} &#8599;</a>${znacznikErg(k.jazda)}
        </li>`).join("")}
    </ul>
  </section>`;
}

/* ==========================================================================
   PROGNOZY — krzywa mocy, której jeszcze nie ma

   Wszystko na tej zakładce to DECYZJA, nie pomiar: liczby wpisał Fryderyk,
   a strona je tylko rysuje i zestawia z tym, co dziś naprawdę zmierzone.
   Dlatego cele siedzą w dane.js (blok "prognozy"), a nie w kodzie wykresu —
   tak samo jak cel 80 km i plan objętości. Dopisanie okresu do listy tworzy
   nową mini-zakładkę; kod nie zna żadnej z nich z nazwy.

   Rozstrzygnięcie („udało się" / „nie udało się") ma dwie warstwy, dokładnie
   jak notatki do prób: dane.js jest źródłem prawdy, localStorage brudnopisem
   tego urządzenia. Strona jest statyczna i nie ma jak zapisać czegokolwiek do
   repozytorium — klucz do zapisu w publicznym repo byłby kluczem dla
   wszystkich. To samo dotyczy bieżącego FTP.
   ========================================================================== */

const KLUCZ_PROGNOZ = "kolarstwo-prognozy";
const PROGNOZY = (D.prognozy && D.prognozy.okresy) || [];
const okresPrognozy = (id) => PROGNOZY.find(o => o.id === id) || null;

function prognozyLokalne(){
  try {
    const o = JSON.parse(localStorage.getItem(KLUCZ_PROGNOZ) || "{}");
    return { znaki: o.znaki && typeof o.znaki === "object" ? o.znaki : {},
             ftp: typeof o.ftp === "number" ? o.ftp : null };
  } catch(e){ return { znaki:{}, ftp:null }; }
}
function zapiszPrognozyLokalne(o){
  try { localStorage.setItem(KLUCZ_PROGNOZ, JSON.stringify(o)); return true; }
  catch(e){ return false; }          // prywatne okno albo brak miejsca
}
function znakZRepo(idOkresu, pole){
  const w = ((D.prognozy || {}).wyniki || {})[idOkresu] || {};
  const z = w[pole];
  return z === "tak" || z === "nie" ? z : null;
}
// Brudnopis wygrywa, jeśli w ogóle istnieje — także wtedy, gdy trzyma null.
// Bez tego nie dałoby się na urządzeniu ZDJĄĆ znaku wpisanego w danych.
function znakBiezacy(idOkresu, pole){
  const l = prognozyLokalne().znaki, k = idOkresu + "/" + pole;
  return Object.prototype.hasOwnProperty.call(l, k) ? l[k] : znakZRepo(idOkresu, pole);
}
function ftpZRepo(){
  const f = (D.prognozy || {}).ftp_biezace;
  return f && f.v != null ? f.v : null;
}
function ftpBiezace(){
  const l = prognozyLokalne();
  return l.ftp != null ? l.ftp : ftpZRepo();
}
// Brudnopis zrównany z danymi nie ma po co żyć — ta sama zasada co przy notatkach.
(function sprzatnijPrognozy(){
  const l = prognozyLokalne();
  let zmiana = false;
  for (const k of Object.keys(l.znaki)){
    const ciecie = k.indexOf("/");
    if (ciecie < 0) continue;
    if (l.znaki[k] === znakZRepo(k.slice(0,ciecie), k.slice(ciecie+1))){
      delete l.znaki[k]; zmiana = true;
    }
  }
  if (l.ftp != null && l.ftp === ftpZRepo()){ l.ftp = null; zmiana = true; }
  if (zmiana) zapiszPrognozyLokalne(l);
})();

const rekordOkna = (s) => REKORDY_MOCY.find(r => r.sek === s) || null;

/* Krzywa prognozy. Ta sama geometria co krzywa rekordów w zakładce Dane:
   oś czasu logarytmiczna, oś W od zera, druga podziałka w W/kg po prawej.
   Na tym samym rysunku stoi cienka krzywa „dziś" — to NIE jest druga miara
   ani druga skala, tylko ta sama wielkość (waty na dane okno) w innym
   momencie w czasie. Dlatego wolno jej tu być: wykres odpowiada na pytanie
   „ile brakuje", a to widać wyłącznie przez odległość między liniami. */
function wykresPrognozy(okres){
  const cele = [...okres.cele].sort((a,b) => a.s - b.s);
  if (cele.length < 2) return "";
  const dzis = REKORDY_MOCY;

  const W = 660, H = 320, lewy = 46, prawy = 40, gora = 34, dol = 40;
  const px = W - lewy - prawy, py = H - gora - dol;
  const sekundy = [...cele.map(c => c.s), ...dzis.map(r => r.sek)];
  const minS = Math.min(...sekundy), maksS = Math.max(...sekundy);
  const maksW = Math.max(...cele.map(c => c.w), ...dzis.map(r => r.waty));
  const goraW = Math.ceil(maksW * 1.12 / 50) * 50;
  const x = s => lewy + (Math.log(s) - Math.log(minS)) / (Math.log(maksS) - Math.log(minS)) * px;
  const y = w => gora + py - (w / goraW) * py;

  const masa = D.zalozenia && D.zalozenia.masa_zawodnika_kg
    ? D.zalozenia.masa_zawodnika_kg.v : null;
  const krokW = goraW > 600 ? 200 : goraW > 300 ? 100 : 50;

  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%"
    preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Prognoza krzywej mocy na ${okres.tytul} zestawiona z dzisiejszymi rekordami">`;
  for (let w = 0; w <= goraW; w += krokW){
    g += `<line x1="${lewy}" y1="${y(w)}" x2="${W-prawy}" y2="${y(w)}"
           stroke="var(--linia)" stroke-width="1"/>`;
    g += `<text x="${lewy-8}" y="${y(w)+4}" text-anchor="end" font-size="11"
           fill="var(--slaby)">${w}</text>`;
  }
  if (masa){
    const krokWkg = goraW/masa > 8 ? 4 : goraW/masa > 4 ? 2 : 1;
    for (let wkg = 0; wkg*masa <= goraW; wkg += krokWkg)
      g += `<text x="${W-prawy+8}" y="${y(wkg*masa)+4}" text-anchor="start"
             font-size="11" fill="var(--slaby)">${wkg}</text>`;
    g += `<text x="${W-prawy+8}" y="${gora-14}" text-anchor="start" font-size="10"
           font-weight="600" fill="var(--slaby)">W/kg</text>`;
    g += `<text x="${lewy-8}" y="${gora-14}" text-anchor="end" font-size="10"
           font-weight="600" fill="var(--slaby)">W</text>`;
  }

  // Podpisy osi czasu: standardowe znaczniki plus każde okno z prognozy —
  // cel bez podpisu byłby celem, którego nie widać. Dwa podpisy bliżej niż
  // 34 px kładziemy w dwóch rzędach zamiast któryś usuwać.
  const znaczniki = [...new Set([...[1,5,15,60,300,1200,3600,5400], ...cele.map(c => c.s)])]
    .filter(s => s >= minS && s <= maksS).sort((a,b) => a-b);
  let poprzedni = -999, rzad = 0;
  for (const s of znaczniki){
    rzad = (x(s) - poprzedni < 34) ? 1 - rzad : 0;
    poprzedni = x(s);
    g += `<text x="${x(s)}" y="${H - (rzad ? 6 : 19)}" text-anchor="middle" font-size="11"
           fill="var(--slaby)">${oknoNaTekst(s)}</text>`;
  }

  // Najpierw „dziś", cienką linią — jest tłem dla prognozy, nie jej rywalem.
  if (dzis.length > 1){
    const dd = dzis.map((r,i) => `${i ? "L" : "M"}${x(r.sek)} ${y(r.waty)}`).join(" ");
    g += `<path d="${dd}" fill="none" stroke="var(--seria-moc)" stroke-width="1.6"
           stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`;
    for (const r of dzis)
      g += `<circle cx="${x(r.sek)}" cy="${y(r.waty)}" r="2.4"
             fill="var(--seria-moc)" opacity=".75"/>`;
  }

  const d = cele.map((c,i) => `${i ? "L" : "M"}${x(c.s)} ${y(c.w)}`).join(" ");
  g += `<path d="${d} L${x(cele[cele.length-1].s)} ${y(0)} L${x(cele[0].s)} ${y(0)} Z"
         fill="var(--plan)" opacity=".10"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--plan)" stroke-width="2.5"
         stroke-linejoin="round" stroke-linecap="round"/>`;

  // Podpis stoi nad punktem, chyba że wpadłby na poprzedni — wtedy schodzi
  // pod punkt. Samo rozsuwanie w pionie o stałą wartość tu nie wystarcza:
  // przy stromym zejściu krzywej podniesiony podpis niższego punktu ląduje
  // dokładnie na wysokości podpisu wyższego (40 s i 1 min zlewały się w plamę).
  let ostatnia = null;
  for (const c of cele){
    const cx = x(c.s), cy = y(c.w);
    g += `<circle cx="${cx}" cy="${cy}" r="4.5"
           fill="var(--plan)" stroke="var(--powierzchnia)" stroke-width="2"/>`;
    let ly = cy - 11;
    if (ostatnia && Math.abs(cx - ostatnia.x) < 44 && Math.abs(ly - ostatnia.y) < 15)
      ly = cy + 20;
    // Przy prawej krawędzi podpis wychodziłby na podziałkę W/kg, więc tam
    // kotwiczymy go końcem, a nie środkiem.
    const przyKrawedzi = cx + 22 > W - prawy;
    g += `<text x="${przyKrawedzi ? cx - 4 : cx}" y="${ly}"
           text-anchor="${przyKrawedzi ? "end" : "middle"}"
           font-size="11.5" font-weight="600" fill="var(--tekst)">${c.w} W</text>`;
    ostatnia = { x: cx, y: ly };
    // Oba znaczki rysowane od razu, widoczny ten z klasą — dotknięcie
    // przekłada klasę i nie buduje SVG od nowa.
    const znak = znakBiezacy(okres.id, String(c.s));
    for (const jaki of ["tak","nie"])
      g += `<text class="znak-punktu ${jaki}${znak === jaki ? " wybrany" : ""}"
             data-pole="${c.s}" x="${przyKrawedzi ? cx - 10 : cx + 10}" y="${cy + 5}"
             text-anchor="${przyKrawedzi ? "end" : "start"}" font-size="12"
             font-weight="700" fill="${jaki === "tak" ? "var(--plan)" : "var(--alarm)"}"
             >${jaki === "tak" ? "✓" : "✗"}</text>`;
  }
  g += `</svg>`;

  return `<div class="krzywa-mocy">${g}</div>
    <div class="legenda">
      <span><i style="background:var(--plan)"></i>prognoza na ${okres.tytul}</span>
      ${dzis.length > 1
        ? `<span><i style="background:var(--seria-moc)"></i>dziś — rekord zmierzony</span>` : ""}
    </div>`;
}

function przyciskZnaku(jaki, biezacy){
  const akt = biezacy === jaki;
  return `<button class="kolko-akcja znak-${jaki}${akt ? " wybrany" : ""}"
    data-znak="${jaki}" aria-pressed="${akt ? "true" : "false"}"
    title="${jaki === "tak" ? "Udało się — dotknij jeszcze raz, żeby zdjąć"
                            : "Nie udało się — dotknij jeszcze raz, żeby zdjąć"}"
    >${jaki === "tak" ? "✓" : "✗"}</button>`;
}

/* Klasyczna reguła: FTP ≈ 95% mocy dwudziestominutowej. Liczymy ją TU, przy
   wyświetlaniu, z liczb w dane.js — nie wpisujemy wyniku do danych. */
function uwagaSpojnosci(okres){
  const c20 = okres.cele.find(c => c.s === 1200);
  if (!c20) return "";
  const klasyk = c20.w * 0.95;
  const c60 = okres.cele.find(c => c.s === 3600);
  const roznica = okres.ftp - klasyk;
  let t = `Kontrola spójności: klasyczna reguła mówi, że FTP to około 95%
    mocy dwudziestominutowej, czyli 0,95 × ${c20.w} = <b>${liczba(klasyk,1)} W</b>.`;
  if (c60) t += ` Prognoza godzinna to ${c60.w} W — różnica
    ${liczba(Math.abs(c60.w - klasyk),1)} W, więc te dwie liczby mówią to samo.`;
  t += ` Prognoza FTP ${okres.ftp} W stoi ${roznica >= 0 ? "wyżej" : "niżej"} o
    ${liczba(Math.abs(roznica),1)} W (${liczba(Math.abs(roznica)/klasyk*100,1)}%) —
    ${Math.abs(roznica)/klasyk < 0.08
      ? "to mieści się w rozrzucie samej reguły, więc komplet trzyma się kupy."
      : "to już świadomy zapas, nie zaokrąglenie."}`;
  return t;
}

function prognozaMocy(idOkresu){
  const okres = okresPrognozy(idOkresu);
  if (!okres) return pusto("Prognozy");

  const cele = [...okres.cele].sort((a,b) => a.s - b.s);
  const ftpTeraz = ftpBiezace();
  const wkg = (w) => { const q = watyNaKg(w); return q == null ? "" : liczba(q,2) + " W/kg"; };
  const znakFtp = znakBiezacy(okres.id, "ftp");

  const wiersze = cele.map(c => {
    const r = rekordOkna(c.s);
    const znak = znakBiezacy(okres.id, String(c.s));
    const brak = r ? c.w - r.waty : null;
    return `
      <li class="cel-wiersz${znak === "tak" ? " zrobiony" : ""}" data-pole="${c.s}">
        <span class="cel-czas">${oknoNaTekst(c.s)}</span>
        <span class="cel-waty">${c.w} W</span>
        <span class="cel-wkg">${wkg(c.w)}</span>
        <span class="cel-dzis">${
          !r ? `dziś tego okna nikt nie zmierzył`
          : brak > 0
            ? `dziś <b>${r.waty} W</b>${znacznikErg(r.jazda)} · brakuje
               <b>+${brak} W</b> (+${liczba(brak / r.waty * 100, 0)}%)`
            : `dziś <b>${r.waty} W</b>${znacznikErg(r.jazda)} ·
               <b>pomiar już to bije</b>`
        }</span>
        <span class="cel-znak" data-pole="${c.s}">
          ${przyciskZnaku("tak", znak)}${przyciskZnaku("nie", znak)}
        </span>
      </li>`;
  }).join("");

  const brakFtp = okres.ftp - (ftpTeraz || 0);

  return `
  <section id="prognoza" data-okres="${okres.id}">
    <h2>Prognoza mocy — ${okres.tytul}</h2>
    <p class="opis">
      To nie jest pomiar i nie jest wynik żadnego modelu. To <b>Twoje
      szacunki</b> z ${pl(okres.ustalone)}: tak ma wyglądać krzywa z zakładki
      <a class="odn-zakladka" href="#postepy/dane">Dane</a> na koniec
      ${okres.tytul.replace("XII ", "grudnia ")}. Strona trzyma je w danych,
      rysuje i zestawia z tym, co naprawdę zmierzone — nic tu nie zgaduje.
      <br>Zielona linia to prognoza, cienka bursztynowa to dzisiejszy rekord
      na to samo okno. Odległość między nimi jest całą treścią tego wykresu.
    </p>
    ${wykresPrognozy(okres)}
  </section>

  <section>
    <h2>Cele po kolei</h2>
    <p class="opis">
      Przy każdym celu stoi to, co dziś zmierzone, i ile do niego brakuje.
      Ptaszek albo krzyżyk zaznaczasz sam — strona sama niczego nie rozstrzyga,
      bo termin (${pl(okres.na_kiedy)}) jeszcze nie minął. Dotknięcie
      zaznaczonego znaku zdejmuje go z powrotem.
    </p>
    <ul class="cele-prognozy">${wiersze}</ul>
  </section>

  <section>
    <h2>FTP — liczba, wokół której kręci się reszta</h2>
    <p class="opis">
      FTP to moc, którą utrzymasz przez mniej więcej godzinę. Z niej biorą się
      strefy treningowe, więc pomyłka o 20 W przesuwa cały plan.
    </p>
    <div class="ftp-blok">
      <div class="ftp-czlon">
        <div class="ftp-etykieta">FTP dziś</div>
        <div class="ftp-wpis">
          <input id="ftp-pole" type="number" inputmode="numeric" min="50" max="600"
            step="1" value="${ftpTeraz == null ? "" : ftpTeraz}"
            aria-label="Bieżące FTP w watach">
          <span class="jedn">W</span>
          <button class="kolko-akcja" id="ftp-zapisz" title="Zapisz">✓</button>
          <button class="kolko-akcja" id="ftp-anuluj" title="Cofnij">✗</button>
        </div>
        <div class="ftp-stopka"><span id="ftp-wkg">${
          ftpTeraz == null ? "" : wkg(ftpTeraz)}</span></div>
      </div>
      <div class="ftp-most">
        <span class="strzalka">→</span>
        <span id="ftp-brak">${brakFtp > 0 ? "+" + brakFtp + " W" : "dowiezione"}</span>
        <span id="ftp-brak-proc">${ftpTeraz && brakFtp > 0
          ? "(+" + liczba(brakFtp / ftpTeraz * 100, 0) + "%)" : ""}</span>
      </div>
      <div class="ftp-czlon${znakFtp === "tak" ? " zrobiony" : ""}">
        <div class="ftp-etykieta">FTP — prognoza na ${okres.tytul}</div>
        <div class="ftp-liczba cel">${okres.ftp} <span
          style="font-size:16px;font-weight:600">W</span></div>
        <div class="ftp-stopka">${wkg(okres.ftp)}</div>
        <div class="ftp-znak cel-znak" data-pole="ftp">
          ${przyciskZnaku("tak", znakFtp)}${przyciskZnaku("nie", znakFtp)}
        </div>
      </div>
    </div>
    <div class="prognoza-dol">
      <span id="prognoza-stan"></span>
      <button class="link-tekstowy" id="prognoza-eksport">Zaznaczenia dla Claude'a…</button>
    </div>
    <textarea id="prognoza-eksport-pole" rows="6" hidden readonly></textarea>
    <div class="info">
      ${uwagaSpojnosci(okres)}
      <br>Bieżące FTP i wszystkie ptaszki zapisują się <b>na tym urządzeniu</b>.
