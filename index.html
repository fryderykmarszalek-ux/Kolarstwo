<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kolarstwo — Fryderyk Marszałek</title>
<style>
/* ---------------------------------------------------------------------------
   ROLE, NIE KOLORY. Kod pyta o rolę ("--akcent"), nigdy o konkretny kolor.
   Motyw zmienia wartości w jednym miejscu i cała strona idzie za nim.

   Kolory danych dobrane walidatorem, nie okiem:
     niebieski / zielony / czerwony przechodzą testy rozróżnialności
     w obu motywach, też w symulacji trzech rodzajów daltonizmu.
   Odrzucone: pomarańczowy plan (ΔE 10,8 do czerwieni przy progu 15),
   fioletowy (ΔE 1,9 do niebieskiego w ciemnym), żółty (ΔE 13,0 w ciemnym).
   --------------------------------------------------------------------------- */
:root{
  color-scheme:light;
  --tlo:#e8edf5;          /* plan strony — celowo nie biały */
  --powierzchnia:#f9fbfd; /* karta z treścią, tło wykresów  */
  --plyta:#eef2f9;        /* kafelki, pasek 2               */
  --tekst:#141821;        /* 17,1:1 na powierzchni */
  --slaby:#5d6472;        /*  5,3:1 na kafelku     */
  --linia:#d7dee9;
  --akcent:#2a78d6;       /* DANE: jazda — TYLKO dane, nigdy interfejs */
  /* Barwy miar na Porównaniach S. Każda miara ma własną, żeby pasy dało się
     rozróżnić przy przewijaniu. Dobrane walidatorem z pakietu dataviz,
     w kolejności pasów: czas, prędkość, moc, tętno. Komplet przechodzi
     wszystkie pięć kontroli w OBU motywach (pasmo jasności, próg nasycenia,
     rozróżnialność przy daltonizmie, próg dla widzenia pełnego, kontrast). */
  --seria-czas:#2a78d6;
  --seria-predkosc:#0d9488;
  --seria-moc:#b45309;
  --seria-tetno:#b02893;
  --plan:#12895f;         /* DANE: plan i cel       */
  --alarm:#d03b3b;        /* DANE: ponad limit      */
  --odciazenie:#e2e8f2;
  --cien:rgba(20,24,33,.07);
  --ikona-krycie:.17;
}
@media (prefers-color-scheme: dark){
  :root:not([data-motyw="jasny"]){
    color-scheme:dark;
    --tlo:#0f1218; --powierzchnia:#171b23; --plyta:#1f242e;
    --tekst:#f2f5fa; --slaby:#98a1b2; --linia:#262c37;
    --akcent:#3987e5;
    --plan:#199e70; --alarm:#e66767;
    --seria-czas:#3987e5; --seria-predkosc:#22a99a;
    --seria-moc:#c07f28; --seria-tetno:#cf5aab;
    --odciazenie:#232936; --cien:rgba(0,0,0,.35); --ikona-krycie:.10;
  }
}
:root[data-motyw="ciemny"]{
  color-scheme:dark;
  --tlo:#0f1218; --powierzchnia:#171b23; --plyta:#1f242e;
  --tekst:#f2f5fa; --slaby:#98a1b2; --linia:#262c37;
  --akcent:#3987e5;
  --plan:#199e70; --alarm:#e66767;
  --seria-czas:#3987e5; --seria-predkosc:#22a99a;
  --seria-moc:#c07f28; --seria-tetno:#cf5aab;
  --odciazenie:#232936; --cien:rgba(0,0,0,.35); --ikona-krycie:.10;
}

/* --- Tożsamość sekcji. Kolor należy do zakładki na stałe, nie do jej stanu.
   Aktywna = pełne nasycenie, nieaktywna = ten sam kolor ledwie tknięty.
   Te barwy żyją wyłącznie w nawigacji i na krawędzi karty — NIGDY w wykresie. --- */
.b-bursztyn{--sek-kropka:#d97706;--sek-napis:#92400e;--sek-tlo:#f5ebdf;
  --sek-tlo-slabe:#f7f4f1;--sek-pigulka:#92400e;--na-pigulce:#ffffff}
.b-turkus{--sek-kropka:#0d9488;--sek-napis:#115e59;--sek-tlo:#ddefef;
  --sek-tlo-slabe:#edf6f7;--sek-pigulka:#115e59;--na-pigulce:#ffffff}
.b-fiolet{--sek-kropka:#7c3aed;--sek-napis:#5b21b6;--sek-tlo:#eae4fb;
  --sek-tlo-slabe:#f3f1fc;--sek-pigulka:#5b21b6;--na-pigulce:#ffffff}
.b-limonka{--sek-kropka:#4d7c0f;--sek-napis:#365314;--sek-tlo:#e4ece0;
  --sek-tlo-slabe:#f0f5f1;--sek-pigulka:#365314;--na-pigulce:#ffffff}
.b-fuksja{--sek-kropka:#c026d3;--sek-napis:#86198f;--sek-tlo:#f2e1f8;
  --sek-tlo-slabe:#f6f0fb;--sek-pigulka:#86198f;--na-pigulce:#ffffff}
.b-cyjan{--sek-kropka:#0891b2;--sek-napis:#155e75;--sek-tlo:#dceef4;
  --sek-tlo-slabe:#edf6f9;--sek-pigulka:#155e75;--na-pigulce:#ffffff}
.b-pomarancz{--sek-kropka:#ea580c;--sek-napis:#9a3412;--sek-tlo:#f7e7e0;
  --sek-tlo-slabe:#f8f3f1;--sek-pigulka:#9a3412;--na-pigulce:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-motyw="jasny"]) {
.b-bursztyn{--sek-kropka:#f59e0b;--sek-napis:#fcd34d;--sek-tlo:#48381e;
  --sek-tlo-slabe:#2d2821;--sek-pigulka:#f59e0b;--na-pigulce:#0f1218}
.b-turkus{--sek-kropka:#14b8a6;--sek-napis:#5eead4;--sek-tlo:#163e40;
  --sek-tlo-slabe:#172b30;--sek-pigulka:#14b8a6;--na-pigulce:#0f1218}

.b-limonka{--sek-kropka:#84cc16;--sek-napis:#bef264;--sek-tlo:#2f4220;

.b-pomarancz{--sek-kropka:#f97316;--sek-napis:#fdba74;--sek-tlo:#492e20;

:root[data-motyw="ciemny"]{
.b-bursztyn{--sek-kropka:#f59e0b;--sek-napis:#fcd34d;--sek-tlo:#48381e;
  --sek-tlo-slabe:#2d2821;--sek-pigulka:#f59e0b;--na-pigulce:#0f1218}
.b-turkus{--sek-kropka:#14b8a6;--sek-napis:#5eead4;--sek-tlo:#163e40;
  --sek-tlo-slabe:#172b30;--sek-pigulka:#14b8a6;--na-pigulce:#0f1218}
.b-fiolet{--sek-kropka:#8b5cf6;--sek-napis:#c4b5fd;--sek-tlo:#312951;
  --sek-tlo-slabe:#232238;--sek-pigulka:#a78bfa;--na-pigulce:#0f1218}
.b-limonka{--sek-kropka:#84cc16;--sek-napis:#bef264;--sek-tlo:#2f4220;
  --sek-tlo-slabe:#222d22;--sek-pigulka:#84cc16;--na-pigulce:#0f1218}
.b-fuksja{--sek-kropka:#d946ef;--sek-napis:#f0abfc;--sek-tlo:#422450;
  --sek-tlo-slabe:#2a1f37;--sek-pigulka:#d946ef;--na-pigulce:#0f1218}
.b-cyjan{--sek-kropka:#22d3ee;--sek-napis:#67e8f9;--sek-tlo:#194350;
  --sek-tlo-slabe:#182d37;--sek-pigulka:#22d3ee;--na-pigulce:#0f1218}
.b-pomarancz{--sek-kropka:#f97316;--sek-napis:#fdba74;--sek-tlo:#492e20;
  --sek-tlo-slabe:#2e2422;--sek-pigulka:#f97316;--na-pigulce:#0f1218}
}

*{box-sizing:border-box}

/* Warstwa dekoracyjna: leży pod wszystkim, jak „przesuń na spód" w Wordzie.
   pointer-events:none sprawia, że palec jej nie zauważa — kliknięcia
   przechodzą na wylot. Karta z treścią jest nieprzezroczysta, więc ikony
   widać wyłącznie na marginesach i nigdy pod wykresem. */
#tlo-ikony{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  color:var(--sek-kropka);
  transition:color .3s ease;
}
#tlo-ikony svg{position:absolute;opacity:var(--ikona-krycie)}
header,.pasek1,.pasek2-obudowa,main,footer{position:relative;z-index:1}
body{
  margin:0; background:var(--tlo); color:var(--tekst);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}

/* --- nagłówek: nazwa na środku, jak na szkicu --- */
header{
  padding:18px 20px 13px;text-align:center;position:relative;
  /* Kolor sekcji wchodzi na nagłówek, ale zaraz gaśnie — ma mówić
     „tu jesteś", nie przeciągać uwagi na siebie. */
  background:linear-gradient(180deg, var(--sek-tlo) 0%, transparent 100%);
  transition:background .3s ease;
}
#motyw{
  position:absolute;right:14px;top:14px;appearance:none;cursor:pointer;
  background:var(--plyta);border:1px solid var(--linia);color:var(--slaby);
  font:inherit;font-size:13px;line-height:1;padding:7px 11px;border-radius:99px;
  transition:color .18s ease,border-color .18s ease;
}
#motyw:hover{color:var(--tekst);border-color:var(--slaby)}

/* Odnośnik do profilu na Stravie — lustro przycisku motywu, po drugiej stronie
   nagłówka. Znak rysowany od zera jako SVG, żadnego pliku ani biblioteki.
   Barwa: chrom interfejsu, nie pomarańcz Stravy. Pomarańcz jest w tym projekcie
   zajęty przez zakładkę Z5, a kolory sekcji mają jedno znaczenie: „tu jesteś".
   Tożsamość Stravy niesie tu KSZTAŁT, zgodnie z zasadą, że rozróżnienia
   niebędące danymi idą sylwetką, nie kolorem. */
#strava{
  position:absolute;left:14px;top:14px;
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:99px;
  background:var(--plyta);border:1px solid var(--linia);
  /* Barwa firmowa Stravy. Wyłamuje się z systemu ról świadomie, na wyraźną
     zgodę Fryderyka: to znak cudzej marki, a nie dana ani element nawigacji,
     więc nie miesza się z niczyim znaczeniem. */
  color:#FC4C02;
  transition:border-color .18s ease,transform .16s ease;
}
#strava:hover{border-color:#FC4C02}
#strava:active{transform:scale(.94)}
#strava svg{display:block;width:16px;height:16px}
header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
header .pod{color:var(--slaby);font-size:12.5px;margin-top:3px}

/* --- POZIOM 1: pasek zakładek, obramowany z góry i z dołu --- */
.pasek1{
  background:var(--powierzchnia);
  border-top:1px solid var(--linia);
  border-bottom:1px solid var(--linia);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pasek1{padding-top:6px}   /* zapas na powiększenie aktywnej zakładki */
.pasek1 .wiersz{display:flex;gap:6px;width:max-content;margin:0 auto}
.pasek1::-webkit-scrollbar{display:none}
.pasek1 button{
  appearance:none;background:none;border:0;cursor:pointer;
  font:inherit;font-size:15px;color:var(--slaby);
  padding:12px 18px;white-space:nowrap;position:relative;
  border-radius:10px 10px 0 0;
  transform-origin:center bottom;
  transition:color .16s ease, background .16s ease,
             transform .32s cubic-bezier(.34,1.56,.64,1);
}
.pasek1 button{background:var(--sek-tlo-slabe)}
.pasek1 button::before{           /* kropka tożsamości sekcji */
  content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--sek-kropka);margin-right:7px;vertical-align:1px;
  transition:width .2s ease,height .2s ease;
}
.pasek1 button:hover{color:var(--tekst);background:var(--sek-tlo)}
.pasek1 button:active{transform:scale(.94);transition-duration:.09s}
.pasek1 button.akt{
  color:var(--sek-napis);font-weight:600;background:var(--sek-tlo);
  transform:scale(1.08);
}
.pasek1 button.akt::before{width:8px;height:8px}
.pasek1 button.akt:active{transform:scale(1.02)}
.pasek1 button.akt::after{
  content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;
  background:var(--sek-kropka);border-radius:3px 3px 0 0;
}
.pasek1 button.akt .strzalka{color:var(--sek-napis)}
.pasek1 button .strzalka{
  display:inline-block;margin-left:6px;font-size:10px;color:var(--slaby);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.pasek1 button.akt .strzalka{transform:rotate(180deg)}

/* --- POZIOM 2: mini-zakładki, rozwijane kliknięciem --- */
.pasek2-obudowa{
  max-height:0;opacity:0;overflow:hidden;
  border-bottom:1px solid transparent;
  transition:max-height .3s cubic-bezier(.4,0,.2,1),
             opacity .22s ease,
             border-color .3s ease;
}
.pasek2-obudowa.otwarty{
  max-height:140px;opacity:1;border-bottom-color:var(--linia);
}
.pasek2{
  padding:9px 12px;background:var(--sek-tlo-slabe);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.pasek2 .wiersz{display:flex;gap:6px;width:max-content;margin:0 auto}
.pasek2::-webkit-scrollbar{display:none}
.pasek2 button{
  appearance:none;border:1px solid transparent;cursor:pointer;
  background:transparent;font:inherit;font-size:13.5px;color:var(--slaby);
  padding:6px 14px;border-radius:999px;white-space:nowrap;
  transform-origin:center;
  transition:background .16s ease,color .16s ease,border-color .16s ease,
             transform .32s cubic-bezier(.34,1.56,.64,1);
}
.pasek2 button{background:var(--sek-tlo);color:var(--sek-napis)}
.pasek2 button:hover{background:var(--powierzchnia);border-color:var(--sek-kropka)}
.pasek2 button:active{transform:scale(.93);transition-duration:.09s}
.pasek2 button.akt{
  background:var(--sek-pigulka);color:var(--na-pigulce);font-weight:600;
  border-color:transparent;transform:scale(1.1);
}
.pasek2 button.akt:hover{background:var(--sek-pigulka);color:var(--na-pigulce)}
.pasek2 button.akt:active{transform:scale(1.04)}

main{
  padding:20px;max-width:1000px;margin:18px auto 0;
  background:var(--powierzchnia);
  border:1px solid var(--linia);border-top:3px solid var(--sek-kropka);
  border-radius:14px;
  box-shadow:0 1px 3px var(--cien);
}
main.wchodzi{animation:wejscie .26s ease both}
@keyframes wejscie{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- Wiek danych. Strona sama z siebie nie wie nic: pokazuje stan z pliku,
   który dowozi automat. Gdy automat stanie, wszystko poniżej zamarza po cichu
   i wygląda dokładnie tak samo jak dane świeże. Licznik dni od ostatniej jazdy
   zamarza pierwszy, a to na nim stoi kryterium sezonu — dlatego wiek danych
   dostaje własny pasek nad treścią, widoczny na każdej zakładce.
   Czerwień znaczy tu to samo, co wszędzie indziej na tej stronie: przekroczony
   próg, patrz i reaguj. Raz jest to próg przerwy, raz próg wieku danych. --- */
#wiek-danych{
  max-width:1000px;margin:16px auto -6px;padding:11px 15px;
  background:var(--plyta);border:1px solid var(--linia);
  border-left:3px solid var(--slaby);border-radius:10px;
  font-size:13px;line-height:1.45;color:var(--slaby);
  position:relative;z-index:1;
}
#wiek-danych:empty{display:none}
#wiek-danych b{color:var(--tekst);font-weight:600}
#wiek-danych.stoi{border-left-color:var(--alarm)}
#wiek-danych.stoi b{color:var(--alarm)}
#wiek-danych a{color:var(--slaby);text-decoration:underline}
#wiek-danych a:hover{color:var(--tekst)}

h2{font-size:15px;font-weight:600;margin:0 0 4px}
.opis{color:var(--slaby);font-size:13px;margin:0 0 14px}
section{margin-bottom:34px}

.kafelki{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kafel{
  background:var(--plyta);border-radius:10px;padding:13px 15px;
  border:1px solid transparent;
  transition:border-color .16s ease, transform .16s ease;
}
.kafel:hover{border-color:var(--sek-kropka);transform:translateY(-1px)}
.kafel .etykieta{font-size:12px;color:var(--slaby)}
.kafel .liczba{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.kafel .liczba.data{font-size:20px;letter-spacing:-.01em}
.kafel .stopka{font-size:12px;color:var(--slaby);margin-top:2px}
.kafel.uwaga .liczba{color:var(--alarm)}

.wykres{display:flex;align-items:flex-start}
.wykres .os{flex:0 0 auto}
.ramka{overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-width:0}
svg{display:block}
.dysc{display:inline-block;vertical-align:-3px;flex:0 0 auto}
.slupek,.tydzien,.miesiac{
  transform-box:fill-box;transform-origin:bottom;
  animation:wyrasta .5s cubic-bezier(.2,.85,.25,1) both;
  cursor:pointer;
}
@keyframes wyrasta{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.slupek:hover,.tydzien:hover,.miesiac:hover{opacity:1}
.slupek.wybrany,.tydzien.wybrany,.miesiac.wybrany{
  opacity:1;stroke:var(--tekst);stroke-width:1.5;paint-order:stroke;
}
.legenda{
  display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;
  font-size:12.5px;color:var(--slaby);
}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{
  width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto;
}
.legenda i.kreska{height:0;border-top:2px dashed currentColor;border-radius:0}

.info{
  font-size:13px;color:var(--slaby);margin-top:10px;min-height:22px;
  background:var(--plyta);border-radius:8px;padding:8px 12px;
}
.info b{color:var(--tekst);font-weight:600}

/* --- Tabela segmentów. Sześć kolumn nie mieści się na telefonie, więc tabela
   przewija się w poziomie we własnej ramce — reszta strony nigdy nie jedzie
   na boki. --- */
.tabelka{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;
  border:1px solid var(--linia);border-radius:10px}
/* table-layout:fixed — bez tego przeglądarka rozdziela szerokości według
   długości treści i kolumny stoją w przypadkowych odstępach: "6,94 km" dostaje
   dużo miejsca, "8" prawie żadnego. Przy stałym układzie każda kolumna liczbowa
   ma tę samą szerokość, więc odstępy są równe na całej tabeli. Liczby zostają
   dosunięte do prawej i pisane cyframi o równej szerokości (tabular-nums),
   dzięki czemu rzędy wielkości układają się jeden pod drugim i da się je
   porównywać wzrokiem, bez czytania. */
table.segmenty{border-collapse:collapse;width:100%;min-width:760px;
  table-layout:fixed;font-size:13.5px}
table.segmenty th:first-child,table.segmenty td:first-child{width:28%}
table.segmenty th:not(:first-child),table.segmenty td:not(:first-child){width:12%}
table.segmenty th{padding:0;border-bottom:1px solid var(--linia);text-align:right;
  background:var(--plyta)}
table.segmenty th:first-child{text-align:left}
table.segmenty th button{
  appearance:none;background:none;border:0;font:inherit;color:var(--slaby);
  padding:9px 10px;cursor:pointer;white-space:nowrap;width:100%;
  display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;
  transition:color .15s ease;
}
table.segmenty th:first-child button{justify-content:flex-start}
table.segmenty th button:hover{color:var(--tekst)}
table.segmenty th.akt button{color:var(--tekst);font-weight:600}
table.segmenty th .strzalka-sort{font-size:10px;opacity:.85}
table.segmenty td{padding:8px 10px;border-bottom:1px solid var(--linia);
  text-align:right;font-variant-numeric:tabular-nums;color:var(--slaby)}
table.segmenty td:first-child{text-align:left;color:var(--tekst)}
table.segmenty td.akt{color:var(--tekst);font-weight:600}
table.segmenty tr:last-child td{border-bottom:0}
/* Ostatnia kolumna dotykała krawędzi ramki co do piksela i wyglądała na
   uciętą — stąd oddech po prawej. */
table.segmenty th:last-child,table.segmenty td:last-child{padding-right:16px}
table.segmenty th:last-child button{padding-right:16px}
table.segmenty tbody tr:hover td{background:var(--plyta)}
.seg-nazwa{color:inherit;display:block;overflow-wrap:anywhere;text-decoration:none}
.seg-nazwa .strzalka-wew{color:var(--slaby);margin-left:5px;font-size:15px;line-height:1}
.seg-nazwa:hover{text-decoration:underline}
.seg-nazwa:hover .strzalka-wew{color:var(--tekst)}
.seg-zwift{display:inline-block;vertical-align:-2px;margin-right:5px;color:var(--slaby)}
.seg-data{display:block;font-size:11.5px;color:var(--slaby);margin-top:1px;min-height:1px}
/* Pasek nad tabelą: filtry po lewej, szukanie i reset po prawej. Na wąskim
   ekranie grupa szukania spada do drugiej linii zamiast ściskać pastylki. */
/* --- Porównania S: tytuł segmentu w jednej linii z kółkiem powrotu. --- */
.proba-tytul{display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;margin:0 0 4px}
.proba-tytul h2{margin:0}
.kolko-reset{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:99px;text-decoration:none;
  background:var(--plyta);border:1px solid var(--linia);color:var(--slaby);
  transition:color .15s ease,border-color .15s ease,transform .16s ease;
}
.kolko-reset:hover{color:var(--tekst);border-color:var(--slaby)}
.kolko-reset:active{transform:scale(.92) rotate(-40deg)}
/* Odnośnik do sąsiedniej zakładki nosi jej barwę — to nadal nawigacja,
   a nie dana, więc kolor sekcji jest tu na swoim miejscu. */
.odn-zakladka{color:var(--sek-napis);font-weight:600;text-decoration:underline;
  text-underline-offset:2px}
.proba-naglowek{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:3px}
.proba-naglowek .odn{color:var(--tekst);text-decoration:none;
  display:inline-flex;align-items:center;gap:5px}
.proba-naglowek .odn:hover{text-decoration:underline}
/* Znacznik ERG — chodzi o to, żeby liczba obok niego nigdy nie udawała
   maksimum zawodnika. Kształt pastylki jak przy RPE, barwa mocy. */
.znacznik-erg{
  display:inline-block;margin-left:6px;vertical-align:1px;
  font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--seria-moc);padding:1px 6px;border-radius:99px;
  border:1px solid var(--seria-moc);opacity:.9;
}
.znacznik-rpe{
  font-size:11.5px;font-weight:600;color:var(--slaby);
  padding:2px 8px;border-radius:99px;
  background:var(--tlo);border:1px solid var(--linia);
}
.proba-dane{color:var(--slaby);font-size:12.5px;line-height:1.5}
/* Wykresy zajmują pas o stałej wysokości, więc przy szerokim ekranie po
   prawej zostaje pusta kolumna. Wnioski wchodzą właśnie tam. Poniżej 900 px
   kolumna schodzi pod wykresy, zamiast ściskać oba w nieczytelne paski. */
.porownanie-uklad{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;
  align-items:start}
.porownanie-wykresy{min-width:0}
@media (max-width: 900px){
  .porownanie-uklad{grid-template-columns:minmax(0,1fr)}
}
.analiza{
  background:var(--plyta);border:1px solid var(--linia);border-radius:10px;
  padding:13px 15px;position:sticky;top:12px;
}
@media (max-width: 900px){ .analiza{position:static} }
.analiza-gora{display:flex;justify-content:space-between;align-items:baseline;
  gap:8px;margin-bottom:9px}
.analiza-tytul{font-size:13px;font-weight:600}
.analiza-zrodlo{font-size:11px;color:var(--slaby)}
.analiza-lista{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.analiza-lista li{font-size:12.5px;line-height:1.45;color:var(--slaby)}
.analiza-lista li b{display:block;font-size:11px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;color:var(--tekst);margin-bottom:1px}
.analiza-lista li.uwaga b{color:var(--alarm)}
.analiza-recznie{margin-top:11px;padding-top:10px;border-top:1px solid var(--linia)}
.analiza-recznie b{font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.analiza-recznie p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:var(--slaby)}
.analiza-stopka{margin:11px 0 0;padding-top:9px;border-top:1px solid var(--linia);
  font-size:11px;line-height:1.4;color:var(--slaby);opacity:.85}
.podpis-wykresu{color:var(--slaby);font-size:12px;line-height:1.45;margin:14px 0 2px}

/* --- Zakładka Dane: krzywa mocy i historia rekordów --- */
/* Krzywa skaluje się do szerokości karty, bo jej sensem jest KSZTAŁT, a nie
   odczyt pojedynczej liczby — te stoją w tabeli pod spodem. */
.krzywa-mocy{margin-top:6px;background:var(--plyta);border:1px solid var(--linia);
  border-radius:10px;padding:10px 12px 4px}
.krzywa-mocy svg{display:block;height:auto;overflow:visible}
table.segmenty.moc th:first-child,table.segmenty.moc td:first-child{width:20%}
table.segmenty.moc th:not(:first-child),table.segmenty.moc td:not(:first-child){width:20%}
table.segmenty.moc{min-width:520px}
/* Tło komórki z watami: ta sama informacja co w krzywej, tylko wiersz po
   wierszu — widać kształt spadku, nie czytając liczb. Wypełnienie od prawej,
   bo liczby też są dosunięte do prawej. */
.komorka-moc{position:relative}
.komorka-moc::before{
  content:"";position:absolute;inset:3px 0;left:auto;right:0;
  width:var(--udzial);background:var(--seria-moc);opacity:.16;border-radius:3px;
}
.komorka-moc>*{position:relative}
.kroki-mocy{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:1px;
  border:1px solid var(--linia);border-radius:10px;overflow:hidden}
.kroki-mocy li{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:9px 13px;font-size:13px;background:var(--powierzchnia);
  border-top:1px solid var(--linia)}
.kroki-mocy li:first-child{border-top:0}
.kroki-data{color:var(--slaby);font-variant-numeric:tabular-nums;min-width:82px}
.kroki-waty{font-weight:600;font-variant-numeric:tabular-nums;min-width:56px}
.kroki-zysk{color:var(--seria-moc);font-size:12px;font-weight:600;min-width:86px}
.kroki-mocy .odn{color:var(--slaby);text-decoration:none;font-size:12.5px}
.kroki-mocy .odn:hover{color:var(--tekst);text-decoration:underline}
rect.proba-punkt{cursor:pointer}

/* --- Prognozy: krzywa, której jeszcze nie ma ---
   Żadnej nowej barwy. Prognoza JEST celem, więc jest zielona — ta sama rola
   co linia planu na wykresie godzin i zielony słupek dowiezionego tygodnia.
   Krzywa „dziś" JEST pomiarem mocy, więc jest bursztynowa — ta sama rola co
   na krzywej rekordów. Czerwień przy krzyżyku to rozszerzenie roli alarmu
   z „przerwa ponad limit" na „cel niedowieziony"; zieleń i czerwień stoją tu
   naprzeciw siebie jako dwie odpowiedzi na to samo pytanie. --- */
.cele-prognozy{list-style:none;margin:0;padding:0;display:grid;gap:1px;
  border:1px solid var(--linia);border-radius:10px;overflow:hidden}
.cel-wiersz{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;
  padding:10px 13px;background:var(--powierzchnia);
  border-top:1px solid var(--linia);transition:background .16s ease}
.cel-wiersz:first-child{border-top:0}
.cel-wiersz.zrobiony{background:color-mix(in srgb,var(--plan) 9%,var(--powierzchnia))}
.cel-czas{font-weight:600;min-width:54px;font-variant-numeric:tabular-nums}
.cel-waty{color:var(--plan);font-weight:600;font-size:15px;min-width:70px;
  font-variant-numeric:tabular-nums}
.cel-wkg{color:var(--slaby);font-size:12.5px;min-width:64px;
  font-variant-numeric:tabular-nums}
.cel-dzis{color:var(--slaby);font-size:12.5px;flex:1 1 200px;line-height:1.45}
.cel-dzis b{color:var(--tekst);font-weight:600}
.cel-znak{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.znak-tak.wybrany{color:var(--plan);border-color:var(--plan)}
.znak-nie.wybrany{color:var(--alarm);border-color:var(--alarm)}
.kolko-akcja.znak-tak:hover{color:var(--plan);border-color:var(--plan)}
.kolko-akcja.znak-nie:hover{color:var(--alarm);border-color:var(--alarm)}
/* Znaczek przy punkcie na krzywej. Rysowany od razu dla obu odpowiedzi
   i schowany przezroczystością — ta sama zasada co etykiety prób: dotknięcie
   przekłada klasę, nie buduje SVG od nowa. */
text.znak-punktu{opacity:0;transition:opacity .14s ease;pointer-events:none}
text.znak-punktu.wybrany{opacity:1}

/* FTP ma własną kartę, bo jest jedną liczbą, wokół której kręci się reszta. */
.ftp-blok{margin-top:6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--plyta);border:1px solid var(--linia);border-radius:12px;
  padding:16px 18px}
.ftp-czlon{flex:1 1 200px;min-width:0;border-radius:10px;
  transition:background .16s ease}
.ftp-czlon.zrobiony{background:color-mix(in srgb,var(--plan) 9%,transparent);
  padding:8px 10px;margin:-8px -10px}
.ftp-etykieta{font-size:12px;color:var(--slaby)}
.ftp-liczba{font-size:36px;font-weight:600;letter-spacing:-.025em;line-height:1.12;
  font-variant-numeric:tabular-nums}
.ftp-liczba.cel{color:var(--plan)}
.ftp-stopka{font-size:12px;color:var(--slaby);margin-top:2px}
.ftp-most{display:flex;flex-direction:column;align-items:center;gap:1px;
  flex:0 0 auto;color:var(--slaby);font-size:12px;padding:0 2px;text-align:center}
.ftp-most .strzalka{font-size:22px;line-height:1;color:var(--plan)}
.ftp-most b{color:var(--tekst);font-weight:600}
.ftp-wpis{display:flex;align-items:center;gap:7px;margin-top:1px}
.ftp-wpis input{
  width:104px;box-sizing:border-box;font:inherit;font-size:32px;font-weight:600;
  letter-spacing:-.025em;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--tekst);background:var(--powierzchnia);
  border:1px solid var(--linia);border-radius:9px;padding:2px 9px;
  appearance:textfield;-moz-appearance:textfield;
}
.ftp-wpis input:focus{outline:0;border-color:var(--sek-kropka)}
.ftp-wpis input::-webkit-outer-spin-button,
.ftp-wpis input::-webkit-inner-spin-button{appearance:none;margin:0}
.ftp-wpis .jedn{font-size:15px;color:var(--slaby);margin-right:2px}
.ftp-znak{display:flex;gap:6px;margin-top:7px}
#prognoza-stan{display:block;margin-top:8px;font-size:11.5px;color:var(--slaby)}
#prognoza-eksport-pole{margin-top:8px;font-size:11.5px;width:100%;
  box-sizing:border-box;resize:vertical;font-family:inherit;
  color:var(--tekst);background:var(--powierzchnia);
  border:1px solid var(--linia);border-radius:8px;padding:8px 10px}
.prognoza-dol{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-top:10px;flex-wrap:wrap}
/* Na telefonie wiersz celu łamie się przewidywalnie: liczby i znaki w jednej
   linii, porównanie z dziś pod spodem. Bez tego jedne wiersze łamały się po
   „dziś", a inne nie, i lista wyglądała na krzywą. */
@media (max-width:560px){
  .cel-wiersz{gap:6px 10px}
  .cel-dzis{flex:1 0 100%;order:3;margin-top:1px}
  .cel-znak{order:2}
  .ftp-blok{gap:10px}
  .ftp-most{flex-direction:row;gap:8px;width:100%;justify-content:flex-start}
  .ftp-most .strzalka{transform:rotate(90deg)}   /* cel jest POD, nie obok */
}

/* --- Notatka do próby. Dwa kółka: ptaszek zapisuje, krzyżyk cofa. --- */
.notatka{margin-top:14px;padding:12px 14px;border-radius:10px;
  background:var(--plyta);border:1px solid var(--linia)}
.notatka-gora{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;flex-wrap:wrap;margin-bottom:7px}
.notatka-tytul{font-size:13px;font-weight:600}
.notatka-stan{font-size:11.5px;color:var(--slaby)}
.stan-brudnopis{color:var(--slaby)}
.stan-niezapisane{color:var(--alarm);font-weight:600}
.notatka textarea{
  width:100%;box-sizing:border-box;resize:vertical;
  font:inherit;font-size:13px;line-height:1.45;
  color:var(--tekst);background:var(--powierzchnia);
  border:1px solid var(--linia);border-radius:8px;padding:8px 10px;
}
.notatka textarea:focus{outline:0;border-color:var(--sek-kropka)}
.notatka-dol{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-top:8px;flex-wrap:wrap}
.notatka-przyciski{display:flex;gap:8px}
.kolko-akcja{
  appearance:none;font:inherit;font-size:14px;line-height:1;cursor:pointer;
  width:32px;height:32px;border-radius:99px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--powierzchnia);border:1px solid var(--linia);color:var(--slaby);
  transition:color .15s ease,border-color .15s ease,transform .16s ease;
}
#notatka-zapisz:hover{color:var(--plan);border-color:var(--plan)}
#notatka-anuluj:hover{color:var(--alarm);border-color:var(--alarm)}
.kolko-akcja:active{transform:scale(.92)}
.link-tekstowy{
  appearance:none;background:none;border:0;padding:0;cursor:pointer;
  font:inherit;font-size:12px;color:var(--slaby);text-decoration:underline;
  text-underline-offset:2px;
}
.link-tekstowy:hover{color:var(--tekst)}
#notatka-eksport-pole{margin-top:8px;font-size:11.5px}
.proba-dane b{color:var(--tekst)}
rect.proba{transform-box:fill-box;transform-origin:bottom;cursor:pointer;
  animation:wyrasta .5s cubic-bezier(.2,.85,.25,1) both;
  opacity:.6;transition:opacity .12s ease}
rect.proba.pb{opacity:.85}
rect.proba.wybrany{opacity:1;stroke:var(--tekst);stroke-width:1.5}
/* Etykiety wszystkich prób istnieją od początku — widać tę wybraną.
   Dzięki temu wybór nie buduje SVG od nowa i nic nie miga. */
text.etykieta-proby{opacity:0;transition:opacity .12s ease;pointer-events:none}
text.etykieta-proby.wybrany{opacity:1}
circle.punkt-proby{transition:r .12s ease}
.seria{margin-top:10px}
.podpis-serii{margin:0 0 2px 2px;font-size:11.5px;font-weight:600;color:var(--slaby);
  display:flex;align-items:center;gap:6px}
.podpis-serii i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.podpis-serii span{font-weight:400;opacity:.8}

.przelaczniki{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap;
  align-items:center;justify-content:space-between}
.grupa-filtry,.grupa-szukaj{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.szukajka{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:99px;
  background:var(--plyta);border:1px solid var(--linia);color:var(--slaby);
  transition:border-color .15s ease,color .15s ease;
}
.szukajka:focus-within{border-color:var(--sek-kropka);color:var(--tekst)}
.szukajka input{
  appearance:none;background:none;border:0;outline:0;font:inherit;font-size:12.5px;
  color:var(--tekst);width:130px;min-width:0;padding:1px 0;
}
.szukajka input::placeholder{color:var(--slaby)}
/* Safari rysuje w polu type="search" własny krzyżyk — dwa krzyżyki obok siebie
   znaczyłyby dwie różne rzeczy, więc zostawiamy tylko nasz. */
.szukajka input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#reset-segmentow{
  appearance:none;font:inherit;font-size:15px;line-height:1;cursor:pointer;
  width:30px;height:30px;border-radius:99px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--plyta);border:1px solid var(--linia);color:var(--slaby);
  transition:color .15s ease,border-color .15s ease,transform .16s ease;
}
#reset-segmentow:hover{color:var(--tekst);border-color:var(--slaby)}
#reset-segmentow:active{transform:scale(.92)}
.przelaczniki button{
  appearance:none;font:inherit;font-size:12.5px;cursor:pointer;
  padding:6px 12px;border-radius:99px;
  background:var(--plyta);border:1px solid var(--linia);color:var(--slaby);
  transition:color .15s ease,border-color .15s ease;
}
.przelaczniki button:hover{color:var(--tekst)}
.przelaczniki button.akt{color:var(--na-pigulce);background:var(--sek-pigulka);
  border-color:var(--sek-pigulka)}

.lista{margin-top:8px;border:1px solid var(--linia);border-radius:10px;overflow:hidden}
.lista .rzad{
  display:flex;align-items:center;gap:11px;padding:9px 13px;
  border-top:1px solid var(--linia);font-size:14px;
  transition:background .15s ease;
  color:inherit;text-decoration:none;cursor:pointer;
}
.lista .rzad:active{background:var(--sek-tlo)}
.lista .strzalka-zew{
  color:var(--slaby);font-size:13px;flex:0 0 auto;opacity:.55;
  transition:opacity .15s ease,transform .15s ease;
}
.lista .rzad:hover .strzalka-zew{opacity:1;transform:translate(1px,-1px)}
.odn{color:inherit;text-decoration:none;border-bottom:1px dotted var(--slaby)}
.odn:hover{border-bottom-color:var(--tekst)}
.lista .rzad:first-child{border-top:0}
.lista .rzad:hover{background:var(--plyta)}
.lista .rzad .ikona{color:var(--slaby);display:flex}
.lista .rzad .nazwa{flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lista .rzad .data{color:var(--slaby);font-size:12.5px;flex:0 0 auto}
.lista .rzad .km{font-variant-numeric:tabular-nums;flex:0 0 auto;
  color:var(--slaby);font-size:13px}

.pusto{
  border:1px dashed var(--linia);border-radius:10px;
  padding:44px 20px;text-align:center;color:var(--slaby);font-size:14px;
}
.pusto .znak{font-size:26px;font-weight:600;color:var(--linia);display:block;margin-bottom:6px}

footer{color:var(--slaby);font-size:12px;padding:14px 20px 34px;max-width:1000px;
       margin:0 auto;text-align:center}

/* szanuj ustawienie "ogranicz ruch" w systemie */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="tlo-ikony" aria-hidden="true"></div>

<header>
  <a id="strava" href="https://www.strava.com" target="_blank" rel="noopener"
     title="Mój profil na Stravie" aria-label="Otwórz mój profil na Stravie">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066
               m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
    </svg>
  </a>
  <button id="motyw" type="button" title="Motyw: auto / jasny / ciemny"></button>
  <h1>Kolarstwo — postępy</h1>
  <div class="pod" id="stopka-naglowka"></div>
</header>

<div class="pasek1" id="pasek1"></div>
<div class="pasek2-obudowa" id="pasek2-obudowa">
  <div class="pasek2" id="pasek2"></div>
</div>

<div id="wiek-danych" role="status"></div>
<main id="tresc"></main>
<footer id="stopka"></footer>

<script src="dane.js"></script>
<script>
"use strict";

/* ==========================================================================
   POMOCNICZE
   ========================================================================== */

// Daty trzymamy jako "RRRR-MM-DD". Do liczenia różnic używamy południa UTC,
// żeby zmiana czasu letni/zimowy nigdy nie przesunęła doby o jeden.
function naDzien(tekst){
  const [r,m,d] = tekst.slice(0,10).split("-").map(Number);
  return Date.UTC(r, m-1, d, 12);
}
function roznicaDni(a,b){ return Math.round((b-a)/86400000); }
function dzienNaTekst(ms){ return new Date(ms).toISOString().slice(0,10); }
function pl(tekst){                       // "2026-08-15" -> "15.08.2026"
  const [r,m,d] = tekst.slice(0,10).split("-");
  return d+"."+m+"."+r;
}
function liczba(x, miejsc){ return x.toFixed(miejsc).replace(".", ","); }

/* ==========================================================================
   WYLICZENIA — nic z tego nie jest zapisane w dane.js (wariant B)
   ========================================================================== */

const D = window.DANE;

// Decyzja Fryderyka: liczymy dopiero od tej daty. Historia sprzed niej
// zostaje w pliku nietknięta, ale nie wchodzi do żadnego wykresu.
const OD = D.meta.liczone_od;

const jazdy = D.aktywnosci.filter(a =>
  D.meta.typy_kolarskie.includes(a.typ) && a.data.slice(0,10) >= OD
);

const dniZJazda = [...new Set(jazdy.map(a => a.data.slice(0,10)))].sort();

const przerwy = [];
for (let i = 1; i < dniZJazda.length; i++){
  przerwy.push({
    dni: roznicaDni(naDzien(dniZJazda[i-1]), naDzien(dniZJazda[i])),
    od: dniZJazda[i-1],
    do: dniZJazda[i]
  });
}

const DZIS = dzienNaTekst(naDzien(D.meta.pobrano));
const ostatniDzien = dniZJazda[dniZJazda.length-1];
const przerwaTrwa = roznicaDni(naDzien(ostatniDzien), naDzien(DZIS));
const PROG = D.kryterium_przerwy.prog_dni;
const WARIANT = D.kryterium_przerwy.wybor;
const WYJAZDY = D.kryterium_przerwy.wyjazdy_bez_roweru || [];

// Wariant B: przerwa nachodząca na zgłoszony wyjazd bez roweru nie liczy się
// do kryterium. Warunek zgłoszenia z góry jest sprawdzany, nie zakładany.
function wyjazdDla(od, doo){
  if (WARIANT !== "B") return null;
  // Zgłoszenie musi wyprzedzić moment, w którym przerwa łamie limit — wtedy
  // jest regułą. Zgłoszone po tym dniu byłoby wymówką z datą wsteczną.
  const granica = dzienNaTekst(naDzien(od) + PROG*86400000);
  return WYJAZDY.find(w =>
    w.od <= doo && w.do >= od && w.zgloszony <= granica
  ) || null;
}
przerwy.forEach(p => { p.wyjazd = wyjazdDla(p.od, p.do); });
const przerwyLiczone = przerwy.filter(p => !p.wyjazd);
const zlamania = przerwyLiczone.filter(p => p.dni > PROG);

// Dzień złamania to nie początek i nie koniec przerwy, tylko moment, w którym
// przerwa przekroczyła próg: ostatnia jazda + PROG + 1 dzień.
const ostatnieZlamanie = (() => {
  if (!zlamania.length) return null;
  const p = zlamania[zlamania.length-1];
  const dzien = dzienNaTekst(naDzien(p.od) + (PROG+1)*86400000);
  return { dzien, przerwa: p, temu: roznicaDni(naDzien(dzien), naDzien(DZIS)) };
})();
const najdluzsza = przerwy.reduce((a,b) => b.dni > a.dni ? b : a);

function poniedzialek(tekst){
  const ms = naDzien(tekst);
  const dt = new Date(ms).getUTCDay();          // 0 = niedziela
  return dzienNaTekst(ms - ((dt+6)%7)*86400000);
}
const godzinyWTygodniu = {};
for (const a of jazdy){
  const p = poniedzialek(a.data);
  godzinyWTygodniu[p] = (godzinyWTygodniu[p]||0) + a.czas_ruchu_s/3600;
}
const tenTydzien = godzinyWTygodniu[poniedzialek(DZIS)] || 0;
const ostatniaJazda = jazdy[jazdy.length-1];
const wyjazdTrwa = wyjazdDla(ostatniDzien, DZIS);

/* ==========================================================================
   WIEK DANYCH — jedyne miejsce, w którym strona pyta o zegar urządzenia.
   Cała reszta liczy się względem dnia pobrania, bo tylko tyle strona naprawdę
   wie. Różnica między „co wiem" a „który mamy dzień" jest jedyną liczbą
   zdolną wykryć, że automat stanął.

   Progi wynikają z harmonogramu: automat chodzi raz na dobę, więc zdrowy stan
   to wiek 0 albo 1 dnia. Dwa dni = dwa nieudane odświeżenia z rzędu, warte
   wzmianki. Cztery = to już nie zacięcie, tylko awaria.
   ========================================================================== */

const dzisRzeczywisty = (() => {
  const t = new Date(), p = n => String(n).padStart(2,"0");
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
})();

// Zegar urządzenia potrafi się cofnąć (strefa, ręcznie przestawiona data).
// Ujemny wiek znaczy „nie wiem", a nie „dane z przyszłości" — ścinamy do zera.
const WIEK = Math.max(0, roznicaDni(naDzien(DZIS), naDzien(dzisRzeczywisty)));
const WIEK_UWAGA = 2;
const WIEK_ALARM = 4;
const DANE_STOJA = WIEK >= WIEK_ALARM;

const ADRES_AUTOMATU =
  "https://github.com/fryderykmarszalek-ux/Kolarstwo/actions";

function pokazWiekDanych(){
  const el = document.getElementById("wiek-danych");
  if (WIEK < WIEK_UWAGA){ el.textContent = ""; return; }
  el.classList.toggle("stoi", DANE_STOJA);
  el.innerHTML = DANE_STOJA
    ? `<b>Dane stoją od ${WIEK} dni.</b> Wszystko poniżej pokazuje stan na `
      + `${pl(DZIS)}, nie na dziś. Licznik dni od ostatniej jazdy jest `
      + `zaniżony o ${WIEK}, a kryterium sezonu liczy się z niepełnej historii. `
      + `Automat miał odświeżyć plik wieczorem i tego nie zrobił — `
      + `<a href="${ADRES_AUTOMATU}" target="_blank" rel="noopener">sprawdź przebiegi &#8599;</a>`
    : `Dane sprzed <b>${WIEK} dni</b> — stan na ${pl(DZIS)}. Automat odświeża `
      + `plik codziennie wieczorem; jeśli jutro ta data się nie ruszy, coś się zacięło.`;
}

/* ==========================================================================
   WYKRES C2 — PRZERWY
   Oś ucięta na 60 dniach: słupki dłuższe idą do sufitu, dostają ząbek
   i liczbę nad sobą. Bez tego 108 dni spłaszcza wszystkie normalne
   przerwy do kreski przy zerze.
   ========================================================================== */

const SUFIT = 60;

function wykresPrzerw(){
  const szerSlupka = 14, odstep = 3, marGora = 22, wys = 240, marDol = 34,
        szerOsi = 34;
  const szer = przerwy.length*(szerSlupka+odstep) + 60;
  const skala = d => (Math.min(d, SUFIT)/SUFIT) * wys;
  const wysCalk = wys + marGora + marDol;
  const PODZIALKA = [0,30,45,60];

  // --- oś: zostaje nieruchomo, nie przewija się razem ze słupkami ---
  let os = `<svg class="os" width="${szerOsi}" height="${wysCalk}" aria-hidden="true">`;
  for (const v of PODZIALKA){
    const y = marGora + wys - skala(v);
    os += `<text x="${szerOsi-6}" y="${y+4}" text-anchor="end"
            font-size="10" fill="var(--slaby)">${v===SUFIT?SUFIT+"+":v}</text>`;
  }
  // próg kryterium na stałej osi — przy przewijaniu musi zostać widoczny
  const yP = marGora + wys - skala(PROG);
  os += `<text x="${szerOsi-6}" y="${yP+4}" text-anchor="end" font-size="10"
          font-weight="600" fill="var(--alarm)">${PROG}</text>`;
  os += `</svg>`;

  // --- słupki: przewijane w poziomie ---
  let s = `<svg width="${szer}" height="${wysCalk}"
            role="img" aria-label="Przerwy między jazdami od ${pl(OD)}">`;

  for (const v of PODZIALKA){
    const y = marGora + wys - skala(v);
    s += `<line x1="0" y1="${y}" x2="${szer}" y2="${y}"
           stroke="var(--linia)" stroke-width="1"/>`;
  }

  const yProg = marGora + wys - skala(PROG);
  s += `<line x1="0" y1="${yProg}" x2="${szer}" y2="${yProg}"
         stroke="var(--alarm)" stroke-width="1.5" stroke-dasharray="5 3"/>`;

  przerwy.forEach((p, i) => {
    const x = 4 + i*(szerSlupka+odstep);
    const h = Math.max(skala(p.dni), 1.5);
    const y = marGora + wys - h;
    const kolor = p.wyjazd ? "var(--slaby)"
                : p.dni > PROG ? "var(--alarm)" : "var(--akcent)";
    s += `<rect x="${x}" y="${y}" width="${szerSlupka}" height="${h}"
           fill="${kolor}" opacity="${p.dni > PROG ? 1 : .55}"
           data-i="${i}" class="slupek" rx="1.5"
           style="animation-delay:${Math.min(i*7,600)}ms"/>`;
    if (p.dni > SUFIT){
      s += `<path d="M${x} ${y} l${szerSlupka/4} -4 l${szerSlupka/4} 4
             l${szerSlupka/4} -4 l${szerSlupka/4} 4"
             fill="none" stroke="var(--tlo)" stroke-width="2.5"/>`;
      s += `<text x="${x+szerSlupka/2}" y="${y-8}" text-anchor="middle"
             font-size="10" font-weight="600" fill="var(--alarm)">${p.dni}</text>`;
    }
  });

  let rokPoprzedni = null;
  przerwy.forEach((p, i) => {
    const rok = p.do.slice(0,4);
    if (rok !== rokPoprzedni){
      const x = 4 + i*(szerSlupka+odstep);
      s += `<line x1="${x}" y1="${marGora+wys}" x2="${x}" y2="${marGora+wys+6}"
             stroke="var(--slaby)" stroke-width="1"/>`;
      s += `<text x="${x+3}" y="${marGora+wys+18}" font-size="10"
             fill="var(--slaby)">${rok}</text>`;
      rokPoprzedni = rok;
    }
  });

  s += `<line x1="0" y1="${marGora+wys}" x2="${szer}" y2="${marGora+wys}"
         stroke="var(--slaby)" stroke-width="1"/></svg>`;

  return `<div class="wykres">${os}<div class="ramka">${s}</div></div>`;
}

/* ==========================================================================
   C1 — GODZINY TYGODNIOWO
   Tygodnie poniedziałek–niedziela. Plan zaczyna się we wtorek 1.09, więc
   wpis planu przypisuję do tygodnia, z którym ma największe pokrycie —
   nie po dacie startu, bo ta wpadłaby w zły tydzień.
   ========================================================================== */

// Cel z planu na koniec października. To linia odniesienia, NIE sufit —
// gdyby sufit był sztywny, tydzień powyżej 6 h zostałby ucięty i wyglądałby
// tak samo jak dokładnie 6 h. Skala rośnie razem z najmocniejszym tygodniem.
// Cel = najwyższy tydzień planu. Czytany z planu, a nie wpisany tutaj: gdyby
// plan się zmienił, linia, legenda i kafelek mają pójść za nim same. Zapasowe
// 6 to koło ratunkowe na wypadek pustego planu, nie drugie źródło prawdy.
const CEL_H = D.plan_objetosci.length
  ? Math.max(...D.plan_objetosci.map(p => p.godziny))
  : 6;

function tydzienPlanu(pn){
  const kon = pn + 6*86400000;
  let naj = null, najDni = 0;
  for (const p of D.plan_objetosci){
    const a = Math.max(pn, naDzien(p.od)), b = Math.min(kon, naDzien(p.do));
    const dni = Math.floor((b-a)/86400000) + 1;
    if (dni > najDni){ najDni = dni; naj = p; }
  }
  return najDni > 0 ? naj : null;
}

const tygodnie = (() => {
  const pierwszy = naDzien(poniedzialek(OD));
  const ostatniPlan = D.plan_objetosci[D.plan_objetosci.length-1].do;
  const ostatni = Math.max(naDzien(poniedzialek(DZIS)), naDzien(poniedzialek(ostatniPlan)));
  const wynik = [];
  for (let ms = pierwszy; ms <= ostatni; ms += 7*86400000){
    const klucz = dzienNaTekst(ms);
    const p = tydzienPlanu(ms);
    wynik.push({
      od: klucz,
      do: dzienNaTekst(ms + 6*86400000),
      godziny: godzinyWTygodniu[klucz] || 0,
      jazd: jazdy.filter(a => poniedzialek(a.data) === klucz).length,
      plan: p ? p.godziny : null,
      odciazenie: p ? p.odciazenie : false,
      przyszly: ms > naDzien(poniedzialek(DZIS))
    });
  }
  return wynik;
})();

const indeksDzis = tygodnie.findIndex(t => t.od === poniedzialek(DZIS));

// Seria liczy się WYŁĄCZNIE po tygodniach, które miały plan i już minęły.
// Tydzień bez planu nie może serii ani przedłużyć, ani zerwać — nie było
// czego dowozić. Tydzień odciążeniowy liczy się normalnie, bo ma własny,
// niższy plan i jego dowiezienie jest tak samo zaplanowane.
const tygodnieZPlanem = tygodnie.filter(t => !t.przyszly && t.plan != null);

const seria = (() => {
  let biezaca = 0;
  for (let i = tygodnieZPlanem.length - 1; i >= 0; i--){
    if (tygodnieZPlanem[i].godziny >= tygodnieZPlanem[i].plan) biezaca++;
    else break;
  }
  let najdluzsza = 0, licznik = 0;
  for (const t of tygodnieZPlanem){
    if (t.godziny >= t.plan){ licznik++; najdluzsza = Math.max(najdluzsza, licznik); }
    else licznik = 0;
  }
  return { biezaca, najdluzsza, ocenionych: tygodnieZPlanem.length };
})();

function wykresGodzin(){
  const szerSlupka = 13, odstep = 3, marGora = 16, wys = 220, marDol = 34,
        szerOsi = 34;
  const szer = tygodnie.length*(szerSlupka+odstep) + 20;

  const najwyzszy = Math.max(CEL_H,
    ...tygodnie.map(t => t.godziny),
    ...tygodnie.map(t => t.plan || 0));
  const gora = Math.ceil(najwyzszy + 0.5);      // zapas, żeby nic nie dotykało krawędzi
  // krok podziałki: najmniejszy z listy, który daje najwyżej 6 przedziałów
  const krok = [1,2,3,5,10,20].find(k => gora/k <= 6) || 50;
  const podzialka = [];
  for (let v = 0; v <= gora; v += krok) podzialka.push(v);
  const skala = h => (h/gora) * wys;
  const wysCalk = wys + marGora + marDol;
  const x = i => 6 + i*(szerSlupka+odstep);

  let os = `<svg class="os" width="${szerOsi}" height="${wysCalk}" aria-hidden="true">`;
  for (const v of podzialka){
    os += `<text x="${szerOsi-6}" y="${marGora+wys-skala(v)+4}" text-anchor="end"
            font-size="10" fill="var(--slaby)">${v}</text>`;
  }
  os += `</svg>`;

  let s = `<svg width="${szer}" height="${wysCalk}"
            role="img" aria-label="Godziny tygodniowo od ${pl(OD)}">`;

  // tygodnie odciążeniowe — pas w tle, żeby niższy słupek nie wyglądał na wpadkę
  tygodnie.forEach((t,i) => {
    if (t.odciazenie){
      s += `<rect x="${x(i)-odstep/2}" y="${marGora}"
             width="${szerSlupka+odstep}" height="${wys}"
             fill="var(--odciazenie)"/>`;
    }
  });

  for (const v of podzialka){
    const y = marGora + wys - skala(v);
    s += `<line x1="0" y1="${y}" x2="${szer}" y2="${y}"
           stroke="var(--linia)" stroke-width="1"/>`;
  }

  // cel 6 h — linia odniesienia, zostaje na miejscu, gdy skala urośnie
  const yCel = marGora + wys - skala(CEL_H);
  s += `<line x1="0" y1="${yCel}" x2="${szer}" y2="${yCel}"
         stroke="var(--plan)" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>`;

  // Słupki. Kolor niesie to samo znaczenie co linia planu: zielony = plan.
  // Tydzień, który sięgnął linii, przejmuje jej kolor — to nie jest nowe
  // znaczenie zieleni, tylko ta sama informacja podana wypełnieniem.
  // Tygodnie bez planu (cała historia przed IX 2026) zostają niebieskie:
  // nie da się dowieźć planu, którego nie było.
  tygodnie.forEach((t,i) => {
    if (t.przyszly || t.godziny === 0) return;
    const h = Math.max(skala(t.godziny), 1.5);
    const dowieziony = t.plan != null && t.godziny >= t.plan;
    s += `<rect x="${x(i)}" y="${marGora+wys-h}" width="${szerSlupka}" height="${h}"
           fill="${dowieziony ? "var(--plan)" : "var(--akcent)"}"
           opacity="${dowieziony ? .85 : .75}" rx="1.5"
           class="tydzien" data-i="${i}"
           style="animation-delay:${Math.min(i*7,600)}ms"/>`;
  });

  // Linia planu — schodkowa, bo plan jest stały w obrębie tygodnia.
  // Rysowana PO słupkach i podbita otoczką w kolorze karty, żeby nie zlała
  // się z zielonym słupkiem, który jej dotyka.
  let d = "";
  tygodnie.forEach((t,i) => {
    if (t.plan == null) return;
    const y = marGora + wys - skala(t.plan);
    d += `${d ? "L" : "M"}${x(i)-odstep/2} ${y} L${x(i)+szerSlupka+odstep/2} ${y} `;
  });
  if (d){
    s += `<path d="${d}" fill="none" stroke="var(--powierzchnia)" stroke-width="4.5"
           stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--plan)" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  // pionowa kreska "dziś"
  if (indeksDzis >= 0){
    const xd = x(indeksDzis) + szerSlupka + odstep/2;
    s += `<line x1="${xd}" y1="${marGora}" x2="${xd}" y2="${marGora+wys}"
           stroke="var(--slaby)" stroke-width="1" stroke-dasharray="3 3"/>`;
    s += `<text x="${xd-3}" y="${marGora+10}" text-anchor="end" font-size="10"
           fill="var(--slaby)">dziś</text>`;
  }

  // Podpisy miesięcy. Słupek ma 16 px razem z odstępem, a data „25.08" zajmuje
  // 27 px — więc dwa podpisy w sąsiednich tygodniach wchodzą na siebie. Zdarza
  // się to na początku osi: zakres liczony jest od 31.08.2025, czyli pierwszy
  // tydzień to końcówka sierpnia, a zaraz po nim zaczyna się wrzesień.
  // Filtrujemy OD KOŃCA, więc przy ciasnocie zostaje podpis nowszy — czyli
  // prawdziwy początek miesiąca, a nie ogryzek tygodnia sprzed zakresu.
  const MIN_ODSTEP = 34;
  const podpisy = [];
  let mPop = null;
  tygodnie.forEach((t,i) => {
    const m = t.od.slice(0,7);
    if (m !== mPop){ podpisy.push({ x: x(i), tekst: `${t.od.slice(8,10)}.${t.od.slice(5,7)}` }); mPop = m; }
  });
  let xPop = Infinity;
  for (let i = podpisy.length - 1; i >= 0; i--){
    if (xPop - podpisy[i].x < MIN_ODSTEP) continue;
    xPop = podpisy[i].x;
    s += `<text x="${podpisy[i].x}" y="${marGora+wys+16}" font-size="9.5"
           fill="var(--slaby)">${podpisy[i].tekst}</text>`;
  }

  s += `<line x1="0" y1="${marGora+wys}" x2="${szer}" y2="${marGora+wys}"
         stroke="var(--slaby)" stroke-width="1"/></svg>`;

  // otwórz tak, żeby "dziś" był w prawej części kadru, a plan widoczny dalej
  const doScrolla = Math.max(0, x(indeksDzis) - 260);
  return `<div class="wykres">${os}<div class="ramka" data-scroll="${doScrolla}">${s}</div></div>`;
}

const c1Godziny = () => {
  const zJazda = tygodnie.filter(t => !t.przyszly && t.godziny > 0).length;
  const minione = tygodnie.filter(t => !t.przyszly).length;
  const suma = tygodnie.reduce((a,t) => a + t.godziny, 0);
  return `
  <section>
    <h2>C1 · Godziny tygodniowo</h2>
    <p class="opis">
      Jeden słupek = jeden tydzień, poniedziałek–niedziela, czas w ruchu.
      Zielona linia to plan objętości na wrzesień i październik.
      Szare pasy to tygodnie odciążeniowe — tam niższy słupek jest
      zgodny z planem, nie wpadką. Przerywana pozioma linia to cel ${liczba(CEL_H,1)} h; skala rośnie sama, gdyby jakiś tydzień go przekroczył.
    </p>
    ${wykresGodzin()}
    <div class="legenda">
      <span><i style="background:var(--plan)"></i>plan dowieziony</span>
      <span><i style="background:var(--akcent)"></i>poniżej planu lub bez planu</span>
      <span style="color:var(--plan)"><i class="kreska"></i><span
        style="color:var(--slaby)">linia planu i cel ${liczba(CEL_H,1)} h</span></span>
      <span><i style="background:var(--odciazenie)"></i>tydzień odciążeniowy</span>
    </div>
    <div class="info" id="info-tydzien">Dotknij słupka, żeby zobaczyć szczegóły.</div>
  </section>

  <section>
    <div class="kafelki">
      <div class="kafel">
        <div class="etykieta">Tygodnie z jazdą</div>
        <div class="liczba">${zJazda}</div>
        <div class="stopka">z ${minione} minionych</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Średnia tygodniowa</div>
        <div class="liczba">${liczba(suma/minione,1)}</div>
        <div class="stopka">godzin · licząc puste tygodnie</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Najmocniejszy tydzień</div>
        <div class="liczba">${liczba(Math.max(...tygodnie.map(t=>t.godziny)),1)}</div>
        <div class="stopka">godzin</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Cel na koniec X</div>
        <div class="liczba">${liczba(CEL_H,1)}</div>
        <div class="stopka">godzin tygodniowo</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Seria z dowiezionym planem</div>
        <div class="liczba" style="${seria.biezaca ? "color:var(--plan)" : ""}">${
          seria.ocenionych ? seria.biezaca : "—"}</div>
        <div class="stopka">${seria.ocenionych
          ? `tygodni z rzędu · rekord ${seria.najdluzsza} z ${seria.ocenionych}`
          : "plan rusza 1.09 — nie ma czego liczyć"}</div>
      </div>

};

/* ==========================================================================
   DYSCYPLINA — kształt, nie kolor
   Podział jest dwuwartościowy: szosa (Ride) i Zwift (VirtualRide). Gravel
   to nawierzchnia, nie dyscyplina — jeździ się po nim tym samym rowerem,
   więc liczy się jako szosa. Rozróżnienie niesie SYLWETKA, nie barwa:
   dokładanie dwóch kolorów tylko po to zabrałoby im znaczenie.
   ========================================================================== */

const DYSCYPLINY = {
  Ride: { nazwa:"szosa", rysunek:
    `<circle cx="5" cy="12" r="3.1"/><circle cx="15" cy="12" r="3.1"/>
     <path d="M5 12h4.5M9.5 12 7.2 6.5M5.8 6.5h3.3M7.2 6.5l5.6.4M9.5 12l3.3-5.6
              M12.8 6.9 15 12M12.8 6.9l.7-1.5M12.2 5.4h2.8"/>` },
  VirtualRide: { nazwa:"Zwift", rysunek:
    `<rect x="2.5" y="3" width="15" height="10" rx="1.6"/>
     <path d="M5.5 10.2 8 7l2.2 2.4L14.5 5.6"/>
     <path d="M10 13v3M6.5 16.5h7"/>` }
};

// Strava trzyma jazdę pod adresem zbudowanym z jej identyfikatora. Ten
// identyfikator już jest w dane.js, więc odnośnik nie wymaga nowego pola.
function adresStravy(a){ return "https://www.strava.com/activities/" + a.id; }

/* ==========================================================================
   ERG — trening ze sterowaną mocą

   Strava nie ma pola „to był ERG". Rozpoznajemy go z dwóch niezależnych
   tropów, bo żaden sam nie wystarcza:

   Rozstrzyga LICZBA, nie nazwa: rekord 5-sekundowy podzielony przez rekord
   15-minutowy tej samej jazdy. ERG trzyma zadaną moc, więc pięć sekund ledwie
   odstaje od kwadransa. Zmierzone na komplecie 17 jazd:

     Foundation / Tempo / Recovery / Intermittent   1,04 - 1,48   -> sterowane
     wyścig                                          2,90         -> wolna moc
     sesje Strength ze sprintami                     5,79 - 6,50  -> wolna moc

   Między grupami leży pusty pas od 1,48 do 2,90, więc próg 2,0 stoi w jego
   środku i ma zapas w obie strony. Mianownikiem jest 15 min, bo to okno
   Zwift oddaje najczystszym pomiarem (decyzja Fryderyka z 21.08.2026).

   Gdy jazda nie ma okna 15-minutowego, bierzemy najdłuższe dostępne, ale
   tylko powyżej 5 minut — na krótszym odcinku ten iloraz nic nie znaczy
   i wtedy jazdy po prostu nie klasyfikujemy. Nazwa treningu Zwifta służy
   jako zapasowy trop, gdy krzywej nie ma w ogóle.

   Dlaczego nie po nazwie: sesja „Strength" chodzi w ERG, ale sprint w środku
   jest prawdziwy, bo ERG puszcza przy maksymalnym wysiłku. Znacznik po nazwie
   podważałby rekord 702 W, który jest jak najbardziej Fryderyka. Liczba widzi
   to, czego nazwa nie widzi.
   ========================================================================== */

const NAZWY_PLANOW = /^Zwift\s*-\s*(Foundation|Tempo|Strength|Intermittent|Active Recovery|Recovery|Endurance|Threshold|Sweet ?Spot|VO2|Build|Base|Interval)/i;

const OKNO_ODNIESIENIA = 900;      // 15 min
const MIN_ODNIESIENIE = 300;       // poniżej 5 min iloraz nic nie znaczy
const PROG_ERG = 2.0;              // środek pustego pasa 1,48 - 2,90

const PLASKOSC = new Map((D.moc_krzywe || []).map(k => {
  const okna = Object.keys(k.w).map(Number).sort((a,b) => a-b);
  const krotkie = k.w[5] != null ? k.w[5] : k.w[okna[0]];
  const najdluzsze = okna[okna.length-1];
  const dlugie = k.w[OKNO_ODNIESIENIA] != null ? k.w[OKNO_ODNIESIENIA]
    : (najdluzsze >= MIN_ODNIESIENIE ? k.w[najdluzsze] : null);
  return [k.a, dlugie ? krotkie/dlugie : null];
}));

function jestErg(jazda){
  if (!jazda || jazda.typ !== "VirtualRide") return false;
  const p = PLASKOSC.get(jazda.id);
  if (p != null) return p < PROG_ERG;   // profil tak równy, że musiał być trzymany
  return NAZWY_PLANOW.test(jazda.nazwa || "");   // brak krzywej — zostaje nazwa
}

function znacznikErg(jazda, tytul){
  if (!jestErg(jazda)) return "";
  const p = PLASKOSC.get(jazda.id);
  return `<span class="znacznik-erg" title="${tytul || "Trening ze sterowaną mocą"
    } — w trybie ERG trenażer trzyma zadaną moc, więc liczba mówi, co kazał program${
    p != null ? `. Iloraz 5 s / 15 min: ${liczba(p,2)}` : ""}">ERG</span>`;
}

function ikonaDyscypliny(typ, rozmiar){
  const d = DYSCYPLINY[typ];
  if (!d) return "";
  const r = rozmiar || 16;
  // Poniżej ~24 px kreska 1,5 zlepia szprychy i ramę w plamę — im mniejsza
  // ikona, tym cieńsza linia, żeby sylwetka została czytelna.
  const kreska = r < 22 ? 1.15 : r < 32 ? 1.35 : 1.5;
  return `<svg class="dysc" width="${r}" height="${r}" viewBox="0 0 20 20"
    role="img" aria-label="${d.nazwa}"><title>${d.nazwa}</title>
    <g fill="none" stroke="currentColor" stroke-width="${kreska}"
       stroke-linecap="round" stroke-linejoin="round">${d.rysunek}</g></svg>`;
}

/* ==========================================================================
   C3 — NAJDŁUŻSZA JAZDA W MIESIĄCU
   Oś miesięcy jest CIĄGŁA: miesiąc bez jednej jazdy zostaje pusty, a nie
   znika. Zima 2025/26 ma trzy takie z rzędu i to jest informacja, nie luka.
   Zwift wchodzi do wykresu, ale jest kreskowany i podpisany sylwetką —
   41 km na trenażerze nie znaczy tego samego co 41 km na szosie.
   ========================================================================== */

// Cel długiej jazdy to decyzja, nie pomiar — mieszka w dane.js obok planu
// i kryterium. Liczba wpisana tutaj byłaby drugim źródłem prawdy, a przy
// czterech miejscach użycia to gwarancja, że kiedyś się rozjadą.
const CEL_KM = (D.cele && D.cele.dluga_jazda_km && D.cele.dluga_jazda_km.v) || 80;

const MIESIACE_RZYM = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

const miesiace = (() => {
  const pierwszy = OD.slice(0,7), ostatni = DZIS.slice(0,7);
  const wynik = [];
  let [r,m] = pierwszy.split("-").map(Number);
  while (`${r}-${String(m).padStart(2,"0")}` <= ostatni){
    const klucz = `${r}-${String(m).padStart(2,"0")}`;
    const wMiesiacu = jazdy.filter(a => a.data.slice(0,7) === klucz);
    const naj = wMiesiacu.length
      ? wMiesiacu.reduce((a,b) => b.dystans_m > a.dystans_m ? b : a)
      : null;
    wynik.push({ klucz, rok:r, miesiac:m, jazd:wMiesiacu.length, naj,
                 km: naj ? naj.dystans_m/1000 : 0 });
    m++; if (m > 12){ m = 1; r++; }
  }
  return wynik;
})();

const rekordKm = Math.max(...miesiace.map(x => x.km));
const rekordMies = miesiace.find(x => x.km === rekordKm);

function wykresDlugich(){
  const szerSlupka = 30, odstep = 8, marGora = 26, wys = 230, marDol = 40,
        szerOsi = 34;
  const szer = miesiace.length*(szerSlupka+odstep) + 24;
  const gora = Math.ceil(Math.max(CEL_KM, rekordKm) * 1.08 / 10) * 10;
  const krok = [10,20,25,50].find(k => gora/k <= 6) || 100;
  const podzialka = []; for (let v = 0; v <= gora; v += krok) podzialka.push(v);
  const skala = km => (km/gora) * wys;
  const wysCalk = wys + marGora + marDol;
  const x = i => 10 + i*(szerSlupka+odstep);

  let os = `<svg class="os" width="${szerOsi}" height="${wysCalk}" aria-hidden="true">`;
  for (const v of podzialka){
    os += `<text x="${szerOsi-6}" y="${marGora+wys-skala(v)+4}" text-anchor="end"
            font-size="10" fill="var(--slaby)">${v}</text>`;
  }
  os += `</svg>`;

  let s = `<svg width="${szer}" height="${wysCalk}"
            role="img" aria-label="Najdłuższa jazda w miesiącu">
    <defs>
      <pattern id="krata" width="7" height="7" patternUnits="userSpaceOnUse"
               patternTransform="rotate(45)">
        <rect width="7" height="7" fill="var(--akcent)" opacity=".22"/>
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--akcent)" stroke-width="3.4"/>
      </pattern>
    </defs>`;

  for (const v of podzialka){
    const y = marGora + wys - skala(v);
    s += `<line x1="0" y1="${y}" x2="${szer}" y2="${y}"
           stroke="var(--linia)" stroke-width="1"/>`;
  }

  // słupki
  miesiace.forEach((mm,i) => {
    if (!mm.naj) return;
    const h = Math.max(skala(mm.km), 2);
    const y = marGora + wys - h;
    const zwift = mm.naj.typ === "VirtualRide";
    const osiagniety = mm.km >= CEL_KM;
    s += `<rect x="${x(i)}" y="${y}" width="${szerSlupka}" height="${h}"
           fill="${zwift ? "url(#krata)" : osiagniety ? "var(--plan)" : "var(--akcent)"}"
           opacity="${zwift ? 1 : osiagniety ? .85 : .75}" rx="2"
           class="miesiac" data-i="${i}"
           style="animation-delay:${Math.min(i*40,600)}ms"/>`;
    s += `<text x="${x(i)+szerSlupka/2}" y="${y-7}" text-anchor="middle"
           font-size="10.5" font-weight="600"
           fill="${osiagniety ? "var(--plan)" : "var(--slaby)"}">${liczba(mm.km,1)}</text>`;
  });

  // linia rekordu — pod celem, słabsza
  const yRek = marGora + wys - skala(rekordKm);
  s += `<line x1="0" y1="${yRek}" x2="${szer}" y2="${yRek}"
         stroke="var(--slaby)" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>`;

  // linia celu — z otoczką, żeby nie zlała się ze słupkiem
  const yCel = marGora + wys - skala(CEL_KM);
  s += `<line x1="0" y1="${yCel}" x2="${szer}" y2="${yCel}"
         stroke="var(--powierzchnia)" stroke-width="4.5"/>`;
  s += `<line x1="0" y1="${yCel}" x2="${szer}" y2="${yCel}"
         stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 4"/>`;

  // podpisy miesięcy i lat
  let rokPop = null;
  miesiace.forEach((mm,i) => {
    s += `<text x="${x(i)+szerSlupka/2}" y="${marGora+wys+16}" text-anchor="middle"
           font-size="10" fill="var(--slaby)">${MIESIACE_RZYM[mm.miesiac-1]}</text>`;
    if (mm.rok !== rokPop){
      s += `<text x="${x(i)+szerSlupka/2}" y="${marGora+wys+31}" text-anchor="middle"
             font-size="10" font-weight="600" fill="var(--slaby)">${mm.rok}</text>`;
      rokPop = mm.rok;
    }
  });

  s += `<line x1="0" y1="${marGora+wys}" x2="${szer}" y2="${marGora+wys}"
         stroke="var(--slaby)" stroke-width="1"/></svg>`;
  return `<div class="wykres">${os}<div class="ramka">${s}</div></div>`;
}

    <div class="info" id="info-miesiac">Dotknij słupka, żeby zobaczyć szczegóły jazdy.</div>

        <div class="etykieta">Rekord</div>

        <div class="stopka">${ikonaDyscypliny(rekordMies.naj.typ,13)}
          km · ${pl(rekordMies.naj.data)}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Cel</div>

        <div class="stopka">km · niedzielna długa</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Brakuje do celu</div>
        <div class="liczba">${liczba(brakuje,1)}</div>
        <div class="stopka">km · ${liczba(100*rekordKm/CEL_KM,0)}% celu</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Miesiące z jazdą</div>
        <div class="liczba">${zJazda}</div>
        <div class="stopka">z ${miesiace.length} w zakresie</div>
      </div>
    </div>
  </section>`;
};

/* ==========================================================================
   SEGMENTY — tabela z sortowaniem

   Dane: dwie tablice w dane.js. "segmenty" to metadane (nazwa, długość,
   nachylenie ze Stravy), "proby" to pojedyncze przejazdy (czas). Wszystko
   pozostałe — najlepszy czas, liczba prób, moc — liczy się tutaj, przy
   wyświetlaniu, zgodnie z wariantem B.
   ========================================================================== */

// Nazwy segmentów pisali inni ludzie i bywa w nich wszystko: strzałki "->",
// ampersandy, emoji. Wstawienie takiego tekstu prosto do HTML-a potrafi
// rozsypać stronę, więc każdy znak specjalny zamieniamy na jego zapis.
function bezpieczny(t){
  return String(t).replace(/[&<>"]/g, z =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[z]);
}

function czasNaTekst(sek){
  const h = Math.floor(sek/3600), m = Math.floor(sek%3600/60), s2 = sek%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s2).padStart(2,"0")}`
           : `${m}:${String(s2).padStart(2,"0")}`;
}
function dlugoscNaTekst(m){
  return m < 1000 ? `${Math.round(m)} m` : `${liczba(m/1000,2)} km`;
}
function procentNaTekst(x){
  return (x < 0 ? "\u2212" : "") + liczba(Math.abs(x),1) + "%";
}

/* Moc pokazujemy WYŁĄCZNIE zmierzoną — nigdy policzoną z modelu.

   Do 20.08.2026 stała tu estymata [E] z fizyki: P = ½ρ·CdA·v³ + Crr·m·g·v +
   m·g·(Δh/t). Liczba wyglądała solidnie i była nieweryfikowalna: siedzi w niej
   CdA 0,38 z tagiem [?], a liczona ze średniej prędkości zaniża na zrywach
   (kontrola na Bump 2: 471 W wobec 493 W z pełnego wyliczenia). Decyzja
   Fryderyka: dopóki nie ma czym tego sprawdzić, kolumna ma być pusta.

   Zostaje więc tylko moc, która naprawdę została zmierzona. Dziś jest to
   wyłącznie Zwift — trenażer podaje waty do pliku, więc segmenty z X-XI 2025
   mają je naprawdę. Na szosie Strava nie oddaje mocy segmentu przez API
   (sprawdzone: 0 z 1385 przejazdów), bo na rowerze nie ma miernika.

   Ta zasada zadziała sama, gdy miernik się pojawi: liczba wjedzie do kolumny
   w dniu, w którym Strava zacznie ją przysyłać. Nic tu nie trzeba zmieniać. */

const SEGMENTY = (() => {
  const meta = new Map((D.segmenty || []).map(x => [x.id, x]));
  const jazdaPo = new Map(D.aktywnosci.map(a => [a.id, a]));
  const grupy = new Map();
  for (const p of (D.proby || [])){
    if (!grupy.has(p.s)) grupy.set(p.s, []);
    grupy.get(p.s).push(p);
  }
  const wynik = [];
  for (const [id, proby] of grupy){
    const m = meta.get(id);
    if (!m) continue;                       // metadane bez prób i odwrotnie — pomijamy
    const naj = proby.reduce((a,b) => b.czas_s < a.czas_s ? b : a);
    const jazda = jazdaPo.get(naj.a);
    wynik.push({
      id, nazwa: m.nazwa,
      dystans: m.dystans_m,
      nachylenie: m.nachylenie_proc,
      czas: naj.czas_s,
      // Prędkość liczy się tutaj, a nie w danych — wariant B. Dwie liczby,
      // które już są (długość i czas), nie potrzebują trzeciej w pliku.
      predkosc: naj.czas_s ? (m.dystans_m / naj.czas_s) * 3.6 : null,
      // Tylko pomiar. Brak liczby to uczciwa odpowiedź, nie brak funkcji.
      moc: naj.moc_S,
      mocZMiernika: naj.z_miernika === 1,
      // Zwift czy szosa — bierzemy z jazdy, w której padł najlepszy czas,
      // bo to jej dotyczą wszystkie liczby w wierszu.
      zwift: jazda ? jazda.typ === "VirtualRide" : false,
      // Jazda, z której pochodzą wszystkie liczby w wierszu — potrzebna,
      // żeby powiedzieć, czy ten najlepszy czas padł przy sterowanej mocy.
      jazdaNaj: jazda || null,
      prob: proby.length,
      data: jazda ? jazda.data.slice(0,10) : null
    });
  }
  return wynik;
})();

const IKONY_KOLUMN = {
  az:    `<span style="font-size:10.5px;letter-spacing:.02em">A→Z</span>`,
  czas:  `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><circle cx="8" cy="9" r="5.6"/><path d="M8 5.8V9l2.2 1.6M6 1.6h4"/></svg>`,
  dlugosc: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M1.5 6.5h13v3h-13zM4.5 6.5v1.6M7.5 6.5v2.4M10.5 6.5v1.6"/></svg>`,
  nachylenie: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M1.5 13.5h13L1.5 4.2z"/></svg>`,
  moc:   `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path
            d="M9.2 1.2 3.4 9h3.4l-.9 5.8L12.6 7H9.1z"/></svg>`,
  predkosc: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"><path d="M2.2 12.4a6.4 6.4 0 1 1 11.6 0"/>
            <path d="M8 11 11 6.4"/></svg>`,
  proby: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5"><path d="M2 12.5c0-2 1.4-3.4 3-3.4s3 1.4 3 3.4M8 12.5c0-2 1.4-3.4 3-3.4
            s3 1.4 3 3.4"/><circle cx="5" cy="4.6" r="2.1"/><circle cx="11" cy="4.6" r="2.1"/></svg>`
};

// Kierunek PIERWSZEGO kliknięcia. Nazwa od A, czas od najkrótszego, reszta od
// największej wartości — bo tak zwykle chce się patrzeć. Drugie kliknięcie
// odwraca, trzecie znowu i tak w kółko.
const KOLUMNY = [
  { k:"nazwa",      etykieta:"Segment",   ikona:IKONY_KOLUMN.az,    tekst:true, malejaco:false },
  { k:"czas",       etykieta:"Najlepszy", ikona:IKONY_KOLUMN.czas,               malejaco:false },
  { k:"predkosc",   etykieta:"Prędkość",  ikona:IKONY_KOLUMN.predkosc,           malejaco:true  },
  { k:"dystans",    etykieta:"Długość",   ikona:IKONY_KOLUMN.dlugosc,            malejaco:true  },
  { k:"nachylenie", etykieta:"Nachylenie",ikona:IKONY_KOLUMN.nachylenie,         malejaco:true  },
  { k:"moc",        etykieta:"Moc",       ikona:IKONY_KOLUMN.moc,                malejaco:true  },
  { k:"prob",       etykieta:"Próby",     ikona:IKONY_KOLUMN.proby,              malejaco:true  }
];

// Wartości domyślne trzymane osobno, bo krzyżyk musi umieć do nich wrócić.
// Gdyby siedziały tylko w tych zmiennych, reset kopiowałby je po raz drugi
// i któraś kopia kiedyś by się rozjechała.
const DOMYSLNIE = { klucz:"prob", malejaco:true, filtr:"wszystkie", szukaj:"" };

// Filtry wykluczają się wzajemnie — dlatego jedna wartość, a nie cztery
// niezależne przełączniki. "Z pomiarem mocy" i "bez pomiaru" to dziś podział
// na Zwift i szosę, ale reguła jest napisana na pomiarze, nie na dyscyplinie:
// w dniu, w którym na rowerze pojawi się miernik, filtr sam zacznie znaczyć
// to, co powinien, bez ruszania kodu.
const FILTRY = [
  { id:"wszystkie",   etykieta:"Wszystkie",             pasuje: () => true },
  { id:"wielokrotne", etykieta:"Przejechane więcej niż raz", pasuje: x => x.prob > 1 },
  { id:"zmoca",       etykieta:"Z pomiarem mocy",       pasuje: x => x.moc != null },
  { id:"bezmocy",     etykieta:"Bez pomiaru mocy",      pasuje: x => x.moc == null }
];

let sortKlucz = DOMYSLNIE.klucz, sortMalejaco = DOMYSLNIE.malejaco,
    filtr = DOMYSLNIE.filtr, szukaj = DOMYSLNIE.szukaj;

// Szukanie ma nie zależeć od wielkości liter ani od ogonków: wpisane "petla"
// musi znaleźć "Pętla". NFD rozkłada literę na znak i ogonek, który potem
// wycinamy; ł nie ma takiego rozkładu, więc idzie osobno.
function bezOgonkow(t){
  const x = String(t).toLowerCase().replace(/ł/g, "l");
  try { return x.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  catch(e){ return x; }
}

function posortowane(){
  const kol = KOLUMNY.find(x => x.k === sortKlucz);
  const fraza = bezOgonkow(szukaj.trim());
  const przepuszcza = (FILTRY.find(f => f.id === filtr) || FILTRY[0]).pasuje;
  const lista = SEGMENTY.filter(x =>
    przepuszcza(x) && (!fraza || bezOgonkow(x.nazwa).includes(fraza)));
  return lista.sort((a,b) => {
    const x = a[sortKlucz], y = b[sortKlucz];
    if (x == null && y == null) return 0;
    if (x == null) return 1;                 // puste zawsze na końcu, w obie strony
    if (y == null) return -1;
    const r = kol.tekst ? String(x).localeCompare(String(y), "pl") : x - y;
    return sortMalejaco ? -r : r;
  });
}

function wierszeSegmentow(){
  const lista = posortowane();
  if (!lista.length) return `
    <tr><td colspan="7" class="pusty-wynik">Żaden segment nie ma
      „${bezpieczny(szukaj.trim())}" w nazwie.</td></tr>`;
  return lista.map(x => `
    <tr>
      <td class="${sortKlucz==="nazwa"?"akt":""}">
        <a class="seg-nazwa" href="#postepy/porownania/${x.id}"
           title="Pokaż wszystkie próby na tym segmencie">${x.zwift
          ? `<span class="seg-zwift" title="Zwift — trenażer, nie szosa">${
              ikonaDyscypliny("VirtualRide",14)}</span>` : ""}${bezpieczny(x.nazwa)}${
          znacznikErg(x.jazdaNaj, "Najlepszy czas padł na treningu ze sterowaną mocą")}<span
          class="strzalka-wew" aria-hidden="true">›</span></a>
        <span class="seg-data">${x.zwift ? "Zwift · " : ""}${
          x.data ? "najlepsza próba " + pl(x.data) : ""}</span>
      </td>
      <td class="${sortKlucz==="czas"?"akt":""}">${czasNaTekst(x.czas)}</td>
      <td class="${sortKlucz==="predkosc"?"akt":""}">${
        x.predkosc == null ? "—" : liczba(x.predkosc,1) + " km/h"}</td>
      <td class="${sortKlucz==="dystans"?"akt":""}">${dlugoscNaTekst(x.dystans)}</td>
      <td class="${sortKlucz==="nachylenie"?"akt":""}">${
        x.nachylenie == null ? "—" : procentNaTekst(x.nachylenie)}</td>
      <td class="${sortKlucz==="moc"?"akt":""}"${
        x.moc == null ? ' title="Brak pomiaru mocy — nie zgadujemy"' : ""
      }>${x.moc == null ? "—" : Math.round(x.moc) + " W"}</td>
      <td class="${sortKlucz==="prob"?"akt":""}">${x.prob}</td>
    </tr>`).join("");
}

// Ile z ilu — bez tego przy włączonym szukaniu nie widać, czy lista jest
// krótka, bo taka jest, czy dlatego, że coś zostało odfiltrowane.
function podsumowanieSegmentow(){
  const widac = posortowane().length;
  const czynne = szukaj.trim() || filtr !== DOMYSLNIE.filtr;
  return czynne
    ? `Widać <b>${widac}</b> z ${SEGMENTY.length} segmentów.`
      + (szukaj.trim() ? ` Szukane: „${bezpieczny(szukaj.trim())}".` : "")
      + ` Krzyżyk czyści szukanie, filtr i sortowanie.`
    : `Wszystkie ${SEGMENTY.length} segmentów. Sortowanie: `
      + `${KOLUMNY.find(k => k.k === sortKlucz).etykieta.toLowerCase()}, `
      + `${sortMalejaco ? "malejąco" : "rosnąco"}.`;
}

function naglowkiSegmentow(){
  return KOLUMNY.map(kol => `
    <th class="${sortKlucz===kol.k?"akt":""}">
      <button type="button" data-k="${kol.k}"
        title="Sortuj po: ${kol.etykieta}">${kol.ikona}<span>${kol.etykieta}</span>${
        sortKlucz===kol.k ? `<span class="strzalka-sort">${sortMalejaco?"▼":"▲"}</span>` : ""
      }</button>
    </th>`).join("");
}

const tabelaSegmentow = () => {
  const wielokrotne = SEGMENTY.filter(x => x.prob > 1).length;
  const ZWIFTOWYCH = SEGMENTY.filter(x => x.moc != null).length;
  const najwiecej = SEGMENTY.reduce((a,b) => b.prob > a.prob ? b : a, {prob:0});
  return `
  <section>
    <h2>Segmenty</h2>
    <p class="opis">
      Każdy segment, który przejechałeś od ${pl(D.meta.segmenty_od)} —
      ${SEGMENTY.length} sztuk, ${(D.proby||[]).length} przejazdów.
      Wszystkie liczby pochodzą z <b>najlepszej próby</b>. Dotknij nagłówka,
      żeby posortować; dotknij drugi raz, żeby odwrócić kolejność.
      Sylwetka ekranu oznacza segment ze Zwiftu — tak samo jak słupek
      kreskowany na wykresie długich jazd.
    </p>
    <p class="opis">
      <b>Moc pokazujemy tylko tam, gdzie została zmierzona.</b> Dziś to
      wyłącznie Zwift (${ZWIFTOWYCH} ${ZWIFTOWYCH === 1 ? "segment" :
      ZWIFTOWYCH < 5 ? "segmenty" : "segmentów"}): trenażer zapisuje waty do
      pliku. Na szosie Strava nie oddaje mocy segmentu przez API, bo na rowerze
      nie ma miernika — dlatego stoi tam kreska, a nie liczba. Wcześniej była
      w tym miejscu estymata z modelu fizycznego; wyleciała, bo nie ma dziś
      czym jej sprawdzić, a liczba, której nie da się zweryfikować, wygląda
      dokładnie jak pomiar. Kolumna wypełni się sama w dniu, w którym pojawi
      się miernik mocy.
      <br>Najlepszy czas nie odróżnia jazdy solo od jazdy w grupie ani wiatru
      — rekord z koła kolegi wygląda tu tak samo jak samotny.
    </p>
    <div class="przelaczniki">
      <div class="grupa-filtry">
        ${FILTRY.map(f => `<button type="button" data-filtr="${f.id}"
          class="${filtr === f.id ? "akt" : ""}">${f.etykieta} (${
          SEGMENTY.filter(f.pasuje).length})</button>`).join("")}
      </div>
      <div class="grupa-szukaj">
        <label class="szukajka">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>
          <input id="szukaj-segmentu" type="search" enterkeyhint="search"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Szukaj w nazwie" aria-label="Szukaj w nazwie segmentu"
            value="${bezpieczny(szukaj)}">
        </label>
        <button type="button" id="reset-segmentow"
          title="Wyczyść szukanie, filtr i sortowanie"
          aria-label="Wyczyść szukanie, filtr i sortowanie">&times;</button>
      </div>
    </div>
    <div class="tabelka">
      <table class="segmenty">
        <thead><tr id="naglowki-segmentow">${naglowkiSegmentow()}</tr></thead>
        <tbody id="wiersze-segmentow">${wierszeSegmentow()}</tbody>
      </table>
    </div>
    <div class="info" id="info-segmentow">${podsumowanieSegmentow()}</div>
  </section>

  <section>
    <div class="kafelki">
      <div class="kafel">
        <div class="etykieta">Segmentów</div>
        <div class="liczba">${SEGMENTY.length}</div>
        <div class="stopka">${wielokrotne} więcej niż raz</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Przejazdów</div>
        <div class="liczba">${(D.proby||[]).length}</div>
        <div class="stopka">z ${(D.segmenty_pobrane||[]).length} jazd</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Najczęstszy segment</div>
        <div class="liczba">${najwiecej.prob}</div>
        <div class="stopka">${najwiecej.nazwa ? bezpieczny(najwiecej.nazwa) : "—"}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Najdłuższy</div>
        <div class="liczba">${liczba(Math.max(...SEGMENTY.map(x=>x.dystans))/1000,1)}</div>
        <div class="stopka">km</div>
      </div>
    </div>
  </section>`;
};

function podepnijTabele(){
  const naglowki = document.getElementById("naglowki-segmentow");
  if (!naglowki) return;
