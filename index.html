      Strona nie umie pisać do repozytorium — klucz do zapisu leżałby w publicznym
      repo, czyli u wszystkich. Trwałe miejsce to <code>dane.js</code>
      (<code>prognozy.ftp_biezace</code> i <code>prognozy.wyniki</code>); przycisk
      obok wypisuje zaznaczenia w formie do wklejenia Claude'owi.
      ${ftpZRepo() != null && D.zalozenia && D.zalozenia.FTP_W
        ? `<br>Uwaga na dwie różne liczby: w bloku <code>zalozenia</code> stoi
           FTP ${D.zalozenia.FTP_W.v} W z tagiem <b>[E]</b> — estymata z modelu,
           przedział ${D.zalozenia.FTP_W.przedzial
             ? D.zalozenia.FTP_W.przedzial.join("–") : "?"} W. Tutaj stoi
           ${ftpZRepo()} W, bo to Twoja deklaracja. Zmierzone dwadzieścia minut
           to ${rekordOkna(1200) ? rekordOkna(1200).waty + " W" : "—"}
           ${rekordOkna(1200) ? `(0,95 × to daje ${liczba(rekordOkna(1200).waty*0.95,0)} W)` : ""},
           więc bliżej prawdy jest liczba niższa.`
        : ""}
    </div>
  </section>`;
}

/* Nasłuch podpinamy RAZ na całe życie strony, nie przy każdym przerysowaniu.
   Wcześniej pokaz() dokładał go za każdym wejściem w zakładkę, więc po drugiej
   wizycie jedno kliknięcie ptaszka wykonywało się dwa razy: pierwszy raz
   stawiało znak, drugi — widząc już postawiony — zdejmowało go z powrotem.
   Stąd wymóg: uchwyt czyta, KTÓRY okres jest na ekranie, w chwili kliknięcia,
   zamiast pamiętać go z chwili rysowania. */
function podepnijPrognozy(){
  const karta = document.getElementById("tresc");
  if (!karta || karta.dataset.prognozyPodpiete) return;
  karta.dataset.prognozyPodpiete = "1";

  const okresZEkranu = () => {
    const korzen = document.getElementById("prognoza");
    return korzen ? okresPrognozy(korzen.dataset.okres) : null;
  };

  const stan = (t) => {
    const e = document.getElementById("prognoza-stan");
    if (e) e.innerHTML = t;
  };
  const brudnopisFtp = () => prognozyLokalne().ftp != null;

  function ustawZnak(idOkresu, pole, znak){
    const l = prognozyLokalne(), k = idOkresu + "/" + pole;
    if (znak === znakZRepo(idOkresu, pole)) delete l.znaki[k];
    else l.znaki[k] = znak;                 // także null — zdjęcie znaku z danych
    if (!zapiszPrognozyLokalne(l))
      stan(`<span class="stan-niezapisane">nie udało się zapisać w przeglądarce</span>`);
    else stan(znak
      ? `<span class="stan-brudnopis">zaznaczone na tym urządzeniu — nie ma tego jeszcze w danych</span>`
      : `<span class="stan-brudnopis">znak zdjęty</span>`);
  }

  karta.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const okres = okresZEkranu();
    if (!okres) return;
    const idOkresu = okres.id;

    if (b.dataset.znak){
      const grupa = b.closest(".cel-znak");
      const pole = grupa.dataset.pole;
      const teraz = znakBiezacy(idOkresu, pole);
      const nowy = teraz === b.dataset.znak ? null : b.dataset.znak;
      ustawZnak(idOkresu, pole, nowy);
      // Przełożenie klas, nie przerysowanie — wykres ma zostać taki, jaki jest.
      for (const p of grupa.querySelectorAll("button")){
        const akt = p.dataset.znak === nowy;
        p.classList.toggle("wybrany", akt);
        p.setAttribute("aria-pressed", akt ? "true" : "false");
      }
      const wiersz = grupa.closest(".cel-wiersz") || grupa.closest(".ftp-czlon");
      if (wiersz) wiersz.classList.toggle("zrobiony", nowy === "tak");
      for (const t of karta.querySelectorAll(`text.znak-punktu[data-pole="${pole}"]`))
        t.classList.toggle("wybrany", nowy != null && t.classList.contains(nowy));
      return;
    }

    if (b.id === "ftp-zapisz"){
      const pole = document.getElementById("ftp-pole");
      const v = Math.round(Number(pole.value));
      if (!isFinite(v) || v < 50 || v > 600){
        stan(`<span class="stan-niezapisane">FTP poza zakresem 50–600 W</span>`);
        return;
      }
      const l = prognozyLokalne();
      l.ftp = v === ftpZRepo() ? null : v;
      const udane = zapiszPrognozyLokalne(l);
      pole.value = v;
      odswiezFtp(okres, v);
      stan(!udane
        ? `<span class="stan-niezapisane">nie udało się zapisać w przeglądarce</span>`
        : brudnopisFtp()
          ? `<span class="stan-brudnopis">FTP zapisane na tym urządzeniu — nie ma go jeszcze w danych</span>`
          : `<span>FTP zgodne z danymi</span>`);
      return;
    }

    if (b.id === "ftp-anuluj"){
      const pole = document.getElementById("ftp-pole");
      pole.value = ftpBiezace() == null ? "" : ftpBiezace();
      odswiezFtp(okres, ftpBiezace());
      stan(brudnopisFtp()
        ? `<span class="stan-brudnopis">FTP zapisane na tym urządzeniu — nie ma go jeszcze w danych</span>`
        : "");
      return;
    }

    if (b.id === "prognoza-eksport"){
      const l = prognozyLokalne();
      const wyniki = {};
      for (const [k,v] of Object.entries(l.znaki)){
        const ciecie = k.indexOf("/");
        const o = k.slice(0,ciecie), pole = k.slice(ciecie+1);
        (wyniki[o] = wyniki[o] || {})[pole] = v;
      }
      const eks = document.getElementById("prognoza-eksport-pole");
      const pusteZnaki = !Object.keys(wyniki).length;
      eks.value = pusteZnaki && l.ftp == null
        ? "Nic nie zaznaczono na tym urządzeniu — wszystko zgadza się z danymi."
        : JSON.stringify({ ftp_biezace: l.ftp, wyniki }, null, 1);
      eks.hidden = false;
      eks.select();
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(eks.value).catch(() => {});
      return;
    }
  });

  karta.addEventListener("input", e => {
    if (e.target.id === "ftp-pole")
      stan(`<span class="stan-niezapisane">niezapisane — dotknij ✓</span>`);
  });

  // Liczby zależne od FTP przeliczamy w miejscu; nie ma tu animacji, więc
  // wolno je nadpisać, ale wykresu nie ruszamy.
  function odswiezFtp(okres, v){
    const q = v == null ? null : watyNaKg(v);
    const w = document.getElementById("ftp-wkg");
    if (w) w.textContent = q == null ? "" : liczba(q,2) + " W/kg";
    const brak = v == null ? null : okres.ftp - v;
    const b1 = document.getElementById("ftp-brak");
    const b2 = document.getElementById("ftp-brak-proc");
    if (b1) b1.textContent = brak == null ? "" : brak > 0 ? "+" + brak + " W" : "dowiezione";
    if (b2) b2.textContent = brak != null && brak > 0 && v
      ? "(+" + liczba(brak / v * 100, 0) + "%)" : "";
  }
}

/* ==========================================================================
   GABLOTA — koszulki

   Osiemnaście koszulek z zawodowego kolarstwa, każda za jeden z góry
   ustalony warunek. Wszystkie progi, warunki, barwy i daty siedzą w dane.js
   w bloku "koszulki" — w kodzie nie ma ani jednej liczby z tej listy.
   Dopisanie koszulki do danych dokłada ją do gabloty; kod nie zna żadnej
   z nazwy.

   ZDOBYCIE JEST FAKTEM Z REPOZYTORIUM. Pole "zdobyta" w dane.js jest jedynym
   źródłem prawdy — inaczej niż notatki i ptaszki w prognozach, tutaj NIE MA
   brudnopisu w przeglądarce. Wyczyszczenie danych strony w Safari skasowałoby
   wtedy dorobek dwóch lat, a to nie jest cena, którą warto płacić za wygodę.

   ZASADA WATÓW. Warunek podany w watach liczy się wyłącznie z pomiaru [Z]:
   miernik albo trenażer w sesji SWOBODNEJ. Nigdy z estymaty Stravy [S] —
   ta podała 975 W na Bump 2, 25 W od warunku Giro sprinterskiej, przy CdA
   0,257 wyliczonym wstecz z jej własnego modelu. To pozycja czasówkowa,
   nie pozycja Fryderyka. Nigdy też z modelu fizycznego [E] z tego samego
   powodu, dla którego moc [E] wyleciała z tabeli segmentów.
   ========================================================================== */

/* ODBLOKOWANIE JEST RĘCZNE — decyzja Fryderyka z 27.08.2026.
   Strona liczy postęp i mówi, że warunek jest spełniony, ale koszulki NIE
   zdobywa: klika ją człowiek. Powód jego słowami: koszulki odblokowuję
   tylko ja sam.

   Skoro klika ją człowiek na iPadzie, a strona nie umie pisać do
   repozytorium (klucz do zapisu w publicznym repo byłby kluczem dla
   wszystkich), zdobycie ma dwie warstwy — jak notatki i ptaszki w prognozach:

   1. dane.js -> koszulki[].zdobyta — ŹRÓDŁO PRAWDY, widoczne na każdym
      urządzeniu, przetrwa wyczyszczenie Safari.
   2. localStorage "kolarstwo-koszulki" — brudnopis TEGO urządzenia.

   Brudnopis wygrywa, gdy istnieje, także wtedy gdy trzyma null — inaczej nie
   dałoby się cofnąć zdobycia wpisanego w danych. Przycisk „Koszulki dla
   Claude'a…" wypisuje brudnopisy do wklejenia w czacie, żeby trafiły na stałe
   do dane.js. Dopóki tam nie trafią, gablota żyje tylko w tej przeglądarce
   i strona mówi to wprost przy każdej takiej koszulce. */
const KLUCZ_KOSZULEK = "kolarstwo-koszulki";

function koszulkiLokalne(){
  try { const o = JSON.parse(localStorage.getItem(KLUCZ_KOSZULEK) || "{}");
        return o && typeof o === "object" ? o : {}; }
  catch(e){ return {}; }
}
function zapiszKoszulkiLokalne(o){
  try { localStorage.setItem(KLUCZ_KOSZULEK, JSON.stringify(o)); return true; }
  catch(e){ return false; }          // prywatne okno albo brak miejsca
}
// Zdobycie koszulki po scaleniu obu warstw. null = niezdobyta.
function zdobycie(k){
  const l = koszulkiLokalne();
  if (Object.prototype.hasOwnProperty.call(l, k.id))
    return l[k.id] ? { ...l[k.id], skad: "urzadzenie" } : null;
  return k.zdobyta ? { ...k.zdobyta, skad: "dane" } : null;
}
// Brudnopis zrównany z danymi nie ma po co żyć.
(function sprzatnijKoszulki(){
  const l = koszulkiLokalne();
  let zmiana = false;
  for (const id of Object.keys(l)){
    const k = ((D.koszulki || {}).lista || []).find(x => x.id === id);
    const wDanych = k && k.zdobyta ? k.zdobyta.data : null;
    const wBrudnopisie = l[id] ? l[id].data : null;
    if (wDanych === wBrudnopisie){ delete l[id]; zmiana = true; }
  }
  if (zmiana) zapiszKoszulkiLokalne(l);
})();

const KOSZULKI = (D.koszulki && D.koszulki.lista) || [];
const SERIE_K   = (D.koszulki && D.koszulki.serie) || [];

// Koszulki liczą się z CAŁEJ historii, nie od meta.liczone_od jak wykresy:
// jazda z 2024 roku odbyła się naprawdę. Zawężenie robi się per koszulka,
// polem od_daty / do_daty.
const JAZDY_GABLOTA = D.aktywnosci.filter(a => D.meta.typy_kolarskie.includes(a.typ));

const wOknie = (k, data) => {
  const d = data.slice(0,10);
  return (!k.od_daty || d >= k.od_daty) && (!k.do_daty || d <= k.do_daty);
};

/* --- pojedyncze miary. Każda zwraca { v, tekst, jazda } albo null --------- */

function mNajdluzszaJazda(k){
  let naj = null;
  for (const a of JAZDY_GABLOTA)
    if (wOknie(k, a.data) && (!naj || a.dystans_m > naj.dystans_m)) naj = a;
  return naj ? { v: naj.dystans_m, jazda: naj,
    tekst: `najdłuższa jazda ${liczba(naj.dystans_m/1000,1)} km` } : null;
}

function mKmWMiesiacu(k){
  const suma = new Map();
  for (const a of JAZDY_GABLOTA){
    if (!wOknie(k, a.data)) continue;
    const m = a.data.slice(0,7);
    suma.set(m, (suma.get(m) || 0) + a.dystans_m);
  }
  let naj = null;
  for (const [m,v] of suma) if (!naj || v > naj.v) naj = { m, v };
  return naj ? { v: naj.v, jazda: null,
    tekst: `najlepszy miesiąc ${liczba(naj.v/1000,0)} km (${miesiacNaTekst(naj.m)})` } : null;
}

// Dwa warunki naraz: dystans ORAZ czas całkowity. Postęp liczymy z jazd, które
// mieszczą się w czasie — jazda ponad limit nie zbliża do celu, choćby była
// najdłuższa.
function mDlugiSzybki(k){
  let naj = null;
  for (const a of JAZDY_GABLOTA){
    if (!wOknie(k, a.data)) continue;
    if (a.czas_calkowity_s > k.limit_czas_s) continue;
    if (!naj || a.dystans_m > naj.dystans_m) naj = a;
  }
  return naj ? { v: naj.dystans_m, jazda: naj,
    tekst: `najdłuższa jazda w czasie do ${czasNaTekst(k.limit_czas_s)} — `
      + `${liczba(naj.dystans_m/1000,1)} km` } : null;
}

function mSegmentCzas(k){
  if (!k.segment_id) return null;
  const lista = (D.proby || []).filter(p => p.s === k.segment_id);
  if (!lista.length) return null;
  const naj = lista.reduce((a,b) => b.czas_s < a.czas_s ? b : a);
  return { v: naj.czas_s, jazda: JAZDA_PO_ID.get(naj.a),
    tekst: `najlepszy czas ${naj.czas_s < 60 ? naj.czas_s + " s" : czasNaTekst(naj.czas_s)}`
      + ` z ${lista.length} `
      + `${lista.length === 1 ? "próby" : "prób"}` };
}

// Moc: tylko pomiar i tylko sesje swobodne. jestErg() już wie, jak odróżnić
// trening sterowany od prawdziwego wysiłku.
function mMocOkna(k){
  let naj = null;
  for (const kr of (D.moc_krzywe || [])){
    const j = JAZDA_PO_ID.get(kr.a);
    if (!j || jestErg(j) || !wOknie(k, j.data)) continue;
    const w = kr.w[k.okno_s];
    if (w == null) continue;
    if (!naj || w > naj.v) naj = { v: w, jazda: j };
  }
  return naj ? { ...naj,
    tekst: `najlepszy pomiar ${naj.v} W przez ${oknoNaTekst(k.okno_s)}` } : null;
}

/* Przerwy w oknie koszulki. Liczymy przerwę, której KONIEC wpada w okno —
   czyli tę, która naprawdę przecina wyznaczony czas. Zgłoszone z góry wyjazdy
   bez roweru nie liczą się jako przerwa, dokładnie jak w kryterium sezonu:
   dwie różne odpowiedzi na to samo pytanie byłyby gorsze niż jedna surowsza. */
function mBezPrzerwy(k){
  const dni = [...new Set(JAZDY_GABLOTA
    .filter(a => !k.do_daty || a.data.slice(0,10) <= k.do_daty)
    .map(a => a.data.slice(0,10)))].sort();
  let najwieksza = 0, ktora = null;
  for (let i = 1; i < dni.length; i++){
    if (k.od_daty && dni[i] < k.od_daty) continue;
    if (wyjazdDla(dni[i-1], dni[i])) continue;
    const g = roznicaDni(naDzien(dni[i-1]), naDzien(dni[i]));
    if (g > najwieksza){ najwieksza = g; ktora = { od: dni[i-1], do: dni[i] }; }
  }
  const ostatni = dni[dni.length-1] || null;
  const koniecLiczenia = k.do_daty && DZIS > k.do_daty ? k.do_daty : DZIS;
  const trwa = ostatni && (!k.od_daty || koniecLiczenia >= k.od_daty)
    ? roznicaDni(naDzien(ostatni), naDzien(koniecLiczenia)) : 0;
  return { najwieksza, ktora, ostatni, trwa,
    przed: k.od_daty ? DZIS < k.od_daty : false,
    po: k.do_daty ? DZIS > k.do_daty : false };
}

const MIARY = {
  najdluzsza_jazda_m: mNajdluzszaJazda,
  km_w_miesiacu_m:    mKmWMiesiacu,
  dlugi_szybki:       mDlugiSzybki,
  segment_czas_s:     mSegmentCzas,
  moc_okno_w:         mMocOkna
};

function miesiacNaTekst(rm){
  const N = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
  return N[+rm.slice(5,7) - 1] + " " + rm.slice(0,4);
}
function progNaTekst(k){
  if (k.prog == null) return "";
  if (k.jednostka === "m")  return liczba(k.prog/1000, k.prog % 1000 ? 1 : 0) + " km";
  if (k.jednostka === "s")  return k.prog < 60 ? k.prog + " s" : czasNaTekst(k.prog);
  if (k.jednostka === "W")  return k.prog + " W";
  if (k.jednostka === "dni")return k.prog + " dni";
  return k.prog + (k.jednostka ? " " + k.jednostka : "");
}

/* Stan koszulki. Strona NIGDY nie ogłasza zdobycia sama — nawet gdy warunek
   jest policzalny i spełniony, mówi tylko „warunek spełniony". Wpis do
   dane.js jest decyzją Fryderyka, tak samo jak ptaszek w prognozach. */
function stanKoszulki(k){
  const z = zdobycie(k);
  if (z) return { stan: "zdobyta", udzial: 1, zdobycie: z };

  // Koszulka „bez przerwy" bez wyznaczonego okna nie znaczy nic — wtedy
  // rozstrzyga człowiek, zamiast liczyć od początku świata.
  if (k.miara === "bez_przerwy_dni" && k.od_daty && k.do_daty){
    const p = mBezPrzerwy(k);
    const dlugosc = roznicaDni(naDzien(k.od_daty), naDzien(k.do_daty));
    if (p.przed) return { stan: "przed", udzial: 0, przerwa: p,
      tekst: `okno startuje ${pl(k.od_daty)} — do startu `
        + `${roznicaDni(naDzien(DZIS), naDzien(k.od_daty))} dni` };
    if (p.po) return p.najwieksza > k.prog
      ? { stan: "przepadla", udzial: 1, przerwa: p,
          tekst: `najdłuższa przerwa w oknie: ${p.najwieksza} dni` }
      : { stan: "spelniony", udzial: 1, przerwa: p,
          tekst: `najdłuższa przerwa w oknie: ${p.najwieksza} dni` };
    const minelo = roznicaDni(naDzien(k.od_daty), naDzien(DZIS));
    return { stan: p.najwieksza > k.prog ? "przepadla" : "w-toku",
      udzial: Math.max(0, Math.min(1, minelo / dlugosc)),
      przerwa: p,
      alarm: p.trwa >= 10,
      tekst: `${p.trwa} ${p.trwa === 1 ? "dzień" : "dni"} od ostatniej jazdy · `
        + `najdłuższa przerwa w oknie: ${p.najwieksza} dni` };
  }

  const licz = MIARY[k.miara];
  if (!licz) return { stan: "reczna", udzial: 0 };

  const w = licz(k);
  if (k.wymaga_miernika && !w) return { stan: "czeka-na-miernik", udzial: 0 };
  if (!w) return { stan: "brak-danych", udzial: 0 };

  const spelniony = k.porownanie === "<=" ? w.v <= k.prog : w.v >= k.prog;
  // Przy warunku „nie więcej niż" bliżej celu znaczy MNIEJ, więc udział liczy
  // się odwrotnie: 45 s celu wobec 50 s rekordu to 90% drogi, nie 111%.
  const udzial = k.porownanie === "<=" ? k.prog / w.v : w.v / k.prog;
  return { stan: spelniony ? "spelniony" : "postep",
    udzial: Math.max(0, Math.min(1, udzial)),
    pomiar: w, tekst: w.tekst };
}

/* --- koszulka jako rysunek ------------------------------------------------
   Barwy pochodzą z definicji koszulki w dane.js, nie z palety motywu:
   maglia rosa ma być różowa w obu motywach. Obrys jest jedynym wyjątkiem —
   bierze --linia, bo biała koszulka na białym tle byłaby niewidzialna, a to
   nie jest barwa koszulki, tylko krawędź rysunku. */
/* Sylwetka koszulki KOLARSKIEJ, nie koszulki gimnastycznej: rękaw opada
   skośnie i kończy się mankietem, bok zwęża się w talii, z przodu biegnie
   zamek. Bez tych trzech rzeczy rysunek czyta się jak zwykły t-shirt. */
const KSZTALT_KOSZULKI =
  "M36 13 L26 15 L7 32 L15 52 L31 46 Q28 76 31 100 Q50 106 69 100 "
  + "Q72 76 69 46 L85 52 L93 32 L74 15 L64 13 Q50 24 36 13 Z";
const DETALE_KOSZULKI =
  '<path d="M36 13 Q50 24 64 13"/>'                      // kołnierz
  + '<path d="M50 24 L50 101" opacity=".5"/>'            // zamek
  + '<path d="M11 35 L19 54" opacity=".45"/>'            // mankiet lewy
  + '<path d="M89 35 L81 54" opacity=".45"/>'            // mankiet prawy
  + '<path d="M31 94 Q50 100 69 94" opacity=".45"/>';    // dolna lamówka

function ikonaKoszulki(k, prefiks){
  const b = k.barwy || {};
  const id = (prefiks || "g") + "-" + k.id;
  let wnetrze = "";

  if (b.wzor === "grochy"){
    for (let y = 26; y < 102; y += 15)
      for (let x = 4 + (((y - 26)/15) % 2 ? 7 : 0); x < 100; x += 15)
        wnetrze += `<circle cx="${x}" cy="${y}" r="4.4" fill="${b.dodatek}"/>`;
  } else if (b.wzor === "tecza"){
    (b.pasy || []).forEach((barwa,i) =>
      wnetrze += `<rect x="0" y="${46 + i*7}" width="100" height="7" fill="${barwa}"/>`);
  } else if (b.wzor === "pas"){
    wnetrze += `<rect x="0" y="50" width="100" height="16" fill="${b.dodatek}"/>`;
  }

  // Barwa i wzór siedzą w osobnej grupie, obrys poza nią. Dzięki temu
  // przygaszenie zablokowanej koszulki gasi kolor, a nie sylwetkę — biała
  // koszulka na białym tle inaczej znikałaby zupełnie.
  return `<svg class="koszulka" viewBox="0 0 100 112" role="img"
    aria-label="Koszulka: ${bezpieczny(k.nazwa)}">
    <title>${bezpieczny(k.nazwa)}</title>
    ${wnetrze ? `<clipPath id="${id}"><path d="${KSZTALT_KOSZULKI}"/></clipPath>` : ""}
    <g class="barwa">
      <path d="${KSZTALT_KOSZULKI}" fill="${b.tlo || "#CCCCCC"}"/>
      ${wnetrze ? `<g clip-path="url(#${id})">${wnetrze}</g>` : ""}
    </g>
    <g fill="none" stroke="var(--linia)" stroke-width="1.7" stroke-linejoin="round"
       stroke-linecap="round">
      <path d="${KSZTALT_KOSZULKI}"/>
      ${DETALE_KOSZULKI}
    </g>
  </svg>`;
}

const OPIS_STANU = {
  "zdobyta":          "zdobyta",
  "spelniony":        "warunek spełniony — odblokuj",
  "w-toku":           "w toku",
  "przed":            "jeszcze nie wystartowało",
  "przepadla":        "warunek złamany",
  "postep":           "zablokowana",
  "reczna":           "rozstrzygasz sam",
  "czeka-na-miernik": "czeka na miernik mocy",
  "brak-danych":      "brak pomiarów"
};

// Kłódka na zablokowanej koszulce. Sam wyszarzony rysunek mówi „jeszcze nie",
// ale przy osiemnastu kafelkach naraz oko potrzebuje znaku, nie odcienia —
// i tego znaku będzie potrzebowało tym bardziej, im więcej koszulek zdobytych.
const IKONA_KLODKI = `<svg class="klodka" viewBox="0 0 16 16" aria-hidden="true">
  <path d="M4.5 7V5.2a3.5 3.5 0 0 1 7 0V7" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round"/>
  <rect x="2.7" y="7" width="10.6" height="7.3" rx="1.9" fill="currentColor"/>
</svg>`;

function kafelKoszulki(k){
  const s = stanKoszulki(k);
  const zdobyta = s.stan === "zdobyta";
  const pasek = (s.stan === "postep" || s.stan === "w-toku")
    ? `<div class="pasek-postepu${s.alarm ? " alarm" : ""}"
         style="--udzial:${Math.round(s.udzial*100)}%"></div>` : "";
  return `
    <a class="kafel-koszulki${zdobyta ? " zdobyta" : ""}"
       href="#gablota/koszulki/${k.id}" data-id="${k.id}">
      <span class="rysunek">${ikonaKoszulki(k, "kafel")}${
        zdobyta ? "" : `<span class="znak-klodki" title="Zablokowana"
          aria-label="Zablokowana">${IKONA_KLODKI}</span>`}</span>
      <span class="nazwa-koszulki">${bezpieczny(k.nazwa)}</span>
      <span class="stan-koszulki s-${s.stan}">${
        zdobyta ? pl(s.zdobycie.data)
        : pasek ? Math.round(s.udzial*100) + "% drogi"
        : OPIS_STANU[s.stan]}</span>
      ${pasek}
    </a>`;
}

const gablota = (arg) => {
  if (!KOSZULKI.length) return pusto("Gablota");
  if (arg) return jednaKoszulka(arg);

  const zdobyte = KOSZULKI.filter(k => zdobycie(k)).length;
  const grupy = SERIE_K.map(s => {
    const swoje = KOSZULKI.filter(k => s.zawiera.includes(k.seria));
    if (!swoje.length) return "";
    const ile = swoje.filter(k => zdobycie(k)).length;
    return `
      <section>
        <div class="naglowek-serii">
          <h2>${bezpieczny(s.nazwa)}</h2>
          <span class="licznik-serii">${ile} z ${swoje.length}</span>
        </div>
        <p class="opis">${bezpieczny(s.podpis || "")}</p>
        <div class="gablota-siatka">${swoje.map(kafelKoszulki).join("")}</div>
      </section>`;
  }).join("");

  return `
  <section>
    <h2>Gablota</h2>
    <p class="opis">
      Osiemnaście koszulek, każda za jeden ustalony z góry warunek. Koszulka
      zablokowana jest widoczna od pierwszego dnia i nosi kłódkę — masz
      widzieć, po co jedziesz. Dotknij którejkolwiek, żeby zobaczyć pełny
      warunek, ile brakuje i przycisk odblokowania.
      <br><b>Kłódkę zdejmujesz wyłącznie Ty.</b> Strona liczy postęp i powie,
      kiedy warunek padł, ale sama nigdy niczego nie odblokuje — nawet przy
      100%. Pomyłkę cofa przycisk „Cofnij zdobycie" w tej samej koszulce.
    </p>
    <div class="kafelki">
      <div class="kafel">
        <div class="etykieta">Zdobyte</div>
        <div class="liczba">${zdobyte} <span
          style="font-size:16px;font-weight:600;color:var(--slaby)">z ${KOSZULKI.length}</span></div>
        <div class="stopka">stan na ${pl(DZIS)}</div>
      </div>
    </div>
  </section>
  ${grupy}
  <div class="prognoza-dol">
    <span class="odblok-podpis">Odblokowania z tego urządzenia trzeba przenieść
      do <code>dane.js</code>, żeby przetrwały wyczyszczenie przeglądarki.</span>
    <button class="link-tekstowy" data-akcja="eksport">Koszulki dla Claude'a…</button>
  </div>
  <textarea id="koszulki-eksport-pole" rows="5" hidden readonly></textarea>
  <div class="info">
    Warunki podane w watach liczą się <b>wyłącznie z pomiaru</b>: miernika albo
    trenażera w sesji swobodnej. Nigdy z estymaty Stravy. Ta podała 975 W na
    Bump 2 — 25 W od warunku Giro sprinterskiej. Gdyby liczyć jej model,
    pierwsza koszulka padłaby za cudze założenie o pozycji na rowerze
    (wychodzi z niego CdA 0,257, czyli sylwetka czasówkowa), a nie za Twoją moc.
    Dlatego koszulki wattowe stoją zablokowane do miernika, a z trenażera
    liczą się <b>tylko sesje swobodne</b> — w trybie
    <span class="znacznik-erg">ERG</span> moc trzyma program, nie zawodnik.
  </div>`;
};

/* --- Panel odblokowania -------------------------------------------------
   Koszulki odblokowuje wyłącznie Fryderyk. Strona liczy postęp i mówi, kiedy
   warunek jest spełniony, ale sama nie zdejmuje kłódki — nawet przy 100%.
   Pomiar to nie decyzja, dokładnie jak przy ptaszkach w prognozach. */
function panelOdblokowania(k, s){
  const z = s.zdobycie || null;
  const spelniony = s.stan === "spelniony";

  if (z) return `
    <div class="odblok-blok zdobyty">
      <div class="odblok-tresc">
        <div class="odblok-tytul">Zdobyta ${pl(z.data)}</div>
        <div class="odblok-podpis">${z.skad === "urzadzenie"
          ? `Odblokowana na tym urządzeniu. <b>Nie ma jej jeszcze w danych</b> —
             wyślij ją do Claude'a przyciskiem na dole gabloty, wtedy przetrwa
             wyczyszczenie przeglądarki i pokaże się na telefonie.`
          : `Zapisana w <code>dane.js</code> — widać ją na każdym urządzeniu.`}
        </div>
      </div>
      <button class="przycisk-odblok cofnij" data-akcja="zablokuj" data-id="${k.id}">
        Cofnij zdobycie
      </button>
    </div>`;

  return `
    <div class="odblok-blok${spelniony ? " gotowy" : ""}">
      <div class="odblok-tresc">
        <div class="odblok-tytul">${spelniony
          ? "Warunek spełniony — koszulka czeka na Ciebie"
          : "Zablokowana"}</div>
        <div class="odblok-podpis">${spelniony
          ? `Dane mówią, że próg padł. Zdejmujesz kłódkę Ty, nie strona.`
          : `Możesz ją odblokować w każdej chwili — strona nie sprawdza Ci
             dowodu, tylko liczy postęp. Odpowiadasz za to, że warunek naprawdę
             padł.`}</div>
      </div>
      <button class="przycisk-odblok" data-akcja="odblokuj" data-id="${k.id}">
        ${IKONA_KLODKI} Odblokuj koszulkę
      </button>
    </div>`;
}

/* --- Fajerwerki ---------------------------------------------------------
   Rysowane tym samym sposobem co reszta strony: kilkadziesiąt kropek w SVG,
   rozrzuconych po okręgu i animowanych przekształceniem. Żadnej biblioteki,
   żadnego obrazka. Warstwa jest nieklikalna i kasuje się sama po sekundzie
   i pół, a przy włączonym „ogranicz ruch" w systemie nie odpala się wcale —
   ta sama zasada co przy animacjach wykresów. */
function fajerwerki(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const stara = document.getElementById("fajerwerki");
  if (stara) stara.remove();

  const BARWY = ["#FFD400", "#E30613", "#009FE3", "#00A94F", "#F0629B", "#F07C00"];
  const warstwa = document.createElement("div");
  warstwa.id = "fajerwerki";
  warstwa.setAttribute("aria-hidden", "true");

  // Trzy wybuchy w różnych miejscach i o różnych porach — jeden na środku
  // wygląda jak błąd rysowania, trzy jak fajerwerki.
  const wybuchy = [ {x:50, y:38, t:0}, {x:26, y:52, t:180}, {x:74, y:50, t:340} ];
  for (const w of wybuchy){
    const ile = 26;
    for (let i = 0; i < ile; i++){
      const kat = (i / ile) * Math.PI * 2 + Math.random()*0.25;
      const zasieg = 90 + Math.random()*110;
      const iskra = document.createElement("i");
      iskra.className = "iskra";
      iskra.style.left = w.x + "%";
      iskra.style.top  = w.y + "%";
      iskra.style.background = BARWY[i % BARWY.length];
      const r = 7 + Math.random()*7;
      iskra.style.width = iskra.style.height = r + "px";
      iskra.style.margin = (-r/2) + "px 0 0 " + (-r/2) + "px";
      iskra.style.setProperty("--dx", Math.cos(kat)*zasieg + "px");
      iskra.style.setProperty("--dy", Math.sin(kat)*zasieg + "px");
      iskra.style.animationDelay = (w.t + Math.random()*60) + "ms";
      warstwa.appendChild(iskra);
    }
    // Błysk w miejscu wybuchu — bez niego iskry wyglądają, jakby przyleciały
    // znikąd, zamiast skądś wystrzelić.
    const blysk = document.createElement("i");
    blysk.className = "blysk";
    blysk.style.left = w.x + "%";
    blysk.style.top = w.y + "%";
    blysk.style.animationDelay = w.t + "ms";
    warstwa.appendChild(blysk);
  }
  document.body.appendChild(warstwa);
  setTimeout(() => warstwa.remove(), 1900);
}

/* Odblokowanie i cofnięcie. Zapis idzie do brudnopisu urządzenia; dane.js
   pozostaje źródłem prawdy i wygrywa dopiero wtedy, gdy wpis do niego trafi. */
function podepnijGablote(){
  const tresc = document.getElementById("tresc");
  if (!tresc || tresc.dataset.gablotaPodpieta) return;   // raz, nie co wejście
  tresc.dataset.gablotaPodpieta = "1";

  const przerysuj = () => {
    const [, , arg] = zHasha();
    tresc.innerHTML = gablota(arg);
  };

  tresc.addEventListener("click", e => {
    const b = e.target.closest("button[data-akcja]");
    if (!b) return;
    // Przycisk eksportu nie dotyczy żadnej pojedynczej koszulki, więc szukanie
    // jej po data-id musi siedzieć w gałęziach, które jej naprawdę używają.
    const k = b.dataset.id ? KOSZULKI.find(x => x.id === b.dataset.id) : null;
    const l = koszulkiLokalne();

    if (b.dataset.akcja === "odblokuj" && k){
      // Data z zegara urządzenia, nie z meta.pobrano: to moment DECYZJI,
      // a nie pomiar, więc liczy się dzień, w którym klikasz.
      l[k.id] = { data: new Date().toISOString().slice(0,10), skad: "urzadzenie" };
      if (k.zdobyta && k.zdobyta.data === l[k.id].data) delete l[k.id];
      if (!zapiszKoszulkiLokalne(l)){
        alert("Nie udało się zapisać w tej przeglądarce (prywatne okno?).");
        return;
      }
      przerysuj();
      fajerwerki();
      return;
    }

    if (b.dataset.akcja === "zablokuj" && k){
      // Zapisujemy null, a nie kasujemy wpis: null jest jawnym „zdjęte na tym
      // urządzeniu" i wygrywa nad datą wpisaną w dane.js. Bez tego nie dałoby
      // się cofnąć pomyłki, która trafiła już do repozytorium.
      if (k.zdobyta) l[k.id] = null; else delete l[k.id];
      zapiszKoszulkiLokalne(l);
      przerysuj();
      return;
    }

    if (b.dataset.akcja === "eksport"){
      const pelne = {};
      for (const [id,v] of Object.entries(koszulkiLokalne())){
        const kk = KOSZULKI.find(x => x.id === id);
        pelne[id] = v ? { nazwa: kk ? kk.nazwa : "?", data: v.data }
                      : { nazwa: kk ? kk.nazwa : "?", zdjeta: true };
      }
      const eks = document.getElementById("koszulki-eksport-pole");
      eks.value = Object.keys(pelne).length
        ? JSON.stringify(pelne, null, 1)
        : "Na tym urządzeniu nic nie odblokowano poza tym, co już jest w danych.";
      eks.hidden = false;
      eks.select();
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(eks.value).catch(() => {});
    }
  });
}

function jednaKoszulka(id){
  const k = KOSZULKI.find(x => x.id === id);
  if (!k) return `
    <div class="pusto">
      <span class="znak">Nie znam takiej koszulki</span>
      Wróć do <a class="odn-zakladka" href="#gablota/koszulki">gabloty</a>.
    </div>`;

  const s = stanKoszulki(k);
  const seria = SERIE_K.find(x => x.zawiera.includes(k.seria));
  const zdobyta = s.stan === "zdobyta";
  const p = s.przerwa;

  const wiersz = (etykieta, tresc) => tresc
    ? `<div class="wiersz-szczegolu"><span class="etykieta">${etykieta}</span>
       <span class="tresc">${tresc}</span></div>` : "";

  const z = s.zdobycie || null;
  const dowod = z && z.dowod
    ? `<a class="odn" href="${bezpieczny(z.dowod)}" target="_blank"
        rel="noopener">dowód &#8599;</a>` : "";

  const postep = (() => {
    if (zdobyta) return "";
    if (s.stan === "czeka-na-miernik") return `
      <div class="info">
        <b>Czeka na miernik mocy.</b> Ten warunek jest w watach, a wat bez
        pomiaru to nie wat. Estymata Stravy <b>[S]</b> i model fizyczny
        <b>[E]</b> nie liczą się tutaj ani trochę — dopiero miernik albo sesja
        swobodna na trenażerze. Pasek postępu pojawi się sam w dniu pierwszego
        pomiaru na tym oknie.
      </div>`;
    if (s.stan === "reczna") return `
      <div class="info">
        Tego warunku strona nie policzy — Strava nie oddaje takich danych przez
        API. Sprawdzasz go sam i odblokowujesz przyciskiem wyżej. Strona nie
        będzie zgadywać z nazwy jazdy: domysł w miejscu pomiaru to dokładnie
        ten błąd, przez który z tabeli segmentów wyleciała moc [E].
      </div>`;
    if (s.stan === "brak-danych") return `
      <div class="info">
        Nie ma jeszcze ani jednego pomiaru, z którego dałoby się to policzyć.
        ${k.segment_id ? "" : "Gdy pojawi się numer segmentu w danych, "
          + "koszulka zacznie liczyć się sama."}
      </div>`;

    const procent = Math.round(s.udzial * 100);
    return `
      <div class="postep-blok">
        <div class="postep-gora">
          <span>${s.tekst || ""}</span>
          <span class="postep-procent">${procent}%</span>
        </div>
        <div class="pasek-postepu duzy${s.alarm ? " alarm" : ""}"
             style="--udzial:${procent}%"></div>
        <div class="postep-dol">${k.miara === "bez_przerwy_dni"
          ? `limit przerwy: ${progNaTekst(k)} · okno ${pl(k.od_daty)} – ${pl(k.do_daty)}`
          : `cel: ${progNaTekst(k)}`}</div>
      </div>`;
  })();

  const ostrzezenieOkna = p && s.alarm ? `
    <div class="info alarmowy">
      <b>${p.trwa} dni od ostatniej jazdy.</b> Limit to ${k.prog} dni — zostało
      ${k.prog - p.trwa}. To jedyne uzgodnione kryterium sezonu i jedyna
      koszulka, którą można stracić przez nic-nie-robienie.
    </div>` : "";

  return `
  <section>
    <div class="proba-tytul">
      <h2>${bezpieczny(k.nazwa)}</h2>
      <a class="kolko-reset" href="#gablota/koszulki"
         title="Wróć do gabloty" aria-label="Wróć do gabloty">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2v3.2h-3.2"/></svg>
      </a>
    </div>
    <div class="szczegol-koszulki">
      <div class="rysunek-duzy${zdobyta ? " zdobyta" : ""}">${ikonaKoszulki(k, "duzy")}</div>
      <div class="szczegol-tresc">
        <p class="warunek">${bezpieczny(k.warunek_opis)}</p>
        ${wiersz("Seria", seria ? bezpieczny(seria.nazwa) : "")}
        ${wiersz("Stan", `<b class="s-${s.stan}">${
          zdobyta ? "zdobyta " + pl(z.data) : OPIS_STANU[s.stan]}</b>`)}
        ${wiersz("Postęp", k.weryfikacja === "auto"
          ? "liczony przez stronę z danych"
          : "sprawdzasz sam — strona tego nie policzy")}
        ${wiersz("Odblokowanie", "zawsze ręczne — klikasz Ty")}
        ${wiersz("Dowód", zdobyta
          ? (z.tag ? `<b>[${bezpieczny(z.tag)}]</b> ` : "") + dowod
          : "")}
      </div>
    </div>
    ${panelOdblokowania(k, s)}
    ${ostrzezenieOkna}
    ${postep}
    ${s.pomiar && s.pomiar.jazda ? `
      <div class="info">
        Najlepszy wynik do dziś:
        <a class="odn" href="${adresStravy(s.pomiar.jazda)}" target="_blank"
           rel="noopener">${ikonaDyscypliny(s.pomiar.jazda.typ,15)}
           <b>${bezpieczny(s.pomiar.jazda.nazwa)}</b> &#8599;</a>${
           znacznikErg(s.pomiar.jazda)} · ${pl(s.pomiar.jazda.data)}
      </div>` : ""}
    ${p && p.ktora ? `
      <div class="info">
        Najdłuższa przerwa w oknie: <b>${p.najwieksza} dni</b>,
        od ${pl(p.ktora.od)} do ${pl(p.ktora.do)}.
      </div>` : ""}
    ${k._uwaga ? `<div class="info uwaga-koszulki">
        <b>Zastrzeżenie:</b> ${bezpieczny(k._uwaga)}</div>` : ""}
  </section>`;
}

/* ==========================================================================
   OBJĘTOŚĆ — rozkład czasu po strefach

   Pierścień, nie tort: środek zostaje pusty, bo niesie liczbę zbiorczą, a oko
   i tak porównuje DŁUGOŚCI łuków, nie pola wycinków. To ten sam wykres, który
   Strava rysuje po każdej jeździe — z jedną różnicą, która jest całym sensem
   tej zakładki: NIE dotyczy jednej jazdy, tylko okna 7, 30 albo 90 dni.
   Pojedynczą jazdę Fryderyk ma na Stravie i nie potrzebuje jej drugi raz.

   Liczenie: sumujemy sekundy w każdej strefie ze wszystkich jazd w oknie
   i dzielimy przez sumę całkowitą. Dwie jazdy po godzinie, jedna 70% w Z2
   i druga 60% w Z2, dają 65% — bo (0,7 + 0,6) / 2 = 0,65. Przy jazdach
   różnej długości waży je sam czas, i tak ma być: godzina w Z2 waży więcej
   niż dziesięć minut w Z2.

   BARWY. Strefy są uporządkowane (Z1 < Z2 < …), więc niosą JASNOŚĆ jednego
   odcienia, a nie tęczę: ciemniej = ciężej. Odcień mówi, o którą miarę chodzi,
   i jest dokładnie ten, który w tym projekcie już znaczy tętno (fuksja) i moc
   (bursztyn). Zero nowych znaczeń barwnych. Rampy przeszły walidator skilla
   dataviz w trybie --ordinal, w obu motywach: jasność monotoniczna, odstęp
   między stopniami ≥ 0,06, najjaśniejszy stopień ≥ 2:1 do tła.
   ========================================================================== */

const STREFY = D.strefy || null;

/* --- Tabele przeliczników stref ------------------------------------------
   Progi są DATOWANE i działają tylko w przód. Rozkład jazdy liczy się tabelą
   obowiązującą w dniu tej jazdy i zapisuje na stałe, więc podniesienie progu
   w listopadzie nie rusza jazd z września — inaczej historia zmieniałaby się
   pod ręką i żaden wykres nie znaczyłby tego samego dwa razy.

   Zapis ma dwie warstwy, jak notatki i koszulki: dane.js jest źródłem prawdy,
   localStorage brudnopisem tego urządzenia. Strona nie umie pisać do
   repozytorium, więc nowa tabela wpisana na iPadzie czeka tam, aż przycisk
   wypisze ją do wklejenia w czacie. */
const KLUCZ_STREF = "kolarstwo-strefy";

function strefyLokalne(){
  try { const o = JSON.parse(localStorage.getItem(KLUCZ_STREF) || "{}");
        return o && typeof o === "object" ? o : {}; }
  catch(e){ return {}; }
}
function zapiszStrefyLokalne(o){
  try { localStorage.setItem(KLUCZ_STREF, JSON.stringify(o)); return true; }
  catch(e){ return false; }
}
// Wszystkie wersje tabeli, po dacie rosnąco. Brudnopis o tej samej dacie
// nadpisuje wersję z danych — inaczej poprawka wpisana dwa razy tego samego
// dnia zakładałaby dwie sprzeczne tabele na jeden dzień.
function tabeleStref(miara){
  const zDanych = ((STREFY[miara] || {}).tabele || []).map(t => ({ ...t, skad: "dane" }));
  const zUrzadzenia = (strefyLokalne()[miara] || []).map(t => ({ ...t, skad: "urzadzenie" }));
  const po = new Map();
  for (const t of [...zDanych, ...zUrzadzenia]) po.set(t.od, t);
  return [...po.values()].sort((a,b) => a.od < b.od ? -1 : 1);
}
// Tabela obowiązująca danego dnia. Jazda starsza niż najstarsza tabela bierze
// tę najstarszą — innej nie ma, a odmowa policzenia byłaby gorsza niż jawne
// założenie. Tę samą regułę musi zastosować automat.
function tabelaNaDzien(miara, data){
  const lista = tabeleStref(miara);
  if (!lista.length) return null;
  let wynik = lista[0];
  for (const t of lista) if (t.od <= data) wynik = t;
  return wynik;
}
const tabelaBiezaca = (miara) => {
  const lista = tabeleStref(miara);
  return lista.length ? lista[lista.length-1] : null;
};
const strefyMiary = (miara) => {
  const t = tabelaBiezaca(miara);
  return t ? t.strefy : [];
};

const IKONA_SERCA = `<svg class="ikona-tabeli" viewBox="0 0 20 20" aria-hidden="true">
  <path d="M10 17S2.8 12.4 2.8 7.6A4 4 0 0 1 10 5.2a4 4 0 0 1 7.2 2.4C17.2 12.4 10 17 10 17Z"
    fill="currentColor"/></svg>`;
const IKONA_BLYSKAWICY = `<svg class="ikona-tabeli" viewBox="0 0 20 20" aria-hidden="true">
  <path d="M11.4 2 4.6 11.2h4.2L8.2 18l7.2-9.6h-4.4L11.4 2Z" fill="currentColor"/></svg>`;

function tabelaStrefHTML(miara){
  const def = STREFY[miara];
  const biezaca = tabelaBiezaca(miara);
  if (!biezaca) return "";
  const tetno = miara === "tetno";
  const wersje = tabeleStref(miara);
  const brudnopis = biezaca.skad === "urzadzenie";

  return `
  <section class="tabela-stref" id="tabela-stref" data-miara="${miara}">
    <div class="tabela-naglowek">
      <h2>${tetno ? IKONA_SERCA : IKONA_BLYSKAWICY}
        Przelicznik stref ${tetno ? "tętna" : "mocy"}</h2>
      <span class="tabela-od">obowiązuje od <b>${pl(biezaca.od)}</b></span>
    </div>
    <p class="opis">
      Tu wpisujesz swoje progi. Każda strefa osobno, w ${tetno ? "uderzeniach na minutę" : "watach"}.
      <br><b>Zmiana działa tylko w przód.</b> Jazda jest liczona tabelą, która
      obowiązywała w <b>dniu tej jazdy</b>, i jej rozkład zostaje zapisany na
      stałe. Jeśli w listopadzie podniesiesz Z2, wrześniowe jazdy zostaną takie,
      jakie były — inaczej historia zmieniałaby się pod ręką i żaden wykres nie
      znaczyłby tego samego dwa razy.
    </p>
    <ul class="strefy-wiersze">
      ${biezaca.strefy.map((z,i) => `
        <li class="wiersz-progu">
          <span class="prostokat" style="background:var(--strefa-${miara}-${i+1})"></span>
          <span class="nazwa-progu">${bezpieczny(z.nazwa)}</span>
          <span class="pola-progu">
            ${i === 0
              ? `<span class="prog-staly" title="Nie do zmiany: wszystko poniżej musi
                   gdzieś trafić">0</span>`
              : `<input type="number" inputmode="numeric" class="prog" data-i="${i}"
                   data-pole="min" value="${z.min}" min="0" max="9999" step="1"
                   aria-label="${bezpieczny(z.nazwa)} — dolny próg">`}
            <span class="myslnik">–</span>
            ${z.max == null
              ? `<span class="prog-staly" title="Nie do zmiany: wszystko powyżej musi
                   gdzieś trafić">∞</span>`
              : `<input type="number" inputmode="numeric" class="prog" data-i="${i}"
                   data-pole="max" value="${z.max}" min="0" max="9999" step="1"
                   aria-label="${bezpieczny(z.nazwa)} — górny próg">`}
            <span class="jednostka-progu">${def.jednostka}</span>
          </span>
        </li>`).join("")}
    </ul>
    <div class="tabela-dol">
      <span id="tabela-stan">${brudnopis
        ? `<span class="stan-brudnopis">ta tabela jest zapisana tylko na tym urządzeniu</span>`
        : ""}</span>
      <span class="tabela-przyciski">
        <button class="kolko-akcja" id="tabela-zapisz" title="Zapisz jako nową tabelę od dziś">✓</button>
        <button class="kolko-akcja" id="tabela-anuluj" title="Cofnij zmiany">✗</button>
      </span>
    </div>
    ${wersje.length > 1 ? `
      <div class="info">
        <b>Historia progów.</b> Każda jazda liczy się tą tabelą, która
        obowiązywała w jej dniu.
        <ul class="historia-tabel">
          ${[...wersje].reverse().map(t => `
            <li><span class="kroki-data">od ${pl(t.od)}</span>
              <span>${t.strefy.map(z => z.min + "–" + (z.max == null ? "∞" : z.max)).join(" · ")}</span>
              ${t.skad === "urzadzenie"
                ? `<span class="stan-brudnopis">tylko na tym urządzeniu</span>` : ""}</li>`).join("")}
        </ul>
      </div>` : ""}
    <div class="prognoza-dol">
      <span class="odblok-podpis">Nowe progi zapisują się na tym urządzeniu —
        wyślij je do Claude'a, żeby trafiły do <code>dane.js</code> i liczyły się
        w automacie.</span>
      <button class="link-tekstowy" id="strefy-eksport">Progi dla Claude'a…</button>
    </div>
    <textarea id="strefy-eksport-pole" rows="6" hidden readonly></textarea>
  </section>`;
}

function podepnijTabeleStref(){
  const tresc = document.getElementById("tresc");
  if (!tresc || tresc.dataset.tabeleStrefPodpiete) return;
  tresc.dataset.tabeleStrefPodpiete = "1";

  const stan = (t) => { const e = document.getElementById("tabela-stan"); if (e) e.innerHTML = t; };

  tresc.addEventListener("input", e => {
    if (e.target.classList && e.target.classList.contains("prog"))
      stan(`<span class="stan-niezapisane">niezapisane — dotknij ✓</span>`);
  });

  tresc.addEventListener("click", e => {
    const b = e.target.closest("button");
    const korzen = document.getElementById("tabela-stref");
    if (!b || !korzen) return;
    const miara = korzen.dataset.miara;

    if (b.id === "tabela-zapisz"){
      const biezaca = tabelaBiezaca(miara);
      const ostatnia = biezaca.strefy.length - 1;
      const strefy = biezaca.strefy.map((z,i) => {
        const we = (pole) => korzen.querySelector(`.prog[data-i="${i}"][data-pole="${pole}"]`);
        // Skrajności NIE są polami: pierwsza strefa zaczyna się od zera, ostatnia
        // nie ma końca. Inaczej tętno 90 albo sprint 1000 W wypadałyby poza
        // wszystkie strefy i cicho znikały z wykresu.
        return { ...z,
          min: i === 0 ? 0 : Math.round(+we("min").value),
          max: i === ostatnia ? null : Math.round(+we("max").value) };
      });
      for (let i = 0; i < strefy.length; i++){
        const gora = strefy[i].max == null ? Infinity : strefy[i].max;
        if (!isFinite(strefy[i].min) || (strefy[i].max != null && !isFinite(strefy[i].max))
            || strefy[i].min >= gora){
          stan(`<span class="stan-niezapisane">${bezpieczny(strefy[i].nazwa)}: dolny próg musi być mniejszy od górnego</span>`);
          return;
        }
        if (i && strefy[i].min <= strefy[i-1].max){
          stan(`<span class="stan-niezapisane">${bezpieczny(strefy[i].nazwa)} zachodzi na ${bezpieczny(strefy[i-1].nazwa)}</span>`);
          return;
        }
      }
      const bezZmian = strefy.every((z,i) =>
        z.min === biezaca.strefy[i].min && z.max === biezaca.strefy[i].max);
      if (bezZmian){ stan(`<span>bez zmian wobec obecnej tabeli</span>`); return; }

      // Nowa tabela obowiązuje OD DZIŚ — data z zegara urządzenia, bo to
      // moment decyzji, a nie pomiar.
      const dzis = new Date().toISOString().slice(0,10);
      const l = strefyLokalne();
      l[miara] = (l[miara] || []).filter(t => t.od !== dzis);
      l[miara].push({ od: dzis, zrodlo: "wpisane na urządzeniu", strefy });
      if (!zapiszStrefyLokalne(l)){
        stan(`<span class="stan-niezapisane">nie udało się zapisać w przeglądarce</span>`);
        return;
      }
      const [, , arg] = zHasha();
      tresc.innerHTML = objetosc(miara, arg);
      stan(`<span class="stan-brudnopis">zapisane na tym urządzeniu — obowiązuje od ${pl(dzis)}</span>`);
      return;
    }

    if (b.id === "tabela-anuluj"){
      const [, , arg] = zHasha();
      tresc.innerHTML = objetosc(miara, arg);
      return;
    }

    if (b.id === "strefy-eksport"){
      const l = strefyLokalne();
      const eks = document.getElementById("strefy-eksport-pole");
      eks.value = Object.keys(l).length
        ? JSON.stringify(l, null, 1)
        : "Na tym urządzeniu nie ma własnych progów — obowiązują te z danych.";
      eks.hidden = false;
      eks.select();
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(eks.value).catch(() => {});
    }
  });
}


// Okno liczone WSTECZ od dnia pobrania danych, nie od zegara urządzenia —
// tak jak reszta strony. Strona wie tylko tyle, ile jest w pliku.
function jazdyOkna(dni){
  const granica = dzienNaTekst(naDzien(DZIS) - (dni - 1) * 86400000);
  return JAZDY_GABLOTA.filter(a => a.data.slice(0,10) >= granica
    && a.data.slice(0,10) <= DZIS);
}

/* Rozkład sekund po strefach dla okna. Zwraca null, gdy nie ma ani jednej
   jazdy z tym pomiarem — puste koło z podpisem jest uczciwsze niż koło
   wypełnione zerami, które wygląda jak wynik. */
function rozkladStref(miara, dni){
  const def = STREFY && STREFY[miara];
  if (!def) return null;
  const ile = strefyMiary(miara).length;
  const sumy = new Array(ile).fill(0);
  const jazdy = (STREFY.rozklady && STREFY.rozklady.jazdy) || {};
  let zPomiarem = 0, wszystkich = 0;

  for (const a of jazdyOkna(dni)){
    wszystkich++;
    const r = jazdy[a.id];
    const sek = r && r[miara];
    if (!Array.isArray(sek) || sek.length !== ile) continue;
    zPomiarem++;
    for (let i = 0; i < ile; i++) sumy[i] += sek[i] || 0;
  }
  const suma = sumy.reduce((x,y) => x+y, 0);
  return { sumy, suma, zPomiarem, wszystkich, ile };
}

/* --- Efektywność rozkładu -------------------------------------------------
   Liczba w środku pierścienia. Ocenia KSZTAŁT rozkładu, nie ilość treningu:
   pięć godzin źle rozłożonych dostanie mniej niż dwie dobrze.

   Skąd widełki. Model spolaryzowany Seilera: około 80% czasu poniżej progu
   tlenowego, około 5% w strefie progowej i 15–20% powyżej progu. Rozpisane na
   strefy Stravy siedzą w dane.js (strefy.efektywnosc.widelki) — w kodzie nie
   ma ani jednej z tych liczb. Każdy punkt procentowy poza widełkami kosztuje
   „wagę" punktów wyniku, więc 90% czasu w strefie regeneracyjnej daje zero,
   a nie „prawie sto, bo dużo jeździłeś".

   Osobno liczymy wskaźnik polaryzacji PI = log10(Z1/Z2 × Z3 × 100) z ułamków
   czasu w trzech zakresach Seilera; powyżej 2,00 rozkład uchodzi za
   spolaryzowany (Treff i in. 2019). To kontrola krzyżowa dla samej oceny. */
function efektywnoscRozkladu(miara, rozklad){
  const cfg = STREFY.efektywnosc;
  if (!cfg || !rozklad || !rozklad.suma) return null;
  const widelki = cfg.widelki[miara];
  const strefy = strefyMiary(miara);
  if (!widelki || widelki.length !== strefy.length) return null;

  const udzialy = rozklad.sumy.map(s => s / rozklad.suma * 100);
  let kara = 0;
  const odchylenia = udzialy.map((u,i) => {
    const [lo,hi] = widelki[i];
    const poza = u < lo ? lo - u : u > hi ? u - hi : 0;
    kara += poza * cfg.waga;
    return { i, udzial: u, lo, hi, poza, zaMalo: u < lo };
  });
  const wynik = Math.max(0, Math.min(100, Math.round(100 - kara)));

  // Trzy zakresy Seilera i wskaźnik polaryzacji.
  const grupy = (cfg.grupy_seilera || {})[miara];
  let pi = null, trzy = null;
  if (grupy){
    trzy = grupy.map(g => g.reduce((s,i) => s + udzialy[i], 0) / 100);
    const [z1, z2, z3] = trzy;
    if (z1 > 0 && z3 > 0) pi = Math.log10((z1 / (z2 || 0.01)) * z3 * 100);
  }
  const najgorsze = odchylenia.filter(o => o.poza > 0).sort((a,b) => b.poza - a.poza)[0] || null;
  return { wynik, odchylenia, najgorsze, pi, trzy };
}

/* Rozwinięcie oceny pod wykresem: skąd ta liczba i co ją najbardziej ciągnie
   w dół. Bez tego procent w środku byłby wyrocznią bez uzasadnienia — a to
   ten sam błąd co moc [E] udająca pomiar. */
function blokEfektywnosci(miara, rozklad){
  const e = efektywnoscRozkladu(miara, rozklad);
  const cfg = STREFY.efektywnosc;
  if (!cfg) return "";
  const strefy = strefyMiary(miara);
  const widelki = cfg.widelki[miara];

  const wzorzec = `<ul class="wzorzec-lista">${strefy.map((z,i) => {
    const [lo,hi] = widelki[i];
    const o = e && e.odchylenia[i];
    return `<li${o && o.poza > 0 ? ' class="poza"' : ""}>
      <span class="prostokat" style="background:var(--strefa-${miara}-${i+1})"></span>
      <span class="nazwa-strefy">${bezpieczny(z.nazwa)}</span>
      <span class="wzorzec-widelki">${lo}–${hi}%</span>
      <span class="wzorzec-teraz">${o ? liczba(o.udzial,1) + "%" : "—"}</span>
    </li>`;
  }).join("")}</ul>`;

  return `
  <section class="ocena-blok">
    <h2>Efektywność rozkładu</h2>
    <p class="opis">
      To ocena <b>kształtu</b> rozkładu, nie ilości treningu: pięć godzin źle
      rozłożonych dostanie mniej niż dwie dobrze. Wzorcem jest trening
      <b>spolaryzowany</b> — około 80% czasu lekko, poniżej progu tlenowego,
      około 5% w strefie progowej i 15–20% mocno, powyżej progu. Sto procent
      znaczy: wszystkie strefy mieszczą się w widełkach. Każdy punkt procentowy
      poza widełkami kosztuje ${liczba(cfg.waga,1).replace(",0","")} punktu oceny.
      <br>Dlatego 90% czasu w strefie regeneracyjnej daje wynik bliski zeru —
      dużo jeżdżenia to nie to samo co dobry trening.
    </p>
    ${wzorzec}
    ${e ? `
      <div class="info">
        ${e.najgorsze
          ? `Najmocniej ciągnie w dół <b>${bezpieczny(strefy[e.najgorsze.i].nazwa)}</b>:
             ${liczba(e.najgorsze.udzial,1)}% wobec widełek
             ${e.najgorsze.lo}–${e.najgorsze.hi}%, czyli
             ${e.najgorsze.zaMalo ? "za mało" : "za dużo"} o
             ${liczba(e.najgorsze.poza,1)} punktu.`
          : `Każda strefa mieści się w widełkach.`}
        ${e.pi != null ? `
          <br>Wskaźnik polaryzacji: <b>${liczba(e.pi,2)}</b> —
          ${e.pi > 2 ? "rozkład jest spolaryzowany" : "rozkład NIE jest spolaryzowany"}
          (próg 2,00). Liczony jako log10(niska ÷ progowa × wysoka × 100)
          z ułamków czasu: ${e.trzy.map(x => liczba(x*100,0) + "%").join(" · ")}
          w zakresach niska / progowa / wysoka.` : ""}
      </div>` : `
      <div class="info">
        Ocena pojawi się razem z pierwszymi pomiarami — nie ma czego oceniać.
      </div>`}
  </section>`;
}

function opisEfektywnosci(w){
  if (w >= 85) return "rozkład jak z podręcznika";
  if (w >= 70) return "blisko wzorca";
  if (w >= 50) return "da się poprawić";
  if (w >= 25) return "rozkład rozjechany";
  return "to nie jest trening spolaryzowany";
}

/* Pierścień. Wycinki rysowane obwodem koła (stroke-dasharray), nie ścieżkami:
   łuk o stałej grubości wychodzi wtedy idealnie, a przerwa między wycinkami
   bierze się z samego dasharray. Między wycinkami zostaje 2 px tła, żeby dwa
   sąsiednie stopnie rampy nie zlewały się w jeden łuk. */
function pierscienStref(miara, rozklad){
  const W = 260, S = 130, R = 92, GRUBOSC = 30, PRZERWA = 2;
  const OBWOD = 2 * Math.PI * R;
  const def = STREFY[miara];
  const puste = !rozklad || !rozklad.suma;

  let g = `<svg viewBox="0 0 ${W} ${W}" width="100%" class="pierscien"
    preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Rozkład czasu po strefach ${miara === "tetno" ? "tętna" : "mocy"}">
    <g transform="rotate(-90 ${S} ${S})">`;

  if (puste){
    g += `<circle cx="${S}" cy="${S}" r="${R}" fill="none" stroke="var(--linia)"
           stroke-width="${GRUBOSC}"/>`;
  } else {
    let start = 0;
    strefyMiary(miara).forEach((z,i) => {
      const udzial = rozklad.sumy[i] / rozklad.suma;
      const dlugosc = udzial * OBWOD;
      if (dlugosc <= 0.4){ start += dlugosc; return; }   // strefa bez czasu
      // Przerwa zjada wycinek od obu stron; przy bardzo wąskim wycinku
      // rezygnujemy z niej, bo inaczej zniknąłby zupełnie.
      const p = dlugosc > PRZERWA * 3 ? PRZERWA : 0;
      g += `<circle class="wycinek" data-i="${i}" cx="${S}" cy="${S}" r="${R}"
             fill="none" stroke="var(--strefa-${miara}-${i+1})"
             stroke-width="${GRUBOSC}"
             stroke-dasharray="${(dlugosc - p).toFixed(2)} ${(OBWOD - dlugosc + p).toFixed(2)}"
             stroke-dashoffset="${(-(start + p/2)).toFixed(2)}"><title>${
             bezpieczny(z.nazwa)} — ${liczba(udzial*100,1)}%</title></circle>`;
      start += dlugosc;
    });
  }
  g += `</g></svg>`;
  return g;
}

function srodekPierscienia(miara, rozklad, dni){
  if (!rozklad || !rozklad.suma) return `
    <div class="srodek-glowna">—</div>
    <div class="srodek-podpis">brak pomiarów<br>w tym oknie</div>`;
  const e = efektywnoscRozkladu(miara, rozklad);
  return `
    <div class="srodek-etykieta">efektywność</div>
    <div class="srodek-glowna${e ? " ocena o-" + Math.floor(e.wynik/25) : ""}">${
      e ? e.wynik + "%" : "—"}</div>
    <div class="srodek-podpis">${e ? bezpieczny(opisEfektywnosci(e.wynik)) : ""}
      <br><span class="srodek-brak">${czasNaTekst(Math.round(rozklad.suma))} · ${dni} dni</span></div>`;
}

function legendaStref(miara, rozklad){
  return `<ul class="legenda-stref">` + strefyMiary(miara).map((z,i) => {
    const sek = rozklad ? rozklad.sumy[i] : 0;
    const udzial = rozklad && rozklad.suma ? sek / rozklad.suma : 0;
    return `
      <li class="wiersz-strefy${udzial ? "" : " pusty"}" data-i="${i}">
        <span class="prostokat" style="background:var(--strefa-${miara}-${i+1})"></span>
        <span class="nazwa-strefy">${bezpieczny(z.nazwa)}</span>
        <span class="udzial-strefy">${udzial ? liczba(udzial*100,1) + "%" : "—"}</span>
        <span class="czas-strefy">${sek ? czasNaTekst(Math.round(sek)) : ""}</span>
      </li>`;
  }).join("") + `</ul>`;
}

// Przełącznik okna żyje w adresie (#objetosc/tetno/30), nie w zmiennej —
// dzięki temu wstecz i odświeżenie działają bez dodatkowego stanu, tak samo
// jak wybór segmentu w Porównaniach.
function przelacznikOkien(miara, dni){
  return `<div class="okna-przelacznik" role="group" aria-label="Zakres dni">` +
    STREFY.okna_dni.map(d => `
      <a class="okno${d === dni ? " akt" : ""}" href="#objetosc/${miara}/${d}"
         ${d === dni ? 'aria-current="true"' : ""}>${d} dni</a>`).join("") + `</div>`;
}

function objetosc(miara, arg){
  if (!STREFY) return pusto("Objętość");
  const def = STREFY[miara];
  const dozwolone = STREFY.okna_dni;
  const dni = dozwolone.includes(Number(arg)) ? Number(arg)
    : (STREFY.okno_domyslne || dozwolone[0]);
  const rozklad = rozkladStref(miara, dni);
  const tetno = miara === "tetno";

  return `
  <section id="objetosc" data-miara="${miara}" data-dni="${dni}">
    <h2>${tetno ? "Strefy tętna" : "Strefy mocy"}</h2>
    <p class="opis">
      Ile czasu spędziłeś w każdej strefie ${tetno ? "tętna" : "mocy"} przez
      ostatnie ${dni} dni — wszystkie jazdy razem, nie pojedyncza.
      ${tetno
        ? `Pojedynczą jazdę pokazuje Strava; tutaj chodzi o to, czy <b>cały
           tydzień albo miesiąc</b> wygląda tak, jak miał wyglądać.`
        : `Moc jest mierzona tylko tam, gdzie naprawdę ją zmierzono — dziś
           znaczy to trenażer, a sesje ERG odpadają, bo opisują plan, a nie Ciebie.`}
      <br>Barwy idą od chłodnej do gorącej: niebieski to najlżejsza strefa,
      czerwony najcięższa. Dobrane tak, żeby dwie sąsiednie dało się rozróżnić
      także przy daltonizmie — sprawdzone liczbowo, nie okiem.
    </p>
    ${przelacznikOkien(miara, dni)}
    <div class="strefy-uklad">
      <div class="pierscien-obudowa">
        ${pierscienStref(miara, rozklad)}
        <div class="pierscien-srodek" id="srodek-stref">
          ${srodekPierscienia(miara, rozklad, dni)}
        </div>
      </div>
      <div class="strefy-bok">
        ${legendaStref(miara, rozklad)}
      </div>
    </div>
    ${!rozklad || !rozklad.suma ? `
      <div class="info">
        <b>Nie ma jeszcze czego rysować.</b>
        ${tetno
          ? `Pas piersiowy wchodzi do jazd <b>${pl(def.od_daty)}</b> — dopiero
             od tego dnia jazdy niosą zapis tętna. Wykres wypełni się sam,
             bez zmiany w kodzie: automat dopisze sekundy w strefach do
             <code>dane.js</code>, a strona je zsumuje.`
          : `Granice stref mocy nie są jeszcze ustalone — czekają na Twój
             przelicznik. Do tego czasu nie ma z czego liczyć rozkładu i strona
             nie będzie niczego zgadywać.`}
        <br>Sam podział jest już gotowy: ${strefyMiary(miara).length} stref, tyle samo
        co daje Strava${tetno ? "" : " (model Coggana)"}, nazwy z
        <code>TRENING.md</code>.
      </div>` : ""}
    ${blokEfektywnosci(miara, rozklad)}
    ${tabelaStrefHTML(miara)}
    <div class="info">
      <b>Jak liczony jest procent.</b> Sumujemy sekundy w danej strefie ze
      wszystkich jazd w oknie i dzielimy przez sumę wszystkich sekund. Dwie
      jazdy po godzinie, jedna 70% w Z2 i druga 60% w Z2, dają
      (0,7 + 0,6) / 2 = <b>65%</b>. Przy jazdach różnej długości waży je sam
      czas — i tak ma być: godzina w Z2 waży więcej niż dziesięć minut w Z2.
    </div>
  </section>`;
}

// Dotknięcie wycinka albo wiersza legendy wkłada szczegół strefy do środka
// pierścienia. Klasy przekładamy, nie przerysowujemy — wykres ma zostać.
function podepnijStrefy(){
  const tresc = document.getElementById("tresc");
  if (!tresc || tresc.dataset.strefyPodpiete) return;
  tresc.dataset.strefyPodpiete = "1";

  const wybierz = (i) => {
    const korzen = document.getElementById("objetosc");
    if (!korzen) return;
    const miara = korzen.dataset.miara, dni = +korzen.dataset.dni;
    const rozklad = rozkladStref(miara, dni);
    const srodek = document.getElementById("srodek-stref");
    if (!srodek || !rozklad || !rozklad.suma) return;

    for (const el of tresc.querySelectorAll("[data-i]"))
      el.classList.toggle("wybrany", i != null && +el.dataset.i === i);

    if (i == null){
      srodek.innerHTML = srodekPierscienia(miara, rozklad, dni);
      return;
    }
    const z = strefyMiary(miara)[i];
    const sek = rozklad.sumy[i];
    const e = efektywnoscRozkladu(miara, rozklad);
    const o = e && e.odchylenia[i];
    srodek.innerHTML = `
      <div class="srodek-etykieta">${bezpieczny(z.nazwa)}</div>
      <div class="srodek-glowna">${liczba(sek / rozklad.suma * 100, 1)}%</div>
      <div class="srodek-podpis">${czasNaTekst(Math.round(sek))}
        <br><span class="srodek-brak">${o
          ? (o.poza > 0
              ? `${o.zaMalo ? "za mało" : "za dużo"} · wzorzec ${o.lo}–${o.hi}%`
              : `w widełkach ${o.lo}–${o.hi}%`)
          : ""}</span></div>`;
  };

  const zZdarzenia = e => {
    const cel = e.target.closest("circle.wycinek, li.wiersz-strefy");
    return cel ? +cel.dataset.i : null;
  };
  tresc.addEventListener("click", e => {
    if (!document.getElementById("objetosc")) return;
    const i = zZdarzenia(e);
    const juz = e.target.closest(".wybrany");
    wybierz(i != null && !juz ? i : null);
  });
}


/* ==========================================================================
   STAN WYTRENOWANIA

   Strava rysuje własną krzywą Fitness, ale NIE oddaje jej przez API — nie ma
   takiego zapytania. Liczymy więc u siebie, tą samą metodą co ona, z danych,
   które API oddaje.

   Obciążenie dnia = minuty ruchu × RPE (session-RPE, Foster 1998). Przy braku
   miernika mocy i pasa tętna to najlepsza dostępna miara wysiłku — tak samo
   mówi TRENING.md §8.6. Z obciążenia dwie średnie wykładnicze:

     wytrenowanie (42 dni)  — ile pracy siedzi w nogach
     zmęczenie   (7 dni)    — ile z tego jeszcze boli
     forma = wytrenowanie − zmęczenie

   Obie linie są w TYCH SAMYCH jednostkach, więc wolno im stać na jednym
   rysunku i jednej osi — zakaz dwóch osi dotyczy dwóch RÓŻNYCH miar.
   Zmęczenie jest cienkie i szare, bo to tło dla wytrenowania, nie druga
   opowieść.
   ========================================================================== */

const KONF_FORMY = D.stan_wytrenowania || null;

function seriaFormy(){
  if (!KONF_FORMY) return null;
  const od = KONF_FORMY.od_daty;
  const jazdyF = JAZDY_GABLOTA.filter(a => a.data.slice(0,10) >= od
    && a.data.slice(0,10) <= DZIS && a.rpe != null && a.czas_ruchu_s);
  if (!jazdyF.length) return null;

  // Obciążenie na dzień. Dwie jazdy tego samego dnia sumują się.
  const obciazenie = new Map();
  for (const a of jazdyF){
    const d = a.data.slice(0,10);
    obciazenie.set(d, (obciazenie.get(d) || 0) + (a.czas_ruchu_s / 60) * a.rpe);
  }
  const bezRPE = JAZDY_GABLOTA.filter(a => a.data.slice(0,10) >= od
    && a.data.slice(0,10) <= DZIS && a.rpe == null).length;

  // Średnia wykładnicza: dzisiejsza wartość to wczorajsza plus ułamek różnicy.
  // Ułamek 1 − e^(−1/τ) to klasyczna postać, ta sama, której używa model
  // Banistera i za nim wszystkie liczniki formy.
  const kCTL = 1 - Math.exp(-1 / KONF_FORMY.ctl_dni);
  const kATL = 1 - Math.exp(-1 / KONF_FORMY.atl_dni);
  const dni = [];
  let ctl = 0, atl = 0;
  for (let t = naDzien(od); t <= naDzien(DZIS); t += 86400000){
    const d = dzienNaTekst(t);
    const l = obciazenie.get(d) || 0;
    ctl += (l - ctl) * kCTL;
    atl += (l - atl) * kATL;
    dni.push({ data: d, obciazenie: l, ctl, atl, forma: ctl - atl });
  }
  return { dni, jazd: jazdyF.length, bezRPE,
    szczyt: dni.reduce((a,b) => b.ctl > a.ctl ? b : a) };
}

function wykresFormy(seria){
  const W = 720, H = 300, lewy = 44, prawy = 16, gora = 18, dol = 34;
  const px = W - lewy - prawy, py = H - gora - dol;
  const d = seria.dni;
  const maks = Math.max(...d.map(x => Math.max(x.ctl, x.atl)), 1);
  const goraY = Math.ceil(maks * 1.15 / 10) * 10;
  const x = i => lewy + (d.length === 1 ? px/2 : (i / (d.length - 1)) * px);
  const y = v => gora + py - (v / goraY) * py;
  const krok = goraY > 200 ? 50 : goraY > 100 ? 25 : 10;

  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" id="svg-formy"
    preserveAspectRatio="none" role="img"
    aria-label="Stan wytrenowania w czasie">`;
  for (let v = 0; v <= goraY; v += krok){
    g += `<line x1="${lewy}" y1="${y(v)}" x2="${W-prawy}" y2="${y(v)}"
           stroke="var(--linia)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    g += `<text x="${lewy-7}" y="${y(v)+4}" text-anchor="end" font-size="11"
           fill="var(--slaby)">${v}</text>`;
  }
  // Podpis miesiąca przy pierwszym dniu każdego miesiąca.
  let poprzedniX = -99;
  d.forEach((p,i) => {
    if (p.data.slice(8,10) !== "01" || x(i) - poprzedniX < 52) return;
    poprzedniX = x(i);
    g += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11"
           fill="var(--slaby)">${miesiacNaTekst(p.data.slice(0,7))}</text>`;
  });
  // Kreska pod osią w dniu każdej jazdy — widać, skąd biorą się wzrosty.
  for (let i = 0; i < d.length; i++)
    if (d[i].obciazenie > 0)
      g += `<line x1="${x(i)}" y1="${gora+py}" x2="${x(i)}" y2="${gora+py+5}"
             stroke="var(--akcent)" stroke-width="1.5" opacity=".45"
             vector-effect="non-scaling-stroke"/>`;

  const sciezka = (pole) => d.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p[pole]).toFixed(1)}`).join(" ");
  g += `<path d="${sciezka("ctl")} L${x(d.length-1)} ${y(0)} L${x(0)} ${y(0)} Z"
         fill="var(--akcent)" opacity=".10"/>`;
  g += `<path d="${sciezka("atl")}" fill="none" stroke="var(--slaby)" stroke-width="1.4"
         stroke-dasharray="4 3" opacity=".8" vector-effect="non-scaling-stroke"/>`;
  g += `<path d="${sciezka("ctl")}" fill="none" stroke="var(--akcent)" stroke-width="2.4"
         stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  g += `<line id="krzyzyk-formy" x1="0" y1="${gora}" x2="0" y2="${gora+py}"
         stroke="var(--tekst)" stroke-width="1" opacity="0"
         vector-effect="non-scaling-stroke"/>`;
  g += `<circle id="punkt-formy" r="4.5" fill="var(--akcent)"
         stroke="var(--powierzchnia)" stroke-width="2" opacity="0"/>`;
  g += `<line x1="${lewy}" y1="${gora+py}" x2="${W-prawy}" y2="${gora+py}"
         stroke="var(--slaby)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
  return { svg: g, geometria: { W, H, lewy, prawy, gora, dol, px, py, goraY } };
}

function odczytFormy(p){
  return `
    <span class="odczyt-data">${pl(p.data)}</span>
    <span class="odczyt-liczba"><b>${Math.round(p.ctl)}</b> wytrenowanie</span>
    <span class="odczyt-liczba odczyt-zmeczenie">${Math.round(p.atl)} zmęczenie</span>
    <span class="odczyt-liczba odczyt-forma ${p.forma >= 0 ? "dodatnia" : "ujemna"}"
      >${p.forma >= 0 ? "+" : "−"}${Math.abs(Math.round(p.forma))} forma</span>
    ${p.obciazenie > 0
      ? `<span class="odczyt-jazda">jazda · obciążenie ${Math.round(p.obciazenie)}</span>`
      : `<span class="odczyt-jazda pusty">bez jazdy</span>`}`;
}

function stanWytrenowania(){
  if (!KONF_FORMY) return pusto("Stan wytrenowania");
  const seria = seriaFormy();
  if (!seria) return `
    <div class="pusto">
      <span class="znak">Stan wytrenowania</span>
      Nie ma jeszcze jazd z wpisanym RPE po ${pl(KONF_FORMY.od_daty)}.
    </div>`;

  const w = wykresFormy(seria);
  const dzis = seria.dni[seria.dni.length-1];

  return `
  <section id="forma" data-od="${KONF_FORMY.od_daty}">
    <h2>Stan wytrenowania</h2>
    <p class="opis">
      Gruba linia to <b>wytrenowanie</b> — ile pracy siedzi w nogach po
      ${KONF_FORMY.ctl_dni} dniach. Cienka przerywana to <b>zmęczenie</b> z ostatnich
      ${KONF_FORMY.atl_dni} dni. Różnica między nimi to <b>forma</b>: dodatnia znaczy
      wypoczęty, ujemna — obciążony. Kreski pod osią to dni z jazdą.
      <br>Dotknij wykresu albo przesuń po nim palcem, żeby odczytać dowolny dzień.
    </p>
    <div class="odczyt-formy" id="odczyt-formy">${odczytFormy(dzis)}</div>
    <div class="wykres-formy" id="wykres-formy">${w.svg}</div>
    <div class="legenda">
      <span><i style="background:var(--akcent)"></i>wytrenowanie (${KONF_FORMY.ctl_dni} dni)</span>
      <span><i class="kreska" style="color:var(--slaby)"></i>zmęczenie (${KONF_FORMY.atl_dni} dni)</span>
    </div>
    <div class="kafelki" style="margin-top:16px">
      <div class="kafel">
        <div class="etykieta">Wytrenowanie dziś</div>
        <div class="liczba">${Math.round(dzis.ctl)}</div>
        <div class="stopka">szczyt ${Math.round(seria.szczyt.ctl)} · ${pl(seria.szczyt.data)}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Forma dziś</div>
        <div class="liczba">${dzis.forma >= 0 ? "+" : "−"}${Math.abs(Math.round(dzis.forma))}</div>
        <div class="stopka">${dzis.forma >= 0 ? "wypoczęty" : "obciążony"}</div>
      </div>
      <div class="kafel">
        <div class="etykieta">Jazd w wykresie</div>
        <div class="liczba">${seria.jazd}</div>
        <div class="stopka">od ${pl(KONF_FORMY.od_daty)}</div>
      </div>
    </div>
    <div class="info">
      <b>To nie jest liczba ze Stravy.</b> Strava rysuje własną krzywą Fitness, ale
      nie oddaje jej przez API — nie ma takiego zapytania. Liczymy ją u siebie tą
      samą metodą: obciążenie dnia to <b>minuty ruchu × RPE</b> (session-RPE,
      Foster 1998), a z niego dwie średnie wykładnicze o stałych
      ${KONF_FORMY.ctl_dni} i ${KONF_FORMY.atl_dni} dni.
      <br>Skala jest więc <b>własna</b> i nie da się jej porównywać z liczbą ze
      Stravy ani z cudzą — porównywalny jest wyłącznie jej przebieg w czasie.
      Wykres startuje ${pl(KONF_FORMY.od_daty)}, bo od tego dnia każda jazda ma
      wpisane RPE${seria.bezRPE ? ` (${seria.bezRPE} bez RPE zostało pominiętych)` : ""};
      wcześniejsze jazdy liczone jako zero dawałyby fałszywy dołek.
      <br>Gdy ruszy pas tętna, obciążenie policzymy dokładniej (TRIMP), a po
      mierniku mocy jeszcze dokładniej (TSS) — metoda siedzi w
      <code>dane.js</code>, więc zmiana nie wymaga ruszania wykresu.
    </div>
  </section>`;
}

// Odczyt punktu: mysz i palec obsłużone tym samym zdarzeniem wskaźnika.
function podepnijForme(){
  const tresc = document.getElementById("tresc");
  if (!tresc || tresc.dataset.formaPodpieta) return;
  tresc.dataset.formaPodpieta = "1";

  let seria = null;
  const pokaz = (klientX) => {
    const svg = document.getElementById("svg-formy");
    const odczyt = document.getElementById("odczyt-formy");
    if (!svg || !odczyt) return;
    if (!seria) seria = seriaFormy();
    if (!seria) return;
    const r = svg.getBoundingClientRect();
    const W = 720, lewy = 44, prawy = 16, gora = 18, dol = 34, H = 300;
    const px = W - lewy - prawy, py = H - gora - dol;
    // preserveAspectRatio="none" — skala pozioma i pionowa liczą się osobno.
    const uX = (klientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(seria.dni.length - 1,
      Math.round((uX - lewy) / px * (seria.dni.length - 1))));
    const p = seria.dni[i];
    odczyt.innerHTML = odczytFormy(p);

    const maks = Math.max(...seria.dni.map(x => Math.max(x.ctl, x.atl)), 1);
    const goraY = Math.ceil(maks * 1.15 / 10) * 10;
    const xi = lewy + (seria.dni.length === 1 ? px/2 : (i / (seria.dni.length - 1)) * px);
    const yi = gora + py - (p.ctl / goraY) * py;
    const kreska = document.getElementById("krzyzyk-formy");
    const punkt = document.getElementById("punkt-formy");
    kreska.setAttribute("x1", xi); kreska.setAttribute("x2", xi);
    kreska.setAttribute("opacity", ".35");
    punkt.setAttribute("cx", xi); punkt.setAttribute("cy", yi);
    punkt.setAttribute("opacity", "1");
  };

  tresc.addEventListener("pointermove", e => {
    if (e.target.closest && e.target.closest("#wykres-formy")) pokaz(e.clientX);
  });
  tresc.addEventListener("pointerdown", e => {
    if (e.target.closest && e.target.closest("#wykres-formy")) pokaz(e.clientX);
  });
}


/* ==========================================================================
   REGENERACJA

   Garmin liczy czas regeneracji z EPOC, czyli z tętna — tego jeszcze nie ma,
   więc liczymy z RPE, które Fryderyk wpisuje po każdej jeździe. Wzór:

     godziny = 0,8 × minuty_ruchu × (RPE / 10) ^ 1,9

   Wykładnik przy RPE jest po to, żeby intensywność ważyła mocniej niż czas:
   pół godziny na maksa kosztuje więcej niż dwie godziny spokojnej jazdy.
   Zakotwiczenie: lekka godzina daje ~5 h, mocna jednostka 90 min ~47 h, co
   zgadza się z regułą „48-72 h między twardymi treningami".

   ZALEGŁOŚĆ. Jazda zaczęta przed końcem poprzedniej regeneracji dolicza
   POŁOWĘ zaległych godzin — nie całość, bo część regeneracji biegnie
   równolegle, i nie zero, bo wtedy dwa mocne dni pod rząd wyglądałyby jak
   jeden. Wszystkie te liczby siedzą w dane.js.

   ODLICZANIE IDZIE OD ZEGARA URZĄDZENIA. To drugie i ostatnie miejsce na
   stronie, gdzie pytamy o realny czas (pierwsze to pasek świeżości danych) —
   licznik, który stoi, nie jest licznikiem.
   ========================================================================== */

const KONF_REGEN = D.regeneracja || null;
const czasJazdyMs = (a) => new Date(a.data).getTime();

function planRegeneracji(){
  if (!KONF_REGEN) return null;
  const jazdyR = JAZDY_GABLOTA
    .filter(a => a.rpe != null && a.czas_ruchu_s)
    .sort((x,y) => x.data < y.data ? -1 : 1);
  if (!jazdyR.length) return null;

  const wpisy = [];
  let poprzedniKoniec = 0;                    // moment końca poprzedniej regeneracji
  for (const a of jazdyR){
    const start = czasJazdyMs(a);
    const koniecJazdy = start + (a.czas_calkowity_s || a.czas_ruchu_s) * 1000;
    const bazowe = Math.min(KONF_REGEN.maks_godzin,
      KONF_REGEN.wspolczynnik * (a.czas_ruchu_s / 60)
        * Math.pow(a.rpe / 10, KONF_REGEN.wykladnik_rpe));
    // Ile regeneracji zostało niedokończonej w chwili STARTU tej jazdy.
    const zalegleGodz = poprzedniKoniec > start
      ? (poprzedniKoniec - start) / 3600000 : 0;
    const razem = Math.min(KONF_REGEN.maks_godzin,
      bazowe + zalegleGodz * KONF_REGEN.udzial_zaleglosci);
    poprzedniKoniec = koniecJazdy + razem * 3600000;
    wpisy.push({ jazda: a, koniecJazdy, bazowe, zalegleGodz, razem,
      wygasa: poprzedniKoniec });
  }
  return wpisy;
}

function stanRegeneracji(teraz){
  const plan = planRegeneracji();
  if (!plan) return null;
  const ostatni = plan[plan.length-1];
  const zostaloMs = Math.max(0, ostatni.wygasa - teraz);
  const calosc = ostatni.razem * 3600000;
  const udzial = calosc ? Math.max(0, Math.min(1, zostaloMs / calosc)) : 0;

  // Napięcie: zmęczenie wobec wytrenowania. Obie liczby już mamy z krzywej formy.
  const seria = seriaFormy();
  const dzis = seria ? seria.dni[seria.dni.length-1] : null;
  const napiecie = dzis && dzis.ctl > 1 ? dzis.atl / dzis.ctl : 0;
  const k = KONF_REGEN.poziom;
  const n = Math.max(0, Math.min(1,
    (napiecie - k.napiecie_od) / (k.napiecie_do - k.napiecie_od)));
  const poziom = Math.max(1, Math.min(10,
    Math.round(1 + k.waga_zaleglosci * udzial + k.waga_napiecia * n)));
  const opis = KONF_REGEN.skala.find(s => s.poziom === poziom) || KONF_REGEN.skala[0];

  return { plan, ostatni, zostaloMs, udzial, poziom, opis, napiecie,
    ctl: dzis ? dzis.ctl : null, atl: dzis ? dzis.atl : null };
}

function godzinyNaTekst(ms){
  if (ms <= 0) return "0:00:00";
  const s = Math.floor(ms / 1000);
  return Math.floor(s/3600) + ":" + String(Math.floor(s%3600/60)).padStart(2,"0")
    + ":" + String(s%60).padStart(2,"0");
}
const godzinyKrotko = (h) => h >= 10 ? Math.round(h) + " h"
  : (Math.round(h*10)/10).toFixed(1).replace(".", ",") + " h";

/* Pierścień odliczania. Ta sama forma co pierścień stref — pusty środek niesie
   liczbę. Wypełnienie kurczy się w miarę upływu czasu, więc widać, ile jeszcze
   zostało, bez czytania cyfr. */
function pierscienRegeneracji(udzial, poziom){
  const S = 130, R = 92, G = 30, OBWOD = 2 * Math.PI * R;
  const dl = OBWOD * udzial;
  return `<svg viewBox="0 0 260 260" width="100%" class="pierscien" role="img"
    aria-label="Pozostały czas regeneracji">
    <g transform="rotate(-90 ${S} ${S})">
      <circle cx="${S}" cy="${S}" r="${R}" fill="none" stroke="var(--linia)"
        stroke-width="${G}"/>
      ${udzial > 0 ? `<circle id="luk-regeneracji" cx="${S}" cy="${S}" r="${R}"
        fill="none" stroke="var(--stan-${poziom})" stroke-width="${G}"
        stroke-linecap="butt"
        stroke-dasharray="${dl.toFixed(2)} ${(OBWOD-dl).toFixed(2)}"/>` : ""}
    </g></svg>`;
}

function miernikStanu(poziom){
  return `<div class="miernik-stanu" role="img"
      aria-label="Zmęczenie ${poziom} na 10">
    ${KONF_REGEN.skala.map(s => `<span class="stopien${
      s.poziom === poziom ? " akt" : ""}${s.poziom <= poziom ? " zapalony" : ""}"
      style="--barwa:var(--stan-${s.poziom})" title="${s.poziom}. ${bezpieczny(s.nazwa)}"
      ><b>${s.poziom}</b></span>`).join("")}
  </div>`;
}

function regeneracja(){
  if (!KONF_REGEN) return pusto("Regeneracja");
  const teraz = Date.now();
  const st = stanRegeneracji(teraz);
  if (!st) return `
    <div class="pusto">
      <span class="znak">Regeneracja</span>
      Nie ma jeszcze jazdy z wpisanym RPE — bez niej nie ma z czego liczyć.
    </div>`;

  const o = st.ostatni, gotowe = st.zostaloMs <= 0;
  const kiedyGotowy = new Date(o.wygasa);
  const dataGotowy = kiedyGotowy.toISOString().slice(0,10);
  const godzGotowy = String(kiedyGotowy.getHours()).padStart(2,"0") + ":"
    + String(kiedyGotowy.getMinutes()).padStart(2,"0");

  return `
  <section id="regeneracja" data-wygasa="${o.wygasa}" data-razem="${o.razem}">
    <h2>Regeneracja</h2>
    <p class="opis">
      Ile godzin dzieli Cię od pełnej gotowości po ostatniej jeździe. Licznik
      idzie <b>na żywo</b> — wejdziesz za pięć godzin, zobaczysz o pięć mniej.
      Nowa jazda przelicza go od nowa i <b>dolicza to, czego nie odrobiłeś</b>.
    </p>
    <div class="regen-uklad">
      <div class="pierscien-obudowa">
        ${pierscienRegeneracji(st.udzial, st.poziom)}
        <div class="pierscien-srodek">
          <div class="srodek-etykieta">${gotowe ? "stan" : "zostało"}</div>
          <div class="srodek-glowna regen-licznik" id="licznik-regeneracji">${
            gotowe ? "gotowy" : godzinyNaTekst(st.zostaloMs)}</div>
          <div class="srodek-podpis" id="licznik-podpis">${gotowe
            ? "regeneracja zakończona"
            : `pełna gotowość<br>${pl(dataGotowy)} o ${godzGotowy}`}</div>
        </div>
      </div>
      <div class="regen-bok">
        <div class="regen-zrodlo">
          <div class="etykieta">Po jeździe</div>
          <a class="odn" href="${adresStravy(o.jazda)}" target="_blank" rel="noopener"
            >${ikonaDyscypliny(o.jazda.typ,15)}
            <b>${bezpieczny(o.jazda.nazwa)}</b> &#8599;</a>${znacznikErg(o.jazda)}
          <div class="regen-rozbicie">
            <span><span class="etykieta">kiedy</span> ${pl(o.jazda.data)}</span>
            <span><span class="etykieta">czas</span> ${czasNaTekst(o.jazda.czas_ruchu_s)}</span>
            <span><span class="etykieta">RPE</span> ${o.jazda.rpe}/10</span>
          </div>
          <ul class="regen-skladniki">
            <li><span>za samą jazdę</span><b>${godzinyKrotko(o.bazowe)}</b></li>
            ${o.zalegleGodz > 0.05 ? `
              <li><span>zaległość z poprzedniej (połowa z
                ${godzinyKrotko(o.zalegleGodz)})</span>
                <b>+${godzinyKrotko(o.zalegleGodz * KONF_REGEN.udzial_zaleglosci)}</b></li>` : ""}
            <li class="suma"><span>przyznane łącznie</span><b>${godzinyKrotko(o.razem)}</b></li>
          </ul>
        </div>
      </div>
    </div>

    <section class="stan-blok">
      <h2>Twoje zmęczenie</h2>
      <p class="opis">
        Skala od 1 do 10 w kierunku indeksu Hoopera: <b>1 znaczy najlepiej,
        10 najgorzej</b>. Liczona z dwóch rzeczy — ile regeneracji zostało do
        odrobienia oraz jak zmęczenie z ostatnich ${KONF_FORMY.atl_dni} dni ma się
        do wytrenowania z ${KONF_FORMY.ctl_dni}.
      </p>
      ${miernikStanu(st.poziom)}
      <div class="stan-opis" style="--barwa:var(--stan-${st.poziom})">
        <div class="stan-numer">${st.poziom}</div>
