# Codziennie odświeża dane.js danymi ze Stravy i commituje, jeśli coś się
# zmieniło. Strona zostaje statyczna — odświeża się sam plik z danymi.

name: Strava — aktualizacja danych

on:
  schedule:
    # 20:00 UTC = 22:00 w Polsce latem, 21:00 zimą. Cron GitHuba chodzi na UTC.
    - cron: "0 20 * * *"
  workflow_dispatch:        # pozwala odpalić ręcznie przyciskiem
    inputs:
      pelne_opisy:
        description: "Odśwież opisy WSZYSTKICH jazd, nie tylko z ostatnich 30 dni"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # lts/* zamiast konkretnej wersji — nie zestarzeje się za dwa lata
          node-version: "lts/*"

      - name: Pobierz ze Stravy
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          # Przy uruchomieniu z harmonogramu inputs jest puste, więc wychodzi
          # "" i skrypt zostaje przy oknie 30 dni. Pełny przebieg tylko ręcznie.
          PELNE_OPISY: ${{ inputs.pelne_opisy }}
        run: node .github/skrypty/pobierz-strave.js

      - name: Sprawdź, czy plik się parsuje
        run: node -e "global.window={};require('./dane.js');
             const n=window.DANE.aktywnosci.length;
             if(!n) { console.error('Pusta lista — nie commituję.'); process.exit(1); }
             console.log('Plik poprawny, aktywności:', n);"

      - name: Commituj, jeśli są zmiany
        run: |
          if git diff --quiet dane.js; then
            echo "Bez zmian — nic do zrobienia."
            exit 0
          fi

          git config user.name "Automat Stravy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane.js
          git commit -m "Dane ze Stravy — $(date -u +%Y-%m-%d)"

          # Zadanie potrafi stać w kolejce GitHuba kilka minut. Jeśli w tym
          # czasie ktoś wypchnie cokolwiek na main, push zostanie odrzucony
          # ("fetch first") i cały przebieg pada — tak zginął przebieg #1.
          # Dlatego: przy odrzuceniu dociągamy zmiany i próbujemy ponownie.
          for proba in 1 2 3; do
            if git push; then
              echo "Zmiany wypchnięte (próba $proba)."
              exit 0
            fi
            echo "Ktoś wyprzedził automat — dociągam i próbuję ponownie ($proba/3)."
            git pull --rebase origin main || {
              echo "Rebase się nie udał — przerywam, żeby niczego nie nadpisać."
              exit 1
            }
          done
          echo "Nie udało się wypchnąć po trzech próbach."
          exit 1
