# Codziennie odświeża dane.js danymi ze Stravy i commituje, jeśli coś się
# zmieniło. Strona zostaje statyczna — odświeża się sam plik z danymi.

name: Strava — aktualizacja danych

on:
  schedule:
    # 20:37 UTC = 22:37 w Polsce latem, 21:37 zimą. Cron GitHuba chodzi na UTC.
    #
    # DWA ODPALENIA I MINUTA 37 — poprawka z 27.08.2026, nie cofać.
    # Przebieg z 26.08 w ogóle się nie odbył: GitHub gubi zadania z crona przy
    # obciążeniu, a najgorsza jest pełna godzina, bo wtedy startuje pół świata.
    # Minuta 37 omija ten szczyt, a poranne odpalenie łapie wieczorne, które
    # przepadło. Kosztuje kilka zapytań dziennie, bo skrypt i tak dociąga
    # wyłącznie to, czego nie ma.
    - cron: "37 20 * * *"
    - cron: "37 5 * * *"
  workflow_dispatch:        # pozwala odpalić ręcznie przyciskiem
    inputs:
      pelne_opisy:
        description: "Odśwież opisy WSZYSTKICH jazd, nie tylko z ostatnich 30 dni"
        type: boolean
        default: false
      pelne_segmenty:
        description: "Pobierz od nowa próby na segmentach dla wszystkich jazd od meta.segmenty_od"
        type: boolean
        default: false
      pelna_moc:
        description: "Przelicz krzywe mocy od nowa dla wszystkich jazd z miernikiem"
        type: boolean
        default: false
      pelne_strefy:
        description: "Przelicz rozkłady stref dla wszystkich jazd"
        type: boolean
        default: false
      pelne_trasy:
        description: "Dociągnij kształt trasy także dla jazd, których nie ma w liście"
        type: boolean
        default: false
      pelne_przebiegi:
        description: "Przelicz od nowa przebiegi jazd (prędkość, moc, tętno w czasie)"
        type: boolean
        default: false
      wymus_analize:
        description: "Napisz analizę AI ponownie, nawet jeśli dzisiejsza już jest (kosztuje ok. 0,19 USD)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # lts/* zamiast konkretnej wersji — nie zestarzeje się za dwa lata
          node-version: "lts/*"

      - name: Pobierz ze Stravy
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          # Przy uruchomieniu z harmonogramu inputs jest puste, więc wychodzi
          # "" i skrypt zostaje przy oknie 30 dni. Pełny przebieg tylko ręcznie.
          PELNE_OPISY: ${{ inputs.pelne_opisy }}
          PELNE_SEGMENTY: ${{ inputs.pelne_segmenty }}
          PELNA_MOC: ${{ inputs.pelna_moc }}
          PELNE_STREFY: ${{ inputs.pelne_strefy }}
          PELNE_TRASY: ${{ inputs.pelne_trasy }}
          PELNE_PRZEBIEGI: ${{ inputs.pelne_przebiegi }}
        run: node .github/skrypty/pobierz-strave.js

      - name: Sprawdź, czy plik się parsuje
        run: node -e "global.window={};require('./dane.js');
             const n=window.DANE.aktywnosci.length;
             if(!n) { console.error('Pusta lista — nie commituję.'); process.exit(1); }
             console.log('Plik poprawny, aktywności:', n);"

      # Analiza AI — DOKŁADNIE JEDNO PŁATNE WYWOŁANIE NA DOBĘ.
      #
      # W odróżnieniu od reszty przebiegu ten krok kosztuje pieniądze: około
      # 0,19 USD za wywołanie, czyli mniej więcej 6 USD miesięcznie przy jednym
      # dziennie. Fryderyk zgodził się na jedno i wyraźnie nie na dwa, więc
      # skrypt dostaje POWOD_ODPALENIA i sam decyduje:
      #   wieczor  (37 20 UTC) — normalne, główne odpalenie, pisze raz dziennie,
      #   poranek  (37 5 UTC)  — SIATKA: pisze tylko wtedy, gdy wieczór przepadł
      #                          (cron GitHuba potrafi zgubić zadanie — 26.08.2026),
      #   recznie              — przycisk, zachowuje się jak wieczór.
      # Bez klucza albo przy błędzie krok kończy się zerem: komentarz zostaje
      # ten, co był, a pobieranie danych leci dalej.
      - name: Napisz analizę AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WYMUS_ANALIZE: ${{ inputs.wymus_analize }}
          # Jedna linia świadomie: zwinięty blok YAML (">-") zostawia znak
          # nowej linii w środku ${{ }}, gdy druga linia jest wcięta głębiej.
          POWOD_ODPALENIA: ${{ github.event_name != 'schedule' && 'recznie' || (github.event.schedule == '37 5 * * *' && 'poranek' || 'wieczor') }}
        run: node .github/skrypty/analiza.js

      - name: Commituj, jeśli są zmiany
        run: |
          # Strażnik musi patrzeć na WSZYSTKO, co ten przebieg mógł wygenerować,
          # a nie na wybrane dwa pliki. Wcześniej sprawdzał tylko dane.js
          # i analiza.js — gdyby zmieniły się same przebiegi albo trasy, praca
          # przepadłaby po cichu. Nowe pliki w katalogu też się liczą, więc
          # najpierw git add, a dopiero potem pytanie „czy coś jest".
          git config user.name "Automat Stravy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dane.js analiza.js trasy.js przebiegi.js przebiegi/

          if git diff --cached --quiet; then
            echo "Bez zmian — nic do zrobienia."
            exit 0
          fi
          git commit -m "Dane ze Stravy — $(date -u +%Y-%m-%d)"

          # Zadanie potrafi stać w kolejce GitHuba kilka minut. Jeśli w tym
          # czasie ktoś wypchnie cokolwiek na main, push zostanie odrzucony
          # ("fetch first") i cały przebieg pada — tak zginął przebieg #1.
          # Dlatego: przy odrzuceniu dociągamy zmiany i próbujemy ponownie.
          for proba in 1 2 3; do
            if git push; then
              echo "Zmiany wypchnięte (próba $proba)."
              exit 0
            fi
            echo "Ktoś wyprzedził automat — dociągam i próbuję ponownie ($proba/3)."
            git pull --rebase origin main || {
              echo "Rebase się nie udał — przerywam, żeby niczego nie nadpisać."
              exit 1
            }
          done
          echo "Nie udało się wypchnąć po trzech próbach."
          exit 1
